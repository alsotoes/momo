# MemPalace configuration for momo project
# Run: mempalace mine . --wing momo --config mempalace.yaml

version: 1
project: momo

# Source directories to index (relative to repo root)
include:
  - src/
  - tests/
  - tools/
  - openspec/
  - docs/
  - conf/
  - hooks/
  - pentest/
  - .github/scripts/
  - .github/workflows/
  - Makefile
  - go.mod
  - go.sum
  - go.work
  - go.work.sum
  - Dockerfile
  - docker-compose*.yml
  - repomix.config.json
  - AGENTS.md
  - README.md
  - LICENSE

# Directories/files to exclude from indexing
exclude:
  - vendor/
  - "**/*.test"
  - "**/*.out"
  - "**/*.prof"
  - "*.exe"
  - "*.dll"
  - "*.so"
  - "*.dylib"
  - "momo"
  - "src/momo"
  - "src/src"
  - "body*.txt"
  - "**/__pycache__/"
  - ".github/scripts/__pycache__/"
  - "pentest/server-logs/"
  - "pentest/fuzzing-reports/"
  - "pentest-results/"
  - "repomix-output.*"
  - "*.repomix.*"
  - "node_modules/"
  - "package-lock.json"
  - "package.json"
  - "mempalace.yaml"
  - "entities.json"
  - ".cortexkit/"
  - "skills-lock.json"
  - "**/skills-lock.json"
  - ".kiro/"
  - "**/.kiro/"
  - "plan.md"
  - "**/plan.md"
  - "docs/html/"
  - "received_files/"
  - "test_data/"
  - "*.swp"
  - "venv/"
  - "**/bin"
  - "conf/smoke.conf"
  - "test.sh"
  - "*_filtered.txt"
  - "*_bench*.txt"
  - "empty.txt"
  - ".gemini/"
  - ".jules/"
  - ".agents/"
  - ".git/"
  - ".gitignore"
  - ".gitmodules"

# File type handlers
handlers:
  # Go source files
  - pattern: "**/*.go"
    type: code
    language: go
  # Markdown files (specs, docs, ADRs)
  - pattern: "**/*.md"
    type: document
    language: markdown
  # YAML config files
  - pattern: "**/*.yaml"
    type: config
    language: yaml
  - pattern: "**/*.yml"
    type: config
    language: yaml
  # Python scripts
  - pattern: "**/*.py"
    type: code
    language: python
  # Shell scripts
  - pattern: "**/*.sh"
    type: code
    language: shell
  # Docker files
  - pattern: "Dockerfile*"
    type: config
    language: dockerfile
  - pattern: "docker-compose*.yml"
    type: config
    language: yaml
  # Makefile
  - pattern: "Makefile"
    type: config
    language: makefile
  # Go module files
  - pattern: "go.mod"
    type: config
    language: go
  - pattern: "go.sum"
    type: config
    language: text
  - pattern: "go.work"
    type: config
    language: go
  - pattern: "go.work.sum"
    type: config
    language: text

# Wing/room organization for momo project
organization:
  wing: momo
  rooms:
    - name: specs
      description: "OpenSpec changes, proposals, and specifications"
      patterns:
        - "openspec/**"
    - name: architecture
      description: "Architecture decisions, ADRs, design docs"
      patterns:
        - "docs/adr/**"
        - "docs/ARCHITECTURE.md"
        - "docs/ROADMAP.md"
    - name: source
      description: "Core Go source code"
      patterns:
        - "src/**"
    - name: tests
      description: "Test files and test infrastructure"
      patterns:
        - "tests/**"
        - "**/*_test.go"
    - name: tools
      description: "Build tools and utilities"
      patterns:
        - "tools/**"
    - name: ci
      description: "CI/CD pipelines and scripts"
      patterns:
        - ".github/workflows/**"
        - ".github/scripts/**"
    - name: config
      description: "Configuration files"
      patterns:
        - "conf/**"
        - "*.yaml"
        - "*.yml"
        - "Makefile"
        - "go.mod"
        - "go.sum"
    - name: pentest
      description: "Security testing and pentest artifacts"
      patterns:
        - "pentest/**"
    - name: docs
      description: "Documentation and blog posts"
      patterns:
        - "docs/blog/**"
        - "docs/*.md"
    - name: steering
      description: "Project steering rules and standards"
      patterns:
        - "openspec/config.yaml"
        - "docs/STANDARDS.md"
        - "AGENTS.md"
        - "docs/AI_FLYING_SOLO.md"

# Mining options
mining:
  # Maximum file size to process (10MB)
  max_file_size: 10485760
  # Follow symlinks
  follow_symlinks: false
  # Extract code structure (functions, types, etc.)
  extract_structure: true
  # Generate embeddings for semantic search
  generate_embeddings: true
  # Embedding model (uses local sentence-transformers)
  embedding_model: "all-MiniLM-L6-v2"
  # Chunk size for large files
  chunk_size: 2000
  # Chunk overlap
  chunk_overlap: 200