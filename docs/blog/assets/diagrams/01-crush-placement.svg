<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="crush-title crush-desc">
  <!-- Momo Engineering Blog - CRUSH-lite Placement Diagram -->
  <title id="crush-title">CRUSH-lite Placement Algorithm Flow</title>
  <desc id="crush-desc">Flow diagram showing CRUSH-lite deterministic weighted placement: object hash input → weighted rendezvous hashing scores each node → sort by score → stable replica list → failure domain filter → final placement</desc>
  
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="var(--diagram-primary)"/>
    </marker>
    <marker id="arrow-success" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="var(--diagram-success)"/>
    </marker>
    <marker id="arrow-structure" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="var(--diagram-structure)"/>
    </marker>
    
    <!-- Gradient for primary flow -->
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:var(--momo)"/>
      <stop offset="100%" style="stop-color:var(--sakura)"/>
    </linearGradient>
    
    <!-- Drop shadow -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="var(--bark)" flood-opacity="0.15"/>
    </filter>
    
    <!-- Node style classes -->
    <style>
      .step-box { filter: url(#drop-shadow); }
      .step-box:hover { filter: url(#drop-shadow) brightness(1.1); }
      .flow-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: var(--diagram-text-muted); }
      .step-title { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; fill: var(--diagram-text); }
      .step-desc { font-family: 'Outfit', sans-serif; font-size: 10px; fill: var(--diagram-text-muted); }
      .code-snippet { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--momo); }
      .legend-text { font-family: 'Outfit', sans-serif; font-size: 11px; fill: var(--diagram-text); }
      .legend-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--diagram-text-muted); }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="var(--diagram-bg)"/>
  
  <!-- Title -->
  <text x="400" y="35" class="diagram-title" id="main-title">CRUSH-lite: Deterministic Weighted Placement</text>
  <text x="400" y="55" class="diagram-subtitle">Weighted rendezvous hashing → stable replica list → failure domain awareness</text>
  
  <!-- Step 1: Input -->
  <g class="step-box" transform="translate(40, 90)">
    <rect x="0" y="0" width="160" height="100" rx="8" ry="8" class="diagram-node" stroke="var(--momo)"/>
    <text x="80" y="25" class="step-title" text-anchor="middle">1. INPUT</text>
    <text x="80" y="45" class="step-desc" text-anchor="middle">Object Hash (SHA-256)</text>
    <text x="80" y="62" class="code-snippet" text-anchor="middle">placementKey = blobID</text>
    <text x="80" y="78" class="step-desc" text-anchor="middle">Already computed on ingest</text>
    <text x="80" y="93" class="flow-text" text-anchor="middle">(content-addressed)</text>
  </g>
  
  <!-- Arrow 1→2 -->
  <path d="M200,140 H280" class="diagram-flow" marker-end="url(#arrow)"/>
  
  <!-- Step 2: Scoring -->
  <g class="step-box" transform="translate(290, 70)">
    <rect x="0" y="0" width="220" height="140" rx="8" ry="8" class="diagram-node" stroke="var(--momo)"/>
    <text x="110" y="25" class="step-title" text-anchor="middle">2. SCORE CANDIDATES</text>
    <text x="110" y="45" class="step-desc" text-anchor="middle">Weighted Rendezvous Hashing</text>
    <g transform="translate(10, 55)">
      <text x="0" y="0" class="code-snippet">for node in candidates:</text>
      <text x="0" y="16" class="code-snippet">  score = hash(key ⊗ node.id)</text>
      <text x="0" y="32" class="code-snippet">  score *= node.weight  // weighted</text>
      <text x="0" y="48" class="code-snippet">  score = fold52(score)  // float64 safe</text>
    </g>
  </g>
  
  <!-- Arrow 2→3 -->
  <path d="M510,140 H590" class="diagram-flow" marker-end="url(#arrow)"/>
  
  <!-- Step 3: Sort -->
  <g class="step-box" transform="translate(600, 90)">
    <rect x="0" y="0" width="160" height="100" rx="8" ry="8" class="diagram-node" stroke="var(--sakura)"/>
    <text x="80" y="25" class="step-title" text-anchor="middle">3. SORT</text>
    <text x="80" y="45" class="step-desc" text-anchor="middle">Deterministic Order</text>
    <text x="80" y="62" class="code-snippet" text-anchor="middle">sort.Stable(byScore)</text>
    <text x="80" y="78" class="step-desc" text-anchor="middle">Ties never flip (#872)</text>
    <text x="80" y="93" class="flow-text" text-anchor="middle">52-bit mantissa (#873)</text>
  </g>
  
  <!-- Arrow 3→4 -->
  <path d="M470,190 V250" class="diagram-flow" marker-end="url(#arrow)"/>
  <path d="M510,190 V250" class="diagram-flow" marker-end="url(#arrow)"/>
  
  <!-- Step 4: Replica List -->
  <g class="step-box" transform="translate(400, 260)">
    <rect x="0" y="0" width="200" height="100" rx="8" ry="8" class="diagram-node" stroke="var(--peach)"/>
    <text x="100" y="25" class="step-title" text-anchor="middle">4. REPLICA LIST</text>
    <text x="100" y="45" class="step-desc" text-anchor="middle">Top-N by Score</text>
    <g transform="translate(10, 55)">
      <text x="0" y="0" class="code-snippet">replicas = sorted[:N]</text>
      <text x="0" y="16" class="code-snippet">// e.g., [N3, N1, N7]</text>
      <text x="0" y="32" class="flow-text">No central allocator</text>
      <text x="0" y="46" class="flow-text">Every node computes same</text>
    </g>
  </g>
  
  <!-- Arrow 4→5 -->
  <path d="M500,360 V420" class="diagram-flow" marker-end="url(#arrow)"/>
  
  <!-- Step 5: Failure Domain Filter -->
  <g class="step-box" transform="translate(370, 430)">
    <rect x="0" y="0" width="260" height="120" rx="8" ry="8" class="diagram-node" stroke="var(--leaf)"/>
    <text x="130" y="25" class="step-title" text-anchor="middle">5. FAILURE DOMAIN FILTER (R1)</text>
    <text x="130" y="45" class="step-desc" text-anchor="middle">Constrain replicas across rack/zone/DC</text>
    <g transform="translate(10, 55)">
      <text x="0" y="0" class="code-snippet">for replica in replicas:</text>
      <text x="0" y="16" class="code-snippet">  if replica.domain in used:</text>
      <text x="0" y="32" class="code-snippet">    replica = nextBest()</text>
      <text x="0" y="48" class="code-snippet">  used.add(replica.domain)</text>
      <text x="0" y="64" class="flow-text">Rack → Zone → DC hierarchy</text>
      <text x="0" y="78" class="flow-text">Replicas never share domain</text>
    </g>
  </g>
  
  <!-- Arrow 5→6 -->
  <path d="M500,550 V570" class="diagram-flow-success" marker-end="url(#arrow-success)"/>
  
  <!-- Step 6: Final Placement -->
  <g class="step-box" transform="translate(400, 570)">
    <rect x="0" y="0" width="200" height="30" rx="8" ry="8" class="diagram-node" stroke="var(--leaf)" fill="rgba(118,146,103,0.1)"/>
    <text x="100" y="20" class="step-title" text-anchor="middle">✓ FINAL PLACEMENT</text>
  </g>
  
  <!-- Visual: Node ring with scores -->
  <g transform="translate(60, 260)">
    <text x="100" y="-10" class="step-title" text-anchor="middle">Score Computation Visualization</text>
    
    <!-- Nodes in a ring -->
    <g id="node-ring">
      <!-- Node 1 -->
      <g class="diagram-element" transform="translate(80, 120)">
        <circle cx="0" cy="0" r="35" class="diagram-node" stroke="var(--momo)"/>
        <text y="-12" text-anchor="middle" class="step-title" font-size="12px">N1 (w=1.0)</text>
        <text y="4" text-anchor="middle" class="code-snippet">score: 0.847</text>
        <text y="20" text-anchor="middle" class="step-desc">Rack A, Zone 1</text>
      </g>
      
      <!-- Node 2 -->
      <g class="diagram-element" transform="translate(220, 40)">
        <circle cx="0" cy="0" r="35" class="diagram-node" stroke="var(--sakura)"/>
        <text y="-12" text-anchor="middle" class="step-title" font-size="12px">N2 (w=1.5)</text>
        <text y="4" text-anchor="middle" class="code-snippet">score: 0.923</text>
        <text y="20" text-anchor="middle" class="step-desc">Rack B, Zone 1</text>
      </g>
      
      <!-- Node 3 -->
      <g class="diagram-element" transform="translate(360, 120)">
        <circle cx="0" cy="0" r="35" class="diagram-node" stroke="var(--peach)"/>
        <text y="-12" text-anchor="middle" class="step-title" font-size="12px">N3 (w=1.0)</text>
        <text y="4" text-anchor="middle" class="code-snippet">score: 0.756</text>
        <text y="20" text-anchor="middle" class="step-desc">Rack A, Zone 2</text>
      </g>
      
      <!-- Node 4 -->
      <g class="diagram-element" transform="translate(220, 200)">
        <circle cx="0" cy="0" r="35" class="diagram-node" stroke="var(--leaf)"/>
        <text y="-12" text-anchor="middle" class="step-title" font-size="12px">N4 (w=2.0)</text>
        <text y="4" text-anchor="middle" class="code-snippet">score: 0.981</text>
        <text y="20" text-anchor="middle" class="step-desc">Rack C, Zone 2</text>
      </g>
      
      <!-- Node 5 -->
      <g class="diagram-element" transform="translate(80, 200)">
        <circle cx="0" cy="0" r="35" class="diagram-node" stroke="var(--cream)"/>
        <text y="-12" text-anchor="middle" class="step-title" font-size="12px">N5 (w=1.0)</text>
        <text y="4" text-anchor="middle" class="code-snippet">score: 0.634</text>
        <text y="20" text-anchor="middle" class="step-desc">Rack B, Zone 2</text>
      </g>
    </g>
    
    <!-- Sorted order indicator -->
    <g transform="translate(520, 160)">
      <text x="0" y="0" class="step-title" text-anchor="start">Sorted Order (N=3):</text>
      <g transform="translate(0, 25)">
        <rect x="0" y="0" width="120" height="28" rx="4" ry="4" fill="rgba(244,121,131,0.15)" stroke="var(--momo)" stroke-width="1.5"/>
        <text x="60" y="19" text-anchor="middle" class="step-title" font-size="12px" fill="var(--momo)">1. N4 (0.981) ✓</text>
      </g>
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="120" height="28" rx="4" ry="4" fill="rgba(252,201,185,0.15)" stroke="var(--sakura)" stroke-width="1.5"/>
        <text x="60" y="19" text-anchor="middle" class="step-title" font-size="12px" fill="var(--sakura)">2. N2 (0.923) ✓</text>
      </g>
      <g transform="translate(0, 95)">
        <rect x="0" y="0" width="120" height="28" rx="4" ry="4" fill="rgba(244,121,131,0.15)" stroke="var(--momo)" stroke-width="1.5"/>
        <text x="60" y="19" text-anchor="middle" class="step-title" font-size="12px" fill="var(--momo)">3. N1 (0.847) ✓</text>
      </g>
      <g transform="translate(0, 130)">
        <rect x="0" y="0" width="120" height="28" rx="4" ry="4" fill="var(--diagram-grid)" stroke="var(--diagram-border)"/>
        <text x="60" y="19" text-anchor="middle" class="step-desc" font-size="12px">N3 (0.756)</text>
      </g>
      <g transform="translate(0, 165)">
        <rect x="0" y="0" width="120" height="28" rx="4" ry="4" fill="var(--diagram-grid)" stroke="var(--diagram-border)"/>
        <text x="60" y="19" text-anchor="middle" class="step-desc" font-size="12px">N5 (0.634)</text>
      </g>
    </g>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="700" height="60" rx="6" ry="6" fill="var(--diagram-bg)" stroke="var(--diagram-border)"/>
    <text x="10" y="20" class="legend-text">Momo Palette Legend:</text>
    <g transform="translate(10, 35)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="16" height="16" rx="3" fill="var(--momo)"/>
        <text x="22" y="12" class="legend-label">Momo-iro — Primary flow, scoring</text>
      </g>
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="16" height="16" rx="3" fill="var(--sakura)"/>
        <text x="22" y="12" class="legend-label">Sakura-iro — Sort, architecture</text>
      </g>
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="16" height="16" rx="3" fill="var(--peach)"/>
        <text x="22" y="12" class="legend-label">Peach — Replica list, data</text>
      </g>
    </g>
    <g transform="translate(10, 55)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="16" height="16" rx="3" fill="var(--leaf)"/>
        <text x="22" y="12" class="legend-label">Leaf — Verify, success, R1 filter</text>
      </g>
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="16" height="16" rx="3" fill="var(--bark)"/>
        <text x="22" y="12" class="legend-label">Bark — Structure, keys, anchors</text>
      </g>
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="16" height="16" rx="3" fill="var(--cream)"/>
        <text x="22" y="12" class="legend-label">Cream — Highlights, client-side</text>
      </g>
    </g>
  </g>
  
  <!-- Bolt/Sentinel badges -->
  <g transform="translate(600, 20)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="rgba(244,121,131,0.15)" stroke="var(--momo)" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" font-family="JetBrains Mono" font-size="9px" font-weight="700" fill="var(--momo)">⚡ BOLT</text>
  </g>
  <g transform="translate(695, 20)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="rgba(118,146,103,0.15)" stroke="var(--leaf)" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" font-family="JetBrains Mono" font-size="9px" font-weight="700" fill="var(--leaf)">🛡 SENTINEL</text>
  </g>
</svg>