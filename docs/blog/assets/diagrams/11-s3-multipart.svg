<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="multipart-title multipart-desc">
  <title id="multipart-title">S3 Multipart Upload Sequence</title>
  <desc id="multipart-desc">Multipart upload flow: CreateMultipartUpload → UploadPart* → CompleteMultipartUpload / Abort. Parts assemble into one CAS blob at completion.</desc>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="var(--momo)"/>
    </marker>
    <marker id="arrow-success" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="var(--leaf)"/>
    </marker>
    <marker id="arrow-fail" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
    
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="var(--bark)" flood-opacity="0.15"/>
    </filter>
    
    <style>
      .node { filter: url(#drop-shadow); transition: transform 0.2s ease; }
      .title-text { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; fill: var(--diagram-text); text-anchor: middle; }
      .section-title { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; fill: var(--diagram-text); text-anchor: middle; }
      .label-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: var(--diagram-text); text-anchor: middle; }
      .label-small { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--diagram-text-muted); text-anchor: middle; }
      .code-text { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--momo); }
      .code-success { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--leaf); }
      .code-fail { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #dc2626; }
      .flow-arrow { fill: none; stroke: var(--momo); stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
      .flow-success { stroke: var(--leaf); stroke-width: 2; marker-end: url(#arrow-success); }
      .flow-fail { stroke: #dc2626; stroke-width: 2; marker-end: url(#arrow-fail); }
      .step-box { fill: var(--diagram-bg); stroke: var(--diagram-border); stroke-width: 1.5; rx: 6; ry: 6; }
    </style>
  </defs>
  
  <rect width="800" height="500" fill="var(--diagram-bg)"/>
  
  <!-- Title -->
  <text x="400" y="30" class="title-text">S3 Multipart Upload Flow</text>
  <text x="400" y="50" class="diagram-subtitle">Create → UploadPart* → Complete/Abort → Parts assemble into single CAS blob</text>
  
  <!-- Flow -->
  <g transform="translate(400, 100)">
    <!-- Client -->
    <g class="node" transform="translate(-320, 0)">
      <rect x="-50" y="-25" width="100" height="50" rx="8" fill="var(--cream)" stroke="var(--cream)" stroke-width="2"/>
      <text y="-6" text-anchor="middle" class="label-text">Client</text>
      <text y="8" text-anchor="middle" class="label-small">aws s3 cp (large)</text>
    </g>
    
    <!-- 1. CreateMultipartUpload -->
    <path d="M-270,0 H-100" class="flow-arrow" marker-end="url(#arrow)"/>
    <g class="node" transform="translate(-50, 0)">
      <rect x="-80" y="-30" width="160" height="60" class="step-box" style="stroke:var(--momo);"/>
      <text x="0" y="-10" text-anchor="middle" class="section-title" fill="var(--momo)">1. CreateMultipartUpload</text>
      <text x="0" y="8" text-anchor="middle" class="code-success">→ uploadId returned</text>
    </g>
    
    <!-- Arrow -->
    <path d="M30,0 H100" class="flow-arrow" marker-end="url(#arrow)"/>
    
    <!-- 2. UploadPart (repeatable) -->
    <g class="node" transform="translate(200, 0)">
      <rect x="-100" y="-30" width="200" height="60" class="step-box" style="stroke:var(--peach);"/>
      <text x="0" y="-10" text-anchor="middle" class="section-title" fill="var(--peach)">2. UploadPart (×N)</text>
      <text x="0" y="8" text-anchor="middle" class="code-text">partNumber: 1..N</text>
      <text x="0" y="20" text-anchor="middle" class="code-text">ETag per part (cached)</text>
      <text x="0" y="32" text-anchor="middle" class="code-text">Streaming hash (Bolt)</text>
    </g>
    
    <!-- Repeat indicator -->
    <path d="M300,0 H350" class="flow-arrow" marker-end="url(#arrow)" style="stroke-dasharray:4,3;"/>
    <text x="375" y="0" text-anchor="middle" class="label-small">repeat for each part</text>
    
    <!-- Decision: Complete or Abort -->
    <g transform="translate(400, 80)">
      <g class="node" transform="translate(-150, 0)">
        <rect x="-80" y="-30" width="160" height="60" class="step-box" style="stroke:var(--leaf);"/>
        <text x="0" y="-10" text-anchor="middle" class="section-title" fill="var(--leaf)">3a. CompleteMultipartUpload</text>
        <text x="0" y="8" text-anchor="middle" class="code-success">Parts assemble → 1 CAS blob</text>
        <text x="0" y="20" text-anchor="middle" class="code-success">Single blobID = SHA-256(all parts)</text>
      </g>
      
      <path d="M100,0 H140" class="flow-arrow" marker-end="url(#arrow)" style="stroke:#dc2626;"/>
      
      <g class="node" transform="translate(150, 0)">
        <rect x="-80" y="-30" width="160" height="60" class="step-box" style="stroke:#dc2626;"/>
        <text x="0" y="-10" text-anchor="middle" class="section-title" fill="#dc2626">3b. AbortMultipartUpload</text>
        <text x="0" y="8" text-anchor="middle" class="code-fail">Cleanup partial parts</text>
        <text x="0" y="20" text-anchor="middle" class="code-fail">No blob created</text>
      </g>
    </g>
    
    <!-- CAS Assembly -->
    <path d="M400,150 V200" class="flow-success" marker-end="url(#arrow-success)"/>
    
    <g class="node" transform="translate(0, 200)">
      <rect x="-120" y="-30" width="240" height="60" class="step-box" style="stroke:var(--momo); stroke-width:2;"/>
      <text x="0" y="-10" text-anchor="middle" class="section-title" fill="var(--momo)">CAS ASSEMBLY (Zero-Escape)</text>
      <g transform="translate(-110, 0)">
        <text y="0" text-anchor="start" class="code-success">1. Stream parts in order → SHA-256</text>
        <text y="16" text-anchor="start" class="code-success">2. blobID = SHA-256(concatenated parts)</text>
        <text y="32" text-anchor="start" class="code-success">3. PutBlob(blobID) + verify-on-read</text>
        <text y="48" text-anchor="start" class="code-success">Dedup by construction — same parts = same blob</text>
      </g>
    </g>
    
    <!-- Arrow to Client -->
    <path d="M0,250 V300" class="flow-success" marker-end="url(#arrow-success)"/>
    <g class="node" transform="translate(0, 300)">
      <rect x="-50" y="-25" width="100" height="50" rx="8" fill="var(--cream)" stroke="var(--cream)" stroke-width="2"/>
      <text y="-6" text-anchor="middle" class="label-text">Client</text>
      <text y="8" text-anchor="middle" class="label-small">200 OK + ETag</text>
    </g>
  </g>
  
  <!-- 501 Discipline Note -->
  <g transform="translate(400, 380)">
    <rect x="-180" y="0" width="360" height="100" rx="10" fill="rgba(253,237,173,0.15)" stroke="var(--cream)" stroke-width="2"/>
    <text x="0" y="18" text-anchor="middle" class="section-title" fill="var(--cream)">📋 501 DISCIPLINE (P3-P5)</text>
    <g transform="translate(-170, 30)">
      <text y="0" text-anchor="start" class="code-text" style="fill:var(--cream);">Unsupported subresources → explicit 501 Not Implemented</text>
      <text y="16" text-anchor="start" class="code-text" style="fill:var(--cream);">Lifecycle, Versioning, CORS, ACLs, Tagging → 501</text>
      <text y="32" text-anchor="start" class="code-text" style="fill:var(--cream);">Honest failure > silent partial implementation (Sentinel)</text>
      <text y="48" text-anchor="start" class="code-text" style="fill:var(--cream);">docs/COMPATIBILITY.md = sync source of truth</text>
    </g>
  </g>
  
  <!-- Bolt/Sentinel badges -->
  <g transform="translate(620, 15)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="rgba(244,121,131,0.15)" stroke="var(--momo)" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" font-family="JetBrains Mono" font-size="9px" font-weight="700" fill="var(--momo)">⚡ BOLT</text>
  </g>
  <g transform="translate(710, 15)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="rgba(118,146,103,0.15)" stroke="var(--leaf)" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" font-family="JetBrains Mono" font-size="9px" font-weight="700" fill="var(--leaf)">🛡 SENTINEL</text>
  </g>
</svg>