<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="bolt-title bolt-desc">
  <title id="bolt-title">Bolt Performance Patterns: Zero-Escape, Deadline Amortization, Combined Reads</title>
  <desc id="bolt-desc">Three core Bolt patterns: zero-escape SHA-256/hex with stack buffers, deadline amortization cutting SetDeadline ~98%, combined metadata reads collapsing 3 bbolt views into 1.</desc>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="var(--momo)"/>
    </marker>
    <marker id="arrow-success" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="var(--leaf)"/>
    </marker>
    
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="var(--bark)" flood-opacity="0.15"/>
    </filter>
    
    <style>
      .node { filter: url(#drop-shadow); transition: transform 0.2s ease; }
      .title-text { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; fill: var(--diagram-text); text-anchor: middle; }
      .section-title { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; fill: var(--diagram-text); text-anchor: middle; }
      .label-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: var(--diagram-text); text-anchor: middle; }
      .label-small { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--diagram-text-muted); text-anchor: middle; }
      .code-text { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--momo); }
      .code-success { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--leaf); }
      .code-fail { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #dc2626; }
      .code-quic { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--peach); }
      .flow-arrow { fill: none; stroke: var(--momo); stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
      .flow-success { stroke: var(--leaf); stroke-width: 2; marker-end: url(#arrow-success); }
      .step-box { fill: var(--diagram-bg); stroke: var(--diagram-border); stroke-width: 1.5; rx: 6; ry: 6; }
      .pattern-box { fill: rgba(244,121,131,0.08); stroke: var(--momo); stroke-width: 2; rx: 10; ry: 10; }
    </style>
  </defs>
  
  <rect width="800" height="600" fill="var(--diagram-bg)"/>
  
  <!-- Title -->
  <text x="400" y="30" class="title-text">⚡ Bolt Performance Patterns</text>
  <text x="400" y="52" class="diagram-subtitle">Zero-escape hashing, deadline amortization, combined reads — allocation is latency in hot paths</text>
  
  <!-- ============ PATTERN 1: ZERO-ESCAPE SHA-256/HEX ============ -->
  <text x="400" y="75" class="section-title">1️⃣ ZERO-ESCAPE SHA-256 / HEX ENCODING</text>
  
  <g class="node pattern-box" transform="translate(400, 120)">
    <rect x="-300" y="-5" width="600" height="150" rx="10" ry="10"/>
    <text x="0" y="20" text-anchor="middle" class="section-title" fill="var(--momo)">Stack Buffers → Zero Heap Allocation</text>
    
    <g transform="translate(-280, 40)">
      <text y="0" text-anchor="start" class="code-fail" style="font-size:10px;">❌ REJECTED: sync.Pool of []byte</text>
      <text y="16" text-anchor="start" class="label-small">Pool mutex contention at 50k ops/s > allocation cost</text>
      <text y="30" text-anchor="start" class="label-small">Pooled objects promote to old gen → longer GC pauses</text>
    </g>
    
    <g transform="translate(80, 40)">
      <text y="0" text-anchor="start" class="code-success" style="font-size:10px;">✅ STACK BUFFERS (Zero-Escape)</text>
      <text y="16" text-anchor="start" class="code-text">var hashBuf [sha256.Size]byte       // 32 bytes on stack</text>
      <text y="30" text-anchor="start" class="code-text">var hexBuf [sha256.Size * 2]byte    // 64 bytes on stack</text>
      <text y="44" text-anchor="start" class="code-text">h := sha256.New()</text>
      <text y="58" text-anchor="start" class="code-text">h.Write(data)</text>
      <text y="72" text-anchor="start" class="code-success">hash := h.Sum(hashBuf[:0])  // stack slice, cap=32</text>
      <text y="86" text-anchor="start" class="code-success">hex.Encode(hexBuf[:0], hash)  // stack slice, cap=64</text>
      <text y="100" text-anchor="start" class="label-small">Result: slices point into stack arrays — NO heap escape</text>
    </g>
  </g>
  
  <!-- ============ PATTERN 2: DEADLINE AMORTIZATION ============ -->
  <text x="400" y="290" class="section-title">2️⃣ DEADLINE AMORTIZATION — Cut SetDeadline ~98%</text>
  
  <g class="node pattern-box" transform="translate(400, 320)">
    <rect x="-300" y="-5" width="600" height="150" rx="10" ry="10"/>
    <text x="0" y="20" text-anchor="middle" class="section-title" fill="var(--leaf)">Phased Absolute Deadlines</text>
    
    <g transform="translate(-280, 40)">
      <text y="0" text-anchor="start" class="code-fail" style="font-size:10px;">❌ BEFORE: Per-Op SetDeadline</text>
      <text y="16" text-anchor="start" class="code-text">conn.SetDeadline(now.Add(5s))  // read</text>
      <text y="30" text-anchor="start" class="code-text">n, _ := conn.Read(buf)</text>
      <text y="44" text-anchor="start" class="code-text">conn.SetDeadline(now.Add(5s))  // write</text>
      <text y="58" text-anchor="start" class="code-text">conn.Write(buf[:n])</text>
      <text y="72" text-anchor="start" class="label-small">200 syscalls/sec/connection — massive overhead</text>
    </g>
    
    <g transform="translate(80, 40)">
      <text y="0" text-anchor="start" class="code-success" style="font-size:10px;">✅ AFTER: Phased Absolute Deadlines</text>
      <text y="16" text-anchor="start" class="code-text">// Handshake: 10s absolute (1 SetDeadline)</text>
      <text y="30" text-anchor="start" class="code-text">conn.SetDeadline(time.Now().Add(10*time.Second))</text>
      <text y="44" text-anchor="start" class="code-text">// ... handshake ...</text>
      <text y="58" text-anchor="start" class="code-text">// Metadata: 60s absolute (reuse same)</text>
      <text y="72" text-anchor="start" class="code-text">conn.SetDeadline(time.Now().Add(60*time.Second))</text>
      <text y="86" text-anchor="start" class="code-text">// ... metadata ...</text>
      <text y="100" text-anchor="start" class="code-text">// Data: dynamic deadline (1 SetDeadline)</text>
      <text y="114" text-anchor="start" class="label-small">Result: 200 → 3 SetDeadline/sec/conn (~98% cut)</text>
    </g>
  </g>
  
  <!-- ============ PATTERN 3: COMBINED METADATA READS ============ -->
  <text x="400" y="490" class="section-title">3️⃣ COMBINED METADATA READS — 3 bbolt Views → 1</text>
  
  <g class="node pattern-box" transform="translate(400, 520)">
    <rect x="-300" y="-5" width="600" height="60" rx="10" ry="10"/>
    <text x="0" y="20" text-anchor="middle" class="section-title" fill="var(--sakura)">Single Transaction, Multiple Buckets</text>
    
    <g transform="translate(-280, 35)">
      <text y="0" text-anchor="start" class="code-fail" style="font-size:10px;">❌ BEFORE: 3 separate views</text>
      <text y="14" text-anchor="start" class="code-text">view1, _ := db.View(fn1)  // bucket A</text>
      <text y="28" text-anchor="start" class="code-text">view2, _ := db.View(fn2)  // bucket B</text>
      <text y="42" text-anchor="start" class="code-text">view3, _ := db.View(fn3)  // bucket C</text>
    </g>
    
    <g transform="translate(80, 35)">
      <text y="0" text-anchor="start" class="code-success" style="font-size:10px;">✅ AFTER: 1 view, 3 buckets</text>
      <text y="14" text-anchor="start" class="code-success">err := db.View(func(tx *bbolt.Tx) error {</text>
      <text y="28" text-anchor="start" class="code-success">  a := tx.Bucket(bucketA).Get(key)</text>
      <text y="42" text-anchor="start" class="code-success">  b := tx.Bucket(bucketB).Get(key)</text>
      <text y="56" text-anchor="start" class="code-success">  c := tx.Bucket(bucketC).Get(key)</text>
      <text y="70" text-anchor="start" class="code-success">  return nil</text>
      <text y="84" text-anchor="start" class="label-small">Result: 3x fewer transactions, 3x fewer locks, 3x less contention</text>
    </g>
  </g>
  
  <!-- Bolt/Sentinel badges -->
  <g transform="translate(620, 15)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="rgba(244,121,131,0.15)" stroke="var(--momo)" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" font-family="JetBrains Mono" font-size="9px" font-weight="700" fill="var(--momo)">⚡ BOLT</text>
  </g>
</svg>