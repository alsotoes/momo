<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-15 desc-15">
  <title id="title-15">Momo Production Readiness Roadmap: R1-R6</title>
  <desc id="desc-15">Milestone progression of momo from failure-domain placement (R1) through metadata catalog high availability (R6).</desc>

  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .mile-card { fill: #FFFFFF; stroke: #769267; stroke-width: 1.5; rx: 6; ry: 6; }
      .head { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #769267; text-anchor: middle; }
      .sub { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px; fill: #563A10; text-anchor: middle; }
      .badge { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <text x="320" y="32" class="title">Production Readiness Milestones: R1 - R6</text>
  <text x="320" y="52" class="subtitle">Systematic engineering progression from durability foundations to distributed metadata HA</text>

  <!-- Row 1: R1, R2, R3 -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="180" height="85" class="mile-card"/>
    <text x="90" y="24" class="head">R1: Failure Domains</text>
    <text x="90" y="44" class="sub">CRUSH-lite Rack/DC Diversity</text>
    <rect x="40" y="54" width="100" height="20" rx="4" fill="rgba(118,146,103,0.15)"/>
    <text x="90" y="68" class="badge" fill="#769267">✓ SHIPPED</text>
  </g>

  <g transform="translate(230, 75)">
    <rect x="0" y="0" width="180" height="85" class="mile-card"/>
    <text x="90" y="24" class="head">R2: Self-Heal Rebuild</text>
    <text x="90" y="44" class="sub">Degraded Reads &amp; Recovery</text>
    <rect x="40" y="54" width="100" height="20" rx="4" fill="rgba(118,146,103,0.15)"/>
    <text x="90" y="68" class="badge" fill="#769267">✓ SHIPPED</text>
  </g>

  <g transform="translate(430, 75)">
    <rect x="0" y="0" width="180" height="85" class="mile-card"/>
    <text x="90" y="24" class="head">R3: Write Durability</text>
    <text x="90" y="44" class="sub">fsync-Before-Ack &amp; Quorum</text>
    <rect x="40" y="54" width="100" height="20" rx="4" fill="rgba(118,146,103,0.15)"/>
    <text x="90" y="68" class="badge" fill="#769267">✓ SHIPPED</text>
  </g>

  <!-- Row 2: R4, R5, R6 -->
  <g transform="translate(30, 180)">
    <rect x="0" y="0" width="180" height="85" class="mile-card"/>
    <text x="90" y="24" class="head">R4: momofs FUSE</text>
    <text x="90" y="44" class="sub">Mountable POSIX File Layer</text>
    <rect x="40" y="54" width="100" height="20" rx="4" fill="rgba(118,146,103,0.15)"/>
    <text x="90" y="68" class="badge" fill="#769267">✓ SHIPPED</text>
  </g>

  <g transform="translate(230, 180)">
    <rect x="0" y="0" width="180" height="85" class="mile-card"/>
    <text x="90" y="24" class="head">R5: Observability</text>
    <text x="90" y="44" class="sub">Per-Node Prometheus Exporter</text>
    <rect x="40" y="54" width="100" height="20" rx="4" fill="rgba(118,146,103,0.15)"/>
    <text x="90" y="68" class="badge" fill="#769267">✓ SHIPPED</text>
  </g>

  <g transform="translate(430, 180)">
    <rect x="0" y="0" width="180" height="85" class="mile-card"/>
    <text x="90" y="24" class="head">R6: Metadata HA</text>
    <text x="90" y="44" class="sub">256-Shard Quorum Ring + PITR</text>
    <rect x="40" y="54" width="100" height="20" rx="4" fill="rgba(118,146,103,0.15)"/>
    <text x="90" y="68" class="badge" fill="#769267">✓ SHIPPED</text>
  </g>

  <!-- Bottom Forward Horizon Banner -->
  <g transform="translate(30, 280)">
    <rect x="0" y="0" width="580" height="55" rx="6" ry="6" fill="#FEFEF9" stroke="#E8DFD8"/>
    <text x="20" y="24" style="font-family:system-ui,sans-serif;font-size:11px;font-weight:600;fill:#563A10;">Forward Horizon (R7–R11):</text>
    <text x="180" y="24" style="font-family:system-ui,sans-serif;font-size:11px;fill:#2D2D2D;">Multi-tenancy, Metadata backup/DR, Admin CLI, and automated rebalance.</text>
    <text x="20" y="40" style="font-family:ui-monospace,monospace;font-size:11px;fill:#6B6B6B;">All production milestones verified through continuous benchmark gates and self-healing tests.</text>
  </g>
</svg>
