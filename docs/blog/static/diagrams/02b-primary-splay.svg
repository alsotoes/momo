<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-02b desc-02b">
  <title id="title-02b">Primary-Splay: Client-Side Fan-Out Architecture</title>
  <desc id="desc-02b">Detailed architecture of Primary-Splay replication where the client fans out directly to all storage nodes, eliminating server-side relay bandwidth.</desc>

  <defs>
    <marker id="arrow-client" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#F47983"/>
    </marker>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .client-box { fill: #FFFFFF; stroke: #F47983; stroke-width: 2; rx: 10; ry: 10; }
      .node-box { fill: #FFFFFF; stroke: #769267; stroke-width: 1.5; rx: 8; ry: 8; }
      .header-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .sub-text { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #6B6B6B; text-anchor: middle; }
      .callout-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #563A10; }
      .callout-body { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #2D2D2D; line-height: 1.4; }
      .flow-stream { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow-client); }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <!-- Title -->
  <text x="320" y="30" class="title">Primary-Splay: Client-Side Fan-Out</text>
  <text x="320" y="48" class="subtitle">Direct parallel streams from client to all replicas — zero server-to-server relay egress</text>

  <!-- Client Component (Top Center) -->
  <g transform="translate(220, 65)">
    <rect x="0" y="0" width="200" height="50" class="client-box"/>
    <text x="100" y="22" class="header-text" fill="#F47983">momo Intelligent Client</text>
    <text x="100" y="38" class="sub-text">Computes CRUSH placement locally</text>
  </g>

  <!-- Parallel Streams -->
  <path d="M250, 115 L120, 175" class="flow-stream"/>
  <path d="M320, 115 L320, 175" class="flow-stream"/>
  <path d="M390, 115 L520, 175" class="flow-stream"/>

  <!-- Storage Nodes (Middle Row) -->
  <g transform="translate(45, 180)">
    <rect x="0" y="0" width="150" height="60" class="node-box"/>
    <text x="75" y="24" class="header-text">Node 0 (Replica 1)</text>
    <text x="75" y="42" class="sub-text">Direct Ingest (TCP/QUIC)</text>
  </g>

  <g transform="translate(245, 180)">
    <rect x="0" y="0" width="150" height="60" class="node-box"/>
    <text x="75" y="24" class="header-text">Node 1 (Replica 2)</text>
    <text x="75" y="42" class="sub-text">Direct Ingest (TCP/QUIC)</text>
  </g>

  <g transform="translate(445, 180)">
    <rect x="0" y="0" width="150" height="60" class="node-box"/>
    <text x="75" y="24" class="header-text">Node 2 (Replica 3)</text>
    <text x="75" y="42" class="sub-text">Direct Ingest (TCP/QUIC)</text>
  </g>

  <!-- Bottom Callout Panel -->
  <g transform="translate(45, 260)">
    <rect x="0" y="0" width="550" height="75" rx="8" ry="8" fill="#FEFEF9" stroke="#E8DFD8" stroke-width="1.5"/>
    <text x="20" y="22" class="callout-title">⚡ High-Throughput Invariant: Zero Server Relay Overhead</text>
    <text x="20" y="42" class="callout-body">• Server daemons expend 0 network egress copying bytes to peers; client network carries fan-out.</text>
    <text x="20" y="60" class="callout-body">• External S3 Client Fallback: aws-cli PUTs land on 1 node -> dynamically downgraded to Splay (#258).</text>
  </g>
</svg>
