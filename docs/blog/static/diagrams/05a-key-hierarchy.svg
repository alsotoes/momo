<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-05a desc-05a">
  <title id="title-05a">Client-Held E2EE: Key Hierarchy</title>
  <desc id="desc-05a">Envelope encryption key hierarchy: Key Encryption Key (KEK) held only by client, Content Encryption Key (CEK) per object, and Wrapped CEK stored on server.</desc>

  <defs>
    <marker id="arrow-key" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#563A10"/>
    </marker>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .key-card { fill: #FFFFFF; stroke: #563A10; stroke-width: 1.5; rx: 8; ry: 8; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #563A10; text-anchor: middle; }
      .card-sub { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #F47983; text-anchor: middle; }
      .card-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6B6B6B; text-anchor: middle; }
      .flow-arrow { fill: none; stroke: #563A10; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow-key); }
      .pill { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <text x="320" y="32" class="title">E2EE Key Hierarchy: Envelope Architecture</text>
  <text x="320" y="52" class="subtitle">Decoupling per-object encryption from master key custody — zero server knowledge</text>

  <!-- Key 1: KEK (Client Master) -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="165" height="150" class="key-card" stroke="#769267" stroke-width="2"/>
    <text x="82" y="26" class="card-title" fill="#769267">1. KEK (Master Key)</text>
    <text x="82" y="46" class="card-sub">Key Encryption Key</text>
    <text x="82" y="70" class="card-desc">• 256-bit AES Master</text>
    <text x="82" y="88" class="card-desc">• Client-held ONLY</text>
    <text x="82" y="106" class="card-desc">• Never crosses network</text>
    <rect x="22" y="118" width="120" height="20" rx="4" fill="rgba(118,146,103,0.12)"/>
    <text x="82" y="132" class="pill" fill="#769267" text-anchor="middle">TRUSTED CLIENT</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M195, 155 H235" class="flow-arrow"/>

  <!-- Key 2: CEK (Ephemeral) -->
  <g transform="translate(238, 80)">
    <rect x="0" y="0" width="165" height="150" class="key-card" stroke="#F47983" stroke-width="2"/>
    <text x="82" y="26" class="card-title" fill="#F47983">2. CEK (Data Key)</text>
    <text x="82" y="46" class="card-sub">Content Encryption Key</text>
    <text x="82" y="70" class="card-desc">• Random 32 bytes</text>
    <text x="82" y="88" class="card-desc">• Unique per object</text>
    <text x="82" y="106" class="card-desc">• Encrypts payload</text>
    <rect x="22" y="118" width="120" height="20" rx="4" fill="rgba(244,121,131,0.12)"/>
    <text x="82" y="132" class="pill" fill="#F47983" text-anchor="middle">EPHEMERAL RAM</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M403, 155 H443" class="flow-arrow"/>

  <!-- Key 3: Wrapped CEK (Ciphertext) -->
  <g transform="translate(445, 80)">
    <rect x="0" y="0" width="165" height="150" class="key-card" stroke="#563A10" stroke-width="2"/>
    <text x="82" y="26" class="card-title" fill="#563A10">3. Wrapped CEK</text>
    <text x="82" y="46" class="card-sub">KEK.Seal(CEK)</text>
    <text x="82" y="70" class="card-desc">• Encrypted envelope</text>
    <text x="82" y="88" class="card-desc">• Stored with metadata</text>
    <text x="82" y="106" class="card-desc">• Safe for untrusted server</text>
    <rect x="22" y="118" width="120" height="20" rx="4" fill="rgba(86,58,16,0.1)"/>
    <text x="82" y="132" class="pill" fill="#563A10" text-anchor="middle">SERVER PERSISTED</text>
  </g>

  <!-- Bottom Principle Callout -->
  <g transform="translate(30, 255)">
    <rect x="0" y="0" width="580" height="80" rx="8" ry="8" fill="#FEFEF9" stroke="#E8DFD8" stroke-width="1.5"/>
    <text x="20" y="24" style="font-family:system-ui,sans-serif;font-size:12px;font-weight:700;fill:#563A10;">🛡 Security Invariant: Cryptographic Separation of Duties</text>
    <text x="20" y="46" style="font-family:system-ui,sans-serif;font-size:11px;fill:#2D2D2D;">• Compromising the server yields only ciphertext and wrapped CEKs — zero plaintext exposure.</text>
    <text x="20" y="66" style="font-family:system-ui,sans-serif;font-size:11px;fill:#2D2D2D;">• Key rotation re-wraps the 32-byte CEK without re-encrypting gigabytes of physical blob data.</text>
  </g>
</svg>
