<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="crush-title crush-desc">
  <!-- CRUSH-lite Placement Algorithm - Overview Diagram -->
  <title id="crush-title">CRUSH-lite: Deterministic Weighted Placement Overview</title>
  <desc id="crush-desc">Four-step flow: Object Hash Input → Weighted Scoring → Deterministic Sort → Replica List with Failure Domain Filter</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#F47983"/>
    </marker>
    <marker id="arrow-success" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#769267"/>
    </marker>

    <!-- Gradients -->
    <linearGradient id="grad-input" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F47983"/>
      <stop offset="100%" stop-color="#FCC9B9"/>
    </linearGradient>
    <linearGradient id="grad-process" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCC9B9"/>
      <stop offset="100%" stop-color="#FFA6A6"/>
    </linearGradient>
    <linearGradient id="grad-output" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#769267"/>
      <stop offset="100%" stop-color="#8AB87A"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#563A10" flood-opacity="0.12"/>
    </filter>

    <!-- Styles -->
    <style>
      .step-box { filter: url(#shadow); }
      .step-box:hover { filter: url(#shadow) brightness(1.05); }
      .node-label { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .node-desc { font-family: 'Outfit', sans-serif; font-size: 11px; fill: #6B6B6B; text-anchor: middle; }
      .step-num { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; fill: #FAFAFA; text-anchor: middle; }
      .step-title { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .step-desc { font-family: 'Outfit', sans-serif; font-size: 10px; fill: #6B6B6B; text-anchor: middle; }
      .flow-arrow { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
      .detail-link { cursor: pointer; }
      .detail-link:hover .step-desc { fill: #F47983; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="720" height="480" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="360" y="30" class="node-label" style="font-size:18px;">CRUSH-lite: Deterministic Weighted Placement</text>
  <text x="360" y="50" class="node-desc">Weighted rendezvous hashing → stable replica list → failure domain awareness</text>

  <!-- Main Flow: 4 Steps Horizontal -->
  <g transform="translate(30, 80)">
    <!-- Step 1: Input -->
    <g class="step-box detail-link" transform="translate(0, 0)">
      <rect x="0" y="0" width="150" height="120" rx="10" ry="10" fill="url(#grad-input)" stroke="#F47983" stroke-width="2"/>
      <circle cx="75" cy="25" r="18" fill="#F47983"/>
      <text x="75" y="30" class="step-num">1</text>
      <text x="75" y="60" class="step-title">INPUT</text>
      <text x="75" y="78" class="step-desc">Object Hash</text>
      <text x="75" y="94" class="step-desc" style="font-size:9px;">SHA-256 (content-addressed)</text>
      <text x="75" y="108" class="step-desc" style="font-size:9px;">placementKey = blobID</text>
    </g>

    <!-- Arrow 1→2 -->
    <path d="M150,60 H175" class="flow-arrow" marker-end="url(#arrow)"/>

    <!-- Step 2: Score -->
    <g class="step-box detail-link" transform="translate(185, 0)">
      <rect x="0" y="0" width="150" height="120" rx="10" ry="10" fill="url(#grad-process)" stroke="#FCC9B9" stroke-width="2"/>
      <circle cx="75" cy="25" r="18" fill="#FCC9B9"/>
      <text x="75" y="30" class="step-num" style="fill:#FAFAFA;">2</text>
      <text x="75" y="60" class="step-title">SCORE</text>
      <text x="75" y="78" class="step-desc">Weighted Hash</text>
      <g transform="translate(10, 88)">
        <text x="0" y="0" style="font-family:'JetBrains Mono',monospace;font-size:8px;fill:#F47983;text-anchor:start;">score = hash(key ⊗ id)</text>
        <text x="0" y="14" style="font-family:'JetBrains Mono',monospace;font-size:8px;fill:#F47983;text-anchor:start;">score *= weight</text>
        <text x="0" y="28" style="font-family:'JetBrains Mono',monospace;font-size:8px;fill:#F47983;text-anchor:start;">fold52(score)</text>
      </g>
    </g>

    <!-- Arrow 2→3 -->
    <path d="M335,60 H360" class="flow-arrow" marker-end="url(#arrow)"/>

    <!-- Step 3: Sort -->
    <g class="step-box detail-link" transform="translate(370, 0)">
      <rect x="0" y="0" width="150" height="120" rx="10" ry="10" fill="url(#grad-process)" stroke="#FFA6A6" stroke-width="2"/>
      <circle cx="75" cy="25" r="18" fill="#FFA6A6"/>
      <text x="75" y="30" class="step-num" style="fill:#FAFAFA;">3</text>
      <text x="75" y="60" class="step-title">SORT</text>
      <text x="75" y="78" class="step-desc">Deterministic</text>
      <text x="75" y="94" class="step-desc" style="font-size:9px;">Stable sort by score</text>
      <text x="75" y="108" class="step-desc" style="font-size:9px;">52-bit mantissa (#873)</text>
    </g>

    <!-- Arrow 3→4 -->
    <path d="M520,60 H545" class="flow-arrow" marker-end="url(#arrow)"/>

    <!-- Step 4: Replica List -->
    <g class="step-box detail-link" transform="translate(555, 0)">
      <rect x="0" y="0" width="150" height="120" rx="10" ry="10" fill="url(#grad-output)" stroke="#769267" stroke-width="2"/>
      <circle cx="75" cy="25" r="18" fill="#769267"/>
      <text x="75" y="30" class="step-num" style="fill:#FAFAFA;">4</text>
      <text x="75" y="60" class="step-title">OUTPUT</text>
      <text x="75" y="78" class="step-desc">Replica List</text>
      <text x="75" y="94" class="step-desc" style="font-size:9px;">Top-N by score</text>
      <text x="75" y="108" class="step-desc" style="font-size:9px;">Failure domain filter (R1)</text>
    </g>
  </g>

  <!-- Key Principles (Bottom) -->
  <g transform="translate(30, 230)">
    <rect x="0" y="0" width="660" height="160" rx="12" ry="12" fill="#FEFEF9" stroke="#E8DFD8" stroke-width="1"/>
    <text x="330" y="25" class="node-label" style="font-size:14px;fill:#563A10;">Key Principles</text>

    <!-- Principle 1 -->
    <g transform="translate(20, 40)">
      <circle cx="15" cy="15" r="12" fill="#F47983"/>
      <text x="15" y="19" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;fill:white;text-anchor:middle;">1</text>
      <text x="40" y="15" style="font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;fill:#2D2D2D;">Content-Hash as Placement Key</text>
      <text x="40" y="32" style="font-family:'Outfit',sans-serif;font-size:10px;fill:#6B6B6B;">SHA-256 digest directly determines placement — no separate index needed</text>
    </g>

    <!-- Principle 2 -->
    <g transform="translate(20, 75)">
      <circle cx="15" cy="15" r="12" fill="#FCC9B9"/>
      <text x="15" y="19" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;fill:white;text-anchor:middle;">2</text>
      <text x="40" y="15" style="font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;fill:#2D2D2D;">Weighted Rendezvous Hashing</text>
      <text x="40" y="32" style="font-family:'Outfit',sans-serif;font-size:10px;fill:#6B6B6B;">Score = hash(key ⊗ node.id) × weight — deterministic, peer-equal</text>
    </g>

    <!-- Principle 3 -->
    <g transform="translate(350, 40)">
      <circle cx="15" cy="15" r="12" fill="#FFA6A6"/>
      <text x="15" y="19" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;fill:white;text-anchor:middle;">3</text>
      <text x="40" y="15" style="font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;fill:#2D2D2D;">Deterministic Stable Sort</text>
      <text x="40" y="32" style="font-family:'Outfit',sans-serif;font-size:10px;fill:#6B6B6B;">sort.Stable prevents replica order flips (#872) — 52-bit mantissa avoids float drift (#873)</text>
    </g>

    <!-- Principle 4 -->
    <g transform="translate(350, 75)">
      <circle cx="15" cy="15" r="12" fill="#769267"/>
      <text x="15" y="19" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;fill:white;text-anchor:middle;">4</text>
      <text x="40" y="15" style="font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;fill:#2D2D2D;">Failure Domain Filtering (R1)</text>
      <text x="40" y="32" style="font-family:'Outfit',sans-serif;font-size:10px;fill:#6B6B6B;">Replicas constrained across rack/zone/DC — no shared failure domain</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 410)">
    <rect x="0" y="0" width="660" height="40" rx="6" ry="6" fill="#FAFAFA" stroke="#E8DFD8"/>
    <text x="20" y="22" class="node-label" style="font-size:11px;">Step Colors:</text>
    <g transform="translate(150, 8)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#F47983"/><text x="20" y="11" style="font-family:'Outfit',sans-serif;font-size:9px;fill:#6B6B6B;">Input — SHA-256 hash</text>
    </g>
    <g transform="translate(300, 8)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#FCC9B9"/><text x="20" y="11" style="font-family:'Outfit',sans-serif;font-size:9px;fill:#6B6B6B;">Score — Weighted hash</text>
    </g>
    <g transform="translate(460, 8)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#FFA6A6"/><text x="20" y="11" style="font-family:'Outfit',sans-serif;font-size:9px;fill:#6B6B6B;">Sort — Stable order</text>
    </g>
    <g transform="translate(600, 8)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#769267"/><text x="20" y="11" style="font-family:'Outfit',sans-serif;font-size:9px;fill:#6B6B6B;">Output — Replica list + R1 filter</text>
    </g>
  </g>

  <!-- Bolt/Sentinel badges -->
  <g transform="translate(580, 10)">
    <rect x="0" y="0" width="65" height="20" rx="10" fill="rgba(244,121,131,0.12)" stroke="#F47983" stroke-width="1"/>
    <text x="32.5" y="14" text-anchor="middle" style="font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;fill:#F47983;">⚡ BOLT</text>
  </g>
  <g transform="translate(650, 10)">
    <rect x="0" y="0" width="65" height="20" rx="10" fill="rgba(118,146,103,0.12)" stroke="#769267" stroke-width="1"/>
    <text x="32.5" y="14" text-anchor="middle" style="font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;fill:#769267;">🛡 SENTINEL</text>
  </g>
</svg>