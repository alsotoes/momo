<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="crush-title crush-desc">
  <title id="crush-title">CRUSH-lite: Deterministic Weighted Placement Overview</title>
  <desc id="crush-desc">Four-step flow: Input Hash → Weighted Scoring → Stable Sort → Replica List with Failure Domain Filter</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#F47983"/>
    </marker>
    <marker id="arrow-success" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#769267"/>
    </marker>

    <linearGradient id="grad-input" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F47983"/>
      <stop offset="100%" stop-color="#FCC9B9"/>
    </linearGradient>
    <linearGradient id="grad-process" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCC9B9"/>
      <stop offset="100%" stop-color="#FFA6A6"/>
    </linearGradient>
    <linearGradient id="grad-output" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#769267"/>
      <stop offset="100%" stop-color="#8AB87A"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#563A10" flood-opacity="0.12"/>
    </filter>

    <style>
      .step-box { filter: url(#shadow); }
      .step-box:hover { filter: url(#shadow) brightness(1.05); }
      .step-num { font-family: 'JetBrains Mono', ui-monospace, monospace', monospace; font-size: 22px; font-weight: 700; fill: #FAFAFA; text-anchor: middle; }
      .step-title { font-family: 'Outfit', system-ui, -apple-system, sans-serif', sans-serif; font-size: 12px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .step-desc { font-family: 'Outfit', system-ui, -apple-system, sans-serif', sans-serif; font-size: 10px; fill: #6B6B6B; text-anchor: middle; }
      .flow-arrow { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
      .legend-text { font-family: 'Outfit', system-ui, -apple-system, sans-serif', sans-serif; font-size: 10px; fill: #6B6B6B; }
      .title-main { font-family: 'Outfit', system-ui, -apple-system, sans-serif', sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .title-sub { font-family: 'Outfit', system-ui, -apple-system, sans-serif', sans-serif; font-size: 10px; fill: #6B6B6B; text-anchor: middle; }
    </style>
  </defs>

  <rect width="720" height="400" fill="#FAFAFA"/>

  <text x="360" y="24" class="title-main">CRUSH-lite: Deterministic Weighted Placement</text>
  <text x="360" y="38" class="title-sub">Input Hash → Weighted Scoring → Stable Sort → Replica List + Failure Domain Filter</text>

  <!-- Main Flow: 4 Steps Horizontal with generous margins -->
  <g transform="translate(40, 60)">
    <!-- Step 1: Input -->
    <g class="step-box" transform="translate(0, 0)">
      <rect x="0" y="0" width="140" height="100" rx="10" ry="10" fill="url(#grad-input)" stroke="#F47983" stroke-width="2"/>
      <circle cx="70" cy="22" r="16" fill="#F47983"/>
      <text x="70" y="27" class="step-num">1</text>
      <text x="70" y="55" class="step-title">INPUT</text>
      <text x="70" y="72" class="step-desc">Object Hash</text>
      <text x="70" y="84" class="step-desc" style="font-size: 10px;">SHA-256 = placementKey</text>
    </g>

    <!-- Arrow 1→2 -->
    <path d="M140,50 H165" class="flow-arrow" marker-end="url(#arrow)"/>

    <!-- Step 2: Score -->
    <g class="step-box" transform="translate(175, 0)">
      <rect x="0" y="0" width="140" height="100" rx="10" ry="10" fill="url(#grad-process)" stroke="#FCC9B9" stroke-width="2"/>
      <circle cx="70" cy="22" r="16" fill="#FCC9B9"/>
      <text x="70" y="27" class="step-num" style="fill:#FAFAFA;">2</text>
      <text x="70" y="55" class="step-title">SCORE</text>
      <text x="70" y="72" class="step-desc">Weighted Hash</text>
      <text x="70" y="84" class="step-desc" style="font-size: 10px;">hash(key ⊗ id) × weight</text>
      <text x="70" y="92" class="step-desc" style="font-size: 10px;">fold52(score)</text>
    </g>

    <!-- Arrow 2→3 -->
    <path d="M310,50 H335" class="flow-arrow" marker-end="url(#arrow)"/>

    <!-- Step 3: Sort -->
    <g transform="translate(345, 0)">
      <rect x="0" y="0" width="140" height="100" rx="10" ry="10" fill="url(#grad-process)" stroke="#FFA6A6" stroke-width="2"/>
      <circle cx="70" cy="22" r="16" fill="#FFA6A6"/>
      <text x="70" y="27" class="step-num" style="fill:#FAFAFA;">3</text>
      <text x="70" y="55" class="step-title">SORT</text>
      <text x="70" y="72" class="step-desc">Stable Sort</text>
      <text x="70" y="84" class="step-desc" style="font-size: 10px;">sort.Stable(byScore)</text>
      <text x="70" y="92" class="step-desc" style="font-size: 10px;">fold52 + tie-stable</text>
    </g>

    <!-- Arrow 3→4 -->
    <path d="M480,50 H505" class="flow-arrow" marker-end="url(#arrow)"/>

    <!-- Step 4: Output -->
    <g transform="translate(515, 0)">
      <rect x="0" y="0" width="140" height="100" rx="10" ry="10" fill="url(#grad-output)" stroke="#769267" stroke-width="2"/>
      <circle cx="70" cy="22" r="16" fill="#769267"/>
      <text x="70" y="27" class="step-num" style="fill:#FAFAFA;">4</text>
      <text x="70" y="55" class="step-title">OUTPUT</text>
      <text x="70" y="72" class="step-desc">Replica List</text>
      <text x="70" y="84" class="step-desc" style="font-size: 10px;">Top-N by score</text>
      <text x="70" y="92" class="step-desc" style="font-size: 10px;">R1: domain filter</text>
    </g>
  </g>

  <!-- Key Principles (Bottom) -->
  <g transform="translate(40, 180)">
    <rect x="0" y="0" width="640" height="130" rx="10" ry="10" fill="#FEFEF9" stroke="#E8DFD8" stroke-width="1"/>
    <text x="320" y="20" style="font-family: 'Outfit', system-ui, -apple-system, sans-serif',sans-serif;font-size:13px;font-weight:700;fill:#563A10;text-anchor:middle;">Key Principles</text>

    <g transform="translate(15, 30)">
      <circle cx="12" cy="12" r="10" fill="#F47983"/>
      <text x="12" y="16" style="font-family: 'JetBrains Mono', ui-monospace, monospace',monospace;font-size:10px;font-weight:700;fill:white;text-anchor:middle;">1</text>
      <text x="30" y="12" style="font-family: 'Outfit', system-ui, -apple-system, sans-serif',sans-serif;font-size:10px;font-weight:700;fill:#2D2D2D;">Content Hash as Key</text>
      <text x="30" y="25" style="font-family: 'Outfit', system-ui, -apple-system, sans-serif',sans-serif;font-size: 10px;fill:#6B6B6B;">SHA-256 = placement key</text>
    </g>

    <g transform="translate(330, 30)">
      <circle cx="12" cy="12" r="10" fill="#FCC9B9"/>
      <text x="12" y="16" style="font-family: 'JetBrains Mono', ui-monospace, monospace',monospace;font-size:10px;font-weight:700;fill:white;text-anchor:middle;">2</text>
      <text x="30" y="12" style="font-family: 'Outfit', system-ui, -apple-system, sans-serif',sans-serif;font-size:10px;font-weight:700;fill:#2D2D2D;">Weighted Rendezvous</text>
      <text x="30" y="25" style="font-family: 'Outfit', system-ui, -apple-system, sans-serif',sans-serif;font-size: 10px;fill:#6B6B6B;">hash(key ⊗ id) × weight</text>
    </g>

    <g transform="translate(15, 65)">
      <circle cx="12" cy="12" r="10" fill="#FFA6A6"/>
      <text x="12" y="16" style="font-family: 'JetBrains Mono', ui-monospace, monospace',monospace;font-size:10px;font-weight:700;fill:white;text-anchor:middle;">3</text>
      <text x="30" y="12" style="font-family: 'Outfit', system-ui, -apple-system, sans-serif',sans-serif;font-size:10px;font-weight:700;fill:#2D2D2D;">Stable Sort</text>
      <text x="30" y="25" style="font-family: 'Outfit', system-ui, -apple-system, sans-serif',sans-serif;font-size: 10px;fill:#6B6B6B;">sort.Stable + fold52</text>
    </g>

    <g transform="translate(330, 65)">
      <circle cx="12" cy="12" r="10" fill="#769267"/>
      <text x="12" y="16" style="font-family: 'JetBrains Mono', ui-monospace, monospace',monospace;font-size:10px;font-weight:700;fill:white;text-anchor:middle;">4</text>
      <text x="30" y="12" style="font-family: 'Outfit', system-ui, -apple-system, sans-serif',sans-serif;font-size:10px;font-weight:700;fill:#2D2D2D;">Failure Domains (R1)</text>
      <text x="30" y="25" style="font-family: 'Outfit', system-ui, -apple-system, sans-serif',sans-serif;font-size: 10px;fill:#6B6B6B;">Rack/Zone/DC diversity</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 330)">
    <rect x="0" y="0" width="640" height="32" rx="6" ry="6" fill="#FAFAFA" stroke="#E8DFD8"/>
    <g transform="translate(15, 6)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#F47983"/><text x="16" y="10" class="legend-text">Input — SHA-256 hash</text>
    </g>
    <g transform="translate(180, 6)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#FCC9B9"/><text x="16" y="10" class="legend-text">Score — Weighted hash</text>
    </g>
    <g transform="translate(330, 6)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#FFA6A6"/><text x="16" y="10" class="legend-text">Sort — Stable order</text>
    </g>
    <g transform="translate(470, 6)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#769267"/><text x="16" y="10" class="legend-text">R1 Filter — Domain diversity</text>
    </g>
  </g>

  <!-- Bolt/Sentinel badges -->
  <g transform="translate(580, 8)">
    <rect x="0" y="0" width="65" height="18" rx="9" fill="rgba(244,121,131,0.12)" stroke="#F47983" stroke-width="1"/>
    <text x="32.5" y="12" text-anchor="middle" style="font-family: 'JetBrains Mono', ui-monospace, monospace',monospace;font-size: 10px;font-weight:700;fill:#F47983;">⚡ BOLT</text>
  </g>
  <g transform="translate(650, 8)">
    <rect x="0" y="0" width="65" height="18" rx="9" fill="rgba(118,146,103,0.12)" stroke="#769267" stroke-width="1"/>
    <text x="32.5" y="12" text-anchor="middle" style="font-family: 'JetBrains Mono', ui-monospace, monospace',monospace;font-size: 10px;font-weight:700;fill:#769267;">🛡 SENTINEL</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#F47983"/>
    </marker>
    <marker id="arrow-success" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#769267"/>
    </marker>

    <linearGradient id="grad-input" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F47983"/>
      <stop offset="100%" stop-color="#FCC9B9"/>
    </linearGradient>
    <linearGradient id="grad-process" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCC9B9"/>
      <stop offset="100%" stop-color="#FFA6A6"/>
    </linearGradient>
    <linearGradient id="grad-output" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#769267"/>
      <stop offset="100%" stop-color="#8AB87A"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#563A10" flood-opacity="0.12"/>
    </filter>

    <style>
      .step-box { filter: url(#shadow); }
      .step-box:hover { filter: url(#shadow) brightness(1.05); }
      .step-num { font-family: 'JetBrains Mono', ui-monospace, monospace', monospace; font-size: 20px; font-weight: 700; fill: #FAFAFA; text-anchor: middle; }
      .step-title { font-family: 'Outfit', system-ui, -apple-system, sans-serif', sans-serif; font-size: 11px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .step-desc { font-family: 'Outfit', system-ui, -apple-system, sans-serif', sans-serif; font-size: 10px; fill: #6B6B6B; text-anchor: middle; }
      .flow-arrow { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
      .legend-text { font-family: 'Outfit', system-ui, -apple-system, sans-serif', sans-serif; font-size: 10px; fill: #6B6B6B; }
      .title-main { font-family: 'Outfit', system-ui, -apple-system, sans-serif', sans-serif; font-size: 15px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .title-sub { font-family: 'Outfit', system-ui, -apple-system, sans-serif', sans-serif; font-size: 10px; fill: #6B6B6B; text-anchor: middle; }
    </style>
  </defs>
</svg>