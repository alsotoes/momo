<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="dur-title dur-desc">
  <title id="dur-title">R3 Write Durability: fsync-Before-Ack, Survivor Quorum, Group Commit</title>
  <desc id="dur-desc">Durability barrier: fsync-before-ack, survivor quorum, group commit batching, read-your-writes. Three modes: fsync, group-commit, none. Aligned with lease/quorum math from R17.</desc>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#F47983"/>
    </marker>
    <marker id="arrow-success" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#769267"/>
    </marker>
    <marker id="arrow-fail" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-bidir" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#FCC9B9"/>
    </marker>
    
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#563A10" flood-opacity="0.15"/>
    </filter>
    
    <linearGradient id="mode-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(244,121,131,0.08)"/>
      <stop offset="100%" style="stop-color:rgba(252,201,185,0.08)"/>
    </linearGradient>
    
    <style>
      .node { filter: url(#drop-shadow); transition: transform 0.2s ease; }
      .node:hover { transform: scale(1.03); }
      .mode-box { fill: url(#mode-grad); stroke: #E0E0E0; stroke-width: 1.5; rx: 8; ry: 8; }
      .title-text { font-family: 'Outfit', system-ui, -apple-system, sans-serif', sans-serif; font-size: 18px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .section-title { font-family: 'Outfit', system-ui, -apple-system, sans-serif', sans-serif; font-size: 13px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .label-text { font-family: 'JetBrains Mono', ui-monospace, monospace', monospace; font-size: 10px; fill: #2D2D2D; text-anchor: middle; }
      .label-small { font-family: 'JetBrains Mono', ui-monospace, monospace', monospace; font-size: 10px; fill: #6B6B6B; text-anchor: middle; }
      .code-text { font-family: 'JetBrains Mono', ui-monospace, monospace', monospace; font-size: 10px; fill: #F47983; }
      .code-success { font-family: 'JetBrains Mono', ui-monospace, monospace', monospace; font-size: 10px; fill: #769267; }
      .code-fail { font-family: 'JetBrains Mono', ui-monospace, monospace', monospace; font-size: 10px; fill: #dc2626; }
      .code-quic { font-family: 'JetBrains Mono', ui-monospace, monospace', monospace; font-size: 10px; fill: #FFA6A6; }
      .code-tcp { font-family: 'JetBrains Mono', ui-monospace, monospace', monospace; font-size: 10px; fill: #563A10; }
      .flow-arrow { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
      .flow-success { stroke: #769267; stroke-width: 2; marker-end: url(#arrow-success); }
      .flow-fail { stroke: #dc2626; stroke-width: 2; marker-end: url(#arrow-fail); }
      .flow-bidir { stroke: #FCC9B9; stroke-width: 1.5; marker-end: url(#arrow-bidir); stroke-dasharray: 3,3; }
      .barrier-box { fill: rgba(244,121,131,0.1); stroke: #F47983; stroke-width: 3; rx: 10; ry: 10; }
      .quorum-box { fill: rgba(118,146,103,0.1); stroke: #769267; stroke-width: 2; }
    </style>
  </defs>
  
  <rect width="800" height="600" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="400" y="30" class="title-text">R3 Write Durability — fsync-Before-Ack, Survivor Quorum</text>
  <text x="400" y="52" class="diagram-subtitle">Ack only what survived: fsync/group-commit barrier, survivor quorum, read-your-writes — the write-side of P0 stack</text>
  
  <!-- ============ THE GUARANTEE ============ -->
  <text x="400" y="75" class="section-title">🛡 THE DURABILITY GUARANTEE</text>
  
  <g transform="translate(400, 100)">
    <g class="node" transform="translate(-300, 0)">
      <rect x="-100" y="-30" width="200" height="60" rx="8" fill="rgba(244,121,131,0.1)" stroke="#F47983" stroke-width="2"/>
      <text x="0" y="-10" text-anchor="middle" class="section-title" fill="#F47983">fsync-before-ack</text>
      <text x="0" y="8" text-anchor="middle" class="code-success">Write acknowledged ONLY after</text>
      <text x="0" y="20" text-anchor="middle" class="code-success">blob durably hit disk (not page cache)</text>
      <text x="0" y="32" text-anchor="middle" class="code-success">on surviving replicas</text>
    </g>
    
    <path d="M-100,0 H-30" class="flow-arrow" marker-end="url(#arrow)"/>
    
    <g class="node" transform="translate(50, 0)">
      <rect x="-100" y="-30" width="200" height="60" rx="8" fill="rgba(118,146,103,0.1)" stroke="#769267" stroke-width="2"/>
      <text x="0" y="-10" text-anchor="middle" class="section-title" fill="#769267">Survivor Quorum</text>
      <text x="0" y="8" text-anchor="middle" class="code-success">Required surviving replicas</text>
      <text x="0" y="20" text-anchor="middle" class="code-success">confirm fsync</text>
      <text x="0" y="32" text-anchor="middle" class="code-success">Aligned with lease quorum (R17)</text>
    </g>
    
    <path d="M150,0 H220" class="flow-arrow" marker-end="url(#arrow)"/>
    
    <g class="node" transform="translate(320, 0)">
      <rect x="-100" y="-30" width="200" height="60" rx="8" fill="rgba(252,201,185,0.15)" stroke="#FCC9B9" stroke-width="2"/>
      <text x="0" y="-10" text-anchor="middle" class="section-title" fill="#FCC9B9">Group Commit</text>
      <text x="0" y="8" text-anchor="middle" class="code-success">Batch multiple writes</text>
      <text x="0" y="20" text-anchor="middle" class="code-success">Single fsync for batch</text>
      <text x="0" y="32" text-anchor="middle" class="code-success">Higher throughput, same durability</text>
    </g>
    
    <path d="M420,0 H490" class="flow-arrow" marker-end="url(#arrow)"/>
    
    <g class="node" transform="translate(590, 0)">
      <rect x="-100" y="-30" width="200" height="60" rx="8" fill="rgba(253,237,173,0.15)" stroke="#FDEDAD" stroke-width="2"/>
      <text x="0" y="-10" text-anchor="middle" class="section-title" fill="#FDEDAD">Read-Your-Writes</text>
      <text x="0" y="8" text-anchor="middle" class="code-success">After ack, subsequent read</text>
      <text x="0" y="20" text-anchor="middle" class="code-success">returns acknowledged object</text>
    </g>
  </g>
  
  <!-- ============ THREE MODES ============ -->
  <text x="400" y="200" class="section-title">⚙️ THREE DURABILITY MODES (Configurable Barrier)</text>
  
  <g transform="translate(400, 230)">
    <!-- fsync mode -->
    <g class="node mode-box" transform="translate(-280, 0)">
      <rect x="-120" y="-5" width="240" height="160" rx="8"/>
      <text x="0" y="20" text-anchor="middle" class="section-title" fill="#F47983">MODE: fsync (Strict)</text>
      <g transform="translate(-110, 35)">
        <text y="0" text-anchor="start" class="code-success">✓ fsync() before ACK</text>
        <text y="16" text-anchor="start" class="code-success">✓ Strongest guarantee</text>
        <text y="32" text-anchor="start" class="code-success">✓ Survives power loss</text>
        <text y="48" text-anchor="start" class="code-text" style="fill:#563A10;">Latency: ~2-5ms per write</text>
        <text y="64" text-anchor="start" class="code-text" style="fill:#563A10;">Throughput: limited by disk fsync</text>
        <text y="80" text-anchor="start" class="code-success">Use when: Financial data, critical metadata</text>
        <text y="96" text-anchor="start" class="code-text" style="fill:#F47983;">config: durability.mode = "fsync"</text>
      </g>
    </g>
    
    <!-- group-commit mode -->
    <g class="node mode-box" transform="translate(0, 0)">
      <rect x="-120" y="-5" width="240" height="160" rx="8" style="stroke:#769267; stroke-width:2;"/>
      <text x="0" y="20" text-anchor="middle" class="section-title" fill="#769267">MODE: group-commit (Balanced)</text>
      <g transform="translate(-110, 35)">
        <text y="0" text-anchor="start" class="code-success">✓ Batch writes → single fsync()</text>
        <text y="16" text-anchor="start" class="code-success">✓ Configurable batch window (1-10ms)</text>
        <text y="32" text-anchor="start" class="code-success">✓ Still survives power loss (batched)</text>
        <text y="48" text-anchor="start" class="code-text" style="fill:#563A10;">Latency: ~1-2ms (amortized)</text>
        <text y="64" text-anchor="start" class="code-text" style="fill:#563A10;">Throughput: 10-50x fsync mode</text>
        <text y="80" text-anchor="start" class="code-success">Use when: High throughput, durability required</text>
        <text y="96" text-anchor="start" class="code-text" style="fill:#769267;">config: durability.mode = "group-commit"</text>
      </g>
    </g>
    
    <!-- none mode -->
    <g class="node mode-box" transform="translate(280, 0)">
      <rect x="-120" y="-5" width="240" height="160" rx="8" style="stroke:#dc2626; stroke-width:2;"/>
      <text x="0" y="20" text-anchor="middle" class="section-title" fill="#dc2626">MODE: none (Performance Only)</text>
      <g transform="translate(-110, 35)">
        <text y="0" text-anchor="start" class="code-fail">✗ No fsync — relies on page cache</text>
        <text y="16" text-anchor="start" class="code-fail">✗ Power loss = data loss</text>
        <text y="32" text-anchor="start" class="code-fail">✗ NOT durable</text>
        <text y="48" text-anchor="start" class="code-text" style="fill:#563A10;">Latency: ~0.1ms (memory only)</text>
        <text y="64" text-anchor="start" class="code-text" style="fill:#563A10;">Throughput: disk bandwidth limited</text>
        <text y="80" text-anchor="start" class="code-fail">Use when: Ephemeral data, test, cache</text>
        <text y="96" text-anchor="start" class="code-text" style="fill:#dc2626;">config: durability.mode = "none"</text>
      </g>
    </g>
  </g>
  
  <!-- ============ REPLICATION FORWARDING FLOW ============ -->
  <text x="400" y="420" class="section-title">🔄 REPLICATION FORWARDING WITH DURABILITY BARRIER</text>
  
  <g transform="translate(400, 450)">
    <!-- Client -->
    <g class="node" transform="translate(-320, 0)">
      <rect x="-50" y="-25" width="100" height="50" rx="8" fill="#FDEDAD" stroke="#FDEDAD" stroke-width="2"/>
      <text y="-6" text-anchor="middle" class="label-text">Client</text>
      <text y="8" text-anchor="middle" class="label-small">PUT</text>
    </g>
    
    <!-- Primary -->
    <g class="node" transform="translate(-150, 0)">
      <rect x="-70" y="-30" width="140" height="60" class="step-box" style="stroke:#F47983;"/>
      <text x="0" y="-12" text-anchor="middle" class="section-title" fill="#F47983">PRIMARY (N0)</text>
      <g transform="translate(-60, 0)">
        <text y="0" text-anchor="start" class="code-text">1. Hash + validate</text>
        <text y="16" text-anchor="start" class="code-text">2. Local PutBlob + fsync</text>
        <text y="32" text-anchor="start" class="code-text">3. Forward to replicas</text>
      </g>
    </g>
    
    <!-- Arrow -->
    <path d="M-80,0 H-30" class="flow-arrow" marker-end="url(#arrow)"/>
    
    <!-- Replica 1 -->
    <g class="node" transform="translate(50, 0)">
      <rect x="-70" y="-30" width="140" height="60" class="step-box" style="stroke:#FCC9B9;"/>
      <text x="0" y="-12" text-anchor="middle" class="section-title" fill="#FCC9B9">REPLICA 1 (N1)</text>
      <g transform="translate(-60, 0)">
        <text y="0" text-anchor="start" class="code-text">PutBlob + fsync</text>
        <text y="16" text-anchor="start" class="code-success">Confirm fsync → primary</text>
      </g>
    </g>
    
    <!-- Arrow -->
    <path d="M120,0 H170" class="flow-arrow" marker-end="url(#arrow)"/>
    
    <!-- Replica 2 -->
    <g class="node" transform="translate(280, 0)">
      <rect x="-70" y="-30" width="140" height="60" class="step-box" style="stroke:#FFA6A6;"/>
      <text x="0" y="-12" text-anchor="middle" class="section-title" fill="#FFA6A6">REPLICA 2 (N2)</text>
      <g transform="translate(-60, 0)">
        <text y="0" text-anchor="start" class="code-text">PutBlob + fsync</text>
        <text y="16" text-anchor="start" class="code-success">Confirm fsync → primary</text>
      </g>
    </g>
    
    <!-- Arrow back to primary -->
    <path d="M350,0 H420" class="flow-success" marker-end="url(#arrow-success)"/>
    
    <!-- Barrier Decision -->
    <g class="node barrier-box" transform="translate(500, 0)">
      <rect x="-80" y="-30" width="160" height="60" rx="8"/>
      <text x="0" y="-12" text-anchor="middle" class="section-title" fill="#F47983">BARRIER</text>
      <text x="0" y="6" text-anchor="middle" class="code-success">Survivor quorum met?</text>
      <text x="0" y="20" text-anchor="middle" class="code-success">Required replicas confirmed?</text>
      <text x="0" y="34" text-anchor="middle" class="code-success">Yes → ACK client</text>
    </g>
    
    <!-- Arrow to client -->
    <path d="M580,0 H650" class="flow-success" marker-end="url(#arrow-success)"/>
    
    <g class="node" transform="translate(720, 0)">
      <rect x="-50" y="-25" width="100" height="50" rx="8" fill="#FDEDAD" stroke="#FDEDAD" stroke-width="2"/>
      <text y="-6" text-anchor="middle" class="label-text">Client</text>
      <text y="8" text-anchor="middle" class="label-small">ACK ✓</text>
    </g>
  </g>
  
  <!-- ============ P0 DURABILITY STACK ============ -->
  <g transform="translate(400, 540)">
    <g class="node quorum-box" transform="translate(0, 0)">
      <rect x="-180" y="-5" width="360" height="70" rx="10"/>
      <text x="0" y="12" text-anchor="middle" class="section-title" fill="#769267">P0 DURABILITY/CONSISTENCY STACK (Issue #928)</text>
      <g transform="translate(0, 28)">
        <text y="0" text-anchor="middle" class="code-text" style="fill:#563A10;">R1 [019]: Failure domain placement — WHERE replicas live</text>
        <text y="18" text-anchor="middle" class="code-text" style="fill:#563A10;">R2 [020]: Degraded-read self-heal — WHAT survives corruption</text>
        <text y="36" text-anchor="middle" class="code-success">R3 (this): fsync-before-ack + quorum — WHAT "written" MEANS</text>
      </g>
    </g>
  </g>
  
  <!-- Bolt/Sentinel badges -->
  <g transform="translate(620, 15)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="rgba(244,121,131,0.15)" stroke="#F47983" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10px" font-weight="700" fill="#F47983">⚡ BOLT</text>
  </g>
  <g transform="translate(710, 15)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="rgba(118,146,103,0.15)" stroke="#769267" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10px" font-weight="700" fill="#769267">🛡 SENTINEL</text>
  </g>
</svg>