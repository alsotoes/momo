<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-05c desc-05c">
  <title id="title-05c">Client-Held E2EE: Retrieval GET Flow</title>
  <desc id="desc-05c">Step-by-step sequence of downloading and decrypting an end-to-end encrypted object in momo.</desc>

  <defs>
    <marker id="arrow-get" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#769267"/>
    </marker>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .zone-server { fill: #FFFFFF; stroke: #563A10; stroke-width: 1.5; rx: 8; ry: 8; }
      .zone-client { fill: #FFFFFF; stroke: #769267; stroke-width: 1.5; rx: 8; ry: 8; }
      .zone-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .step-rect { fill: #FEFEF9; stroke: #E0E0E0; stroke-width: 1; rx: 6; ry: 6; }
      .step-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #2D2D2D; }
      .step-code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #769267; }
      .flow-line { fill: none; stroke: #769267; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow-get); }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <text x="320" y="30" class="title">E2EE Retrieval (GET) Cryptographic Flow</text>
  <text x="320" y="48" class="subtitle">Server streams ciphertext with wrapped envelope — client decrypts locally via private KEK</text>

  <!-- Server Zone (Left) -->
  <g transform="translate(30, 65)">
    <rect x="0" y="0" width="265" height="260" class="zone-server"/>
    <text x="132" y="24" class="zone-header" fill="#563A10">SERVER SIDE (Untrusted Storage)</text>

    <!-- Step 1 -->
    <rect x="15" y="45" width="235" height="55" class="step-rect"/>
    <text x="25" y="65" class="step-text">1. Fetch Raw Ciphertext</text>
    <text x="25" y="85" class="step-code">stream = blobs.GetBlob(hash)</text>

    <!-- Step 2 -->
    <rect x="15" y="125" width="235" height="55" class="step-rect"/>
    <text x="25" y="145" class="step-text">2. Read Envelope Metadata</text>
    <text x="25" y="165" class="step-code">WrappedCEK = bbolt.Get(metaKey)</text>

    <text x="132" y="245" style="font-family:system-ui,sans-serif;font-size: 11px;fill:#563A10;text-anchor:middle;">Server cannot inspect payload</text>
  </g>

  <!-- Network Boundary (Center Arrow) -->
  <path d="M295, 195 H345" class="flow-line"/>
  <text x="320" y="172" style="font-family:ui-monospace,monospace;font-size: 11px;fill:#6B6B6B;text-anchor:middle;">HTTP 200</text>
  <text x="320" y="186" style="font-family:ui-monospace,monospace;font-size: 11px;fill:#769267;text-anchor:middle;">Stream+Key</text>

  <!-- Client Zone (Right) -->
  <g transform="translate(345, 65)">
    <rect x="0" y="0" width="265" height="260" class="zone-client"/>
    <text x="132" y="24" class="zone-header" fill="#769267">CLIENT SIDE (Trusted Boundary)</text>

    <!-- Step 3 -->
    <rect x="15" y="45" width="235" height="55" class="step-rect"/>
    <text x="25" y="65" class="step-text">3. Unwrap CEK using KEK</text>
    <text x="25" y="85" class="step-code">CEK = KEK.Open(WrappedCEK)</text>

    <!-- Step 4 -->
    <rect x="15" y="125" width="235" height="55" class="step-rect"/>
    <text x="25" y="145" class="step-text">4. Stream Decrypt Ciphertext</text>
    <text x="25" y="165" class="step-code">Plaintext = Open(CEK, Ciphertext)</text>

    <text x="132" y="245" style="font-family:system-ui,sans-serif;font-size: 11px;fill:#769267;text-anchor:middle;">Client verifies GCM auth tag</text>
  </g>
</svg>
