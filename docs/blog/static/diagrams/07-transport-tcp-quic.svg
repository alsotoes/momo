<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-07 desc-07">
  <title id="title-07">Transport Protocols: momo-tcp vs momo-quic</title>
  <desc id="desc-07">Comparing momo's custom framed TCP transport for LANs against QUIC multiplexing for lossy WAN links.</desc>

  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .card-tcp { fill: #FFFFFF; stroke: #563A10; stroke-width: 1.5; rx: 8; ry: 8; }
      .card-quic { fill: #FFFFFF; stroke: #769267; stroke-width: 2; rx: 8; ry: 8; }
      .head { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6B6B6B; }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <text x="320" y="32" class="title">Transport Evolution: TCP vs. QUIC</text>
  <text x="320" y="52" class="subtitle">Framed binary streaming on LAN vs. zero-RTT multiplexing on lossy WAN</text>

  <!-- Left: momo-tcp -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="275" height="175" class="card-tcp"/>
    <text x="137" y="26" class="head" fill="#563A10">momo-tcp (LAN Optimized)</text>
    
    <g transform="translate(15, 45)">
      <text y="15" class="code" fill="#563A10">• 19B UnixNano timestamp handshake</text>
      <text y="35" class="code" fill="#563A10">• Fixed 64-byte metadata header frame</text>
      <text y="55" class="code" fill="#563A10">• Direct kernel socket zero-copy stream</text>
      <text y="85" class="sub">• High throughput on 10/100 GbE LAN</text>
      <text y="105" class="sub">• Vulnerable to Head-of-Line packet blocking</text>
    </g>
  </g>

  <!-- Right: momo-quic -->
  <g transform="translate(335, 75)">
    <rect x="0" y="0" width="275" height="175" class="card-quic"/>
    <text x="137" y="26" class="head" fill="#769267">momo-quic (WAN / Edge)</text>
    
    <g transform="translate(15, 45)">
      <text y="15" class="code" fill="#769267">• 0-RTT connection re-establishment</text>
      <text y="35" class="code" fill="#769267">• Independent multiplexed streams</text>
      <text y="55" class="code" fill="#769267">• Packet loss in stream A doesn't stall B</text>
      <text y="85" class="sub">• Built-in TLS 1.3 encryption by default</text>
      <text y="105" class="sub">• Native client connection migration</text>
    </g>
  </g>

  <!-- Bottom Metric Comparison -->
  <g transform="translate(30, 265)">
    <rect x="0" y="0" width="580" height="70" rx="8" ry="8" fill="#FEFEF9" stroke="#E8DFD8" stroke-width="1.5"/>
    <text x="20" y="24" style="font-family:system-ui,sans-serif;font-size:12px;font-weight:700;fill:#563A10;">Benchmark Comparison under 2% Packet Loss</text>
    <text x="20" y="44" style="font-family:ui-monospace,monospace;font-size:11px;fill:#2D2D2D;">momo-tcp stalls on packet retransmission (throughput collapses by 70%).</text>
    <text x="20" y="58" style="font-family:ui-monospace,monospace;font-size:11px;fill:#769267;">momo-quic sustains 92% link throughput via out-of-order stream multiplexing.</text>
  </g>
</svg>
