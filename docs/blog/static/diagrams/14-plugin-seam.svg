<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-14 desc-14">
  <title id="title-14">Seams, Not Plugins: Architecture Overview</title>
  <desc id="desc-14">Architecture overview of momo's Rule 74 seam-over-plugins design: core storage invariants remain concrete while seams provide clean extension points.</desc>

  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .core-box { fill: #FFFFFF; stroke: #563A10; stroke-width: 2; rx: 8; ry: 8; }
      .seam-box { fill: #FEFEF9; stroke: #769267; stroke-width: 1.5; rx: 6; ry: 6; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .text-sub { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #6B6B6B; text-anchor: middle; }
      .text-seam { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; font-weight: 600; fill: #769267; text-anchor: middle; }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <text x="320" y="32" class="title">Seams Over Plugins: Architectural Invariant</text>
  <text x="320" y="52" class="subtitle">Trust the core, keep fast paths concrete, place compile-time seams at decision points</text>

  <!-- Core Invariant Box (Center) -->
  <g transform="translate(180, 75)">
    <rect x="0" y="0" width="280" height="90" class="core-box"/>
    <text x="140" y="26" class="text-title" fill="#563A10">THE CONCRETE TRUST CORE</text>
    <text x="140" y="48" class="text-sub">• CAS Content-Addressing (SHA-256)</text>
    <text x="140" y="66" class="text-sub">• Bbolt Metadata &amp; Namespaces</text>
    <text x="140" y="82" class="text-sub">• Verify-on-Read &amp; Scrub Guards</text>
  </g>

  <!-- Three Injected Seams (Bottom Row) -->
  <g transform="translate(30, 195)">
    <rect x="0" y="0" width="180" height="70" class="seam-box"/>
    <text x="90" y="24" class="text-title" style="font-size:11px;">1. BACKEND SEAM</text>
    <text x="90" y="44" class="text-seam">BlobStore Interface</text>
    <text x="90" y="60" class="text-sub">Local / NFS / S3 / Raw</text>
  </g>

  <g transform="translate(230, 195)">
    <rect x="0" y="0" width="180" height="70" class="seam-box"/>
    <text x="90" y="24" class="text-title" style="font-size:11px;">2. DURABILITY SEAM</text>
    <text x="90" y="44" class="text-seam">DurabilityBarrier</text>
    <text x="90" y="60" class="text-sub">fsync / group / none</text>
  </g>

  <g transform="translate(430, 195)">
    <rect x="0" y="0" width="180" height="70" class="seam-box"/>
    <text x="90" y="24" class="text-title" style="font-size:11px;">3. VERIFY SEAM</text>
    <text x="90" y="44" class="text-seam">ReadVerifier</text>
    <text x="90" y="60" class="text-sub">everyRead / verifiedCache</text>
  </g>

  <!-- Bottom Quote -->
  <g transform="translate(30, 285)">
    <rect x="0" y="0" width="580" height="50" rx="6" ry="6" fill="#FEFEF9" stroke="#E8DFD8"/>
    <text x="290" y="24" style="font-family:system-ui,sans-serif;font-size:11px;font-weight:600;fill:#563A10;text-anchor:middle;">Rule 74: Never put dynamic out-of-process plugins on the storage fast path.</text>
    <text x="290" y="40" style="font-family:ui-monospace,monospace;font-size: 11px;fill:#6B6B6B;text-anchor:middle;">Compile-time interface injection guarantees 0 allocation overhead and complete auditability.</text>
  </g>
</svg>
