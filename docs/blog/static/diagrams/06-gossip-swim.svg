<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-06 desc-06">
  <title id="title-06">SWIM Failure Detector State Machine</title>
  <desc id="desc-06">The two-phase SWIM protocol: direct ping, indirect probes via k peers, suspicion timer, and dead eviction.</desc>

  <defs>
    <marker id="arrow-sw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#F47983"/>
    </marker>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .st-card { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1.5; rx: 8; ry: 8; }
      .head { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6B6B6B; text-anchor: middle; }
      .code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; text-anchor: middle; }
      .flow { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow-sw); }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <text x="320" y="32" class="title">SWIM Protocol: Failure Detection Lifecycle</text>
  <text x="320" y="52" class="subtitle">Bounded network overhead — indirect probing avoids false positives from transient loss</text>

  <!-- State 1: Direct Ping -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="165" height="150" class="st-card" stroke="#769267" stroke-width="2"/>
    <text x="82" y="28" class="head" fill="#769267">1. Direct Probe</text>
    <text x="82" y="55" class="code" fill="#563A10">Ping(Target)</text>
    <text x="82" y="80" class="sub">• Direct UDP packet</text>
    <text x="82" y="100" class="sub">• Timeout T (200 ms)</text>
    <text x="82" y="125" class="sub" fill="#769267">Ack -> Healthy</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M195, 155 H235" class="flow"/>
  <text x="215" y="145" style="font-family:ui-monospace,monospace;font-size:11px;fill:#F47983;text-anchor:middle;">No Ack</text>

  <!-- State 2: Indirect Probe -->
  <g transform="translate(238, 80)">
    <rect x="0" y="0" width="165" height="150" class="st-card" stroke="#F47983" stroke-width="2"/>
    <text x="82" y="28" class="head" fill="#F47983">2. Indirect Probes</text>
    <text x="82" y="55" class="code" fill="#F47983">PingReq(Target, k=3)</text>
    <text x="82" y="80" class="sub">• Ask 3 random peers</text>
    <text x="82" y="100" class="sub">• Bypasses local link drop</text>
    <text x="82" y="125" class="sub" fill="#769267">Any Ack -> Healthy</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M403, 155 H443" class="flow"/>
  <text x="423" y="145" style="font-family:ui-monospace,monospace;font-size:11px;fill:#F47983;text-anchor:middle;">Timeout</text>

  <!-- State 3: Suspect & Evict -->
  <g transform="translate(445, 80)">
    <rect x="0" y="0" width="165" height="150" class="st-card" stroke="#dc2626" stroke-width="2"/>
    <text x="82" y="28" class="head" fill="#dc2626">3. Suspect &amp; Evict</text>
    <text x="82" y="55" class="code" fill="#dc2626">Gossip(Suspect)</text>
    <text x="82" y="80" class="sub">• Suspicion timer starts</text>
    <text x="82" y="100" class="sub">• Target may refute</text>
    <text x="82" y="125" class="sub" fill="#dc2626">Expired -> Mark DEAD</text>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(30, 255)">
    <rect x="0" y="0" width="580" height="75" rx="8" ry="8" fill="#FEFEF9" stroke="#E8DFD8" stroke-width="1.5"/>
    <text x="20" y="25" style="font-family:system-ui,sans-serif;font-size:12px;font-weight:700;fill:#563A10;">SWIM Guarantees:</text>
    <text x="20" y="46" style="font-family:system-ui,sans-serif;font-size:11px;fill:#2D2D2D;">• O(1) probe message overhead per node per period regardless of cluster size.</text>
    <text x="20" y="64" style="font-family:system-ui,sans-serif;font-size:11px;fill:#2D2D2D;">• Indirect pinging prevents temporary local routing glitches from causing cluster-wide flap.</text>
  </g>
</svg>
