<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="gossip-title gossip-desc">
  <title id="gossip-title">P2P Gossip &amp; SWIM Failure Detection</title>
  <desc id="gossip-desc">Masterless ring: SWIM failure detection with heartbeat/ping/ack, ALIVE/OFFLINE state machine, discovered-peer dialing, OFFLINE→ALIVE restoration. Gossip fanout adapts with cluster size.</desc>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#F47983"/>
    </marker>
    <marker id="arrow-success" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#769267"/>
    </marker>
    <marker id="arrow-bidir" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#FCC9B9"/>
    </marker>
    
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#563A10" flood-opacity="0.15"/>
    </filter>
    
    <style>
      .node { filter: url(#drop-shadow); transition: transform 0.2s ease; }
      .node:hover { transform: scale(1.05); }
      .alive { fill: rgba(118,146,103,0.2); stroke: #769267; stroke-width: 2; }
      .offline { fill: rgba(220,38,38,0.15); stroke: #dc2626; stroke-width: 2; stroke-dasharray: 4,3; }
      .suspect { fill: rgba(245,158,11,0.2); stroke: #f59e0b; stroke-width: 2; }
      .title-text { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .section-title { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .label-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #2D2D2D; text-anchor: middle; }
      .label-small { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #6B6B6B; text-anchor: middle; }
      .code-text { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #F47983; }
      .code-success { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #769267; }
      .flow-arrow { fill: none; stroke: #F47983; stroke-width: 1.5; stroke-linecap: round; marker-end: url(#arrow); }
      .flow-success { stroke: #769267; marker-end: url(#arrow-success); }
      .flow-bidir { stroke: #FCC9B9; marker-end: url(#arrow-bidir); stroke-dasharray: 3,3; }
      .gossip-msg { fill: none; stroke: #F47983; stroke-width: 1; stroke-dasharray: 2,3; marker-end: url(#arrow); }
    </style>
  </defs>
  
  <rect width="800" height="600" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="400" y="30" class="title-text">P2P Gossip &amp; SWIM — Masterless Ring</text>
  <text x="400" y="50" class="diagram-subtitle">Gossip for metadata, SWIM failure detection, scatter-gather queries, lease consensus — momo's nervous system</text>
  
  <!-- ============ RING TOPOLOGY ============ -->
  <text x="400" y="75" class="section-title">🔄 RING TOPOLOGY &amp; GOSSIP FAN-OUT</text>
  
  <!-- 5-node ring -->
  <g transform="translate(400, 200)">
    <!-- Center -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="8,8"/>
    
    <!-- Nodes on ring -->
    <g id="ring-nodes">
      <!-- N0 at top -->
      <g class="node alive" transform="translate(0, -140)">
        <circle cx="0" cy="0" r="32"/>
        <text y="-18" text-anchor="middle" class="label-text">N0</text>
        <text y="0" text-anchor="middle" class="label-small">ALIVE</text>
        <text y="16" text-anchor="middle" class="code-success" style="font-size:8px;">incumbent</text>
      </g>
      
      <!-- N1 top-right -->
      <g class="node alive" transform="translate(82, -114)">
        <circle cx="0" cy="0" r="32"/>
        <text y="-18" text-anchor="middle" class="label-text">N1</text>
        <text y="0" text-anchor="middle" class="label-small">ALIVE</text>
        <text y="16" text-anchor="middle" class="code-text" style="font-size:8px;">peer</text>
      </g>
      
      <!-- N2 bottom-right -->
      <g class="node alive" transform="translate(115, 50)">
        <circle cx="0" cy="0" r="32"/>
        <text y="-18" text-anchor="middle" class="label-text">N2</text>
        <text y="0" text-anchor="middle" class="label-small">ALIVE</text>
        <text y="16" text-anchor="middle" class="code-text" style="font-size:8px;">peer</text>
      </g>
      
      <!-- N3 bottom-left -->
      <g class="node alive" transform="translate(-115, 50)">
        <circle cx="0" cy="0" r="32"/>
        <text y="-18" text-anchor="middle" class="label-text">N3</text>
        <text y="0" text-anchor="middle" class="label-small">ALIVE</text>
        <text y="16" text-anchor="middle" class="code-text" style="font-size:8px;">peer</text>
      </g>
      
      <!-- N4 top-left -->
      <g class="node alive" transform="translate(-82, -114)">
        <circle cx="0" cy="0" r="32"/>
        <text y="-18" text-anchor="middle" class="label-text">N4</text>
        <text y="0" text-anchor="middle" class="label-small">ALIVE</text>
        <text y="16" text-anchor="middle" class="code-text" style="font-size:8px;">peer</text>
      </g>
    </g>
    
    <!-- Gossip connections (bidirectional) -->
    <g style="stroke:#F47983; stroke-width:1; stroke-dasharray:3,3;">
      <path d="M0,-140 L82,-114" class="gossip-msg" marker-end="url(#arrow)"/>
      <path d="M82,-114 L115,50" class="gossip-msg" marker-end="url(#arrow)"/>
      <path d="M115,50 L-115,50" class="gossip-msg" marker-end="url(#arrow)"/>
      <path d="M-115,50 L-82,-114" class="gossip-msg" marker-end="url(#arrow)"/>
      <path d="M-82,-114 L0,-140" class="gossip-msg" marker-end="url(#arrow)"/>
      <!-- Cross connections -->
      <path d="M0,-140 L115,50" class="gossip-msg" marker-end="url(#arrow)" style="opacity:0.3;"/>
      <path d="M82,-114 L-115,50" class="gossip-msg" marker-end="url(#arrow)" style="opacity:0.3;"/>
    </g>
    
    <!-- Fanout indicator -->
    <g transform="translate(0, 180)">
      <rect x="-100" y="0" width="200" height="30" rx="6" fill="rgba(244,121,131,0.15)" stroke="#F47983"/>
      <text x="0" y="19" text-anchor="middle" class="label-small">Gossip fanout = min(3, cluster_size) — adaptive scaling (#897)</text>
    </g>
  </g>
  
  <!-- ============ SWIM STATE MACHINE ============ -->
  <text x="400" y="360" class="section-title">🏓 SWIM STATE MACHINE (ALIVE/OFFLINE/SUSPECT)</text>
  
  <g transform="translate(100, 390)">
    <!-- ALIVE state -->
    <g class="node alive" transform="translate(0, 0)">
      <rect x="0" y="0" width="140" height="100" rx="10" ry="10"/>
      <text x="70" y="22" text-anchor="middle" class="section-title" fill="#769267">ALIVE</text>
      <g transform="translate(10, 35)">
        <text y="0" text-anchor="start" class="code-success">• Heartbeat received</text>
        <text y="16" text-anchor="start" class="code-success">• Ping/Ack successful</text>
        <text y="32" text-anchor="start" class="code-success">• Member of PeerMap</text>
        <text y="48" text-anchor="start" class="code-success">• Dialable, in conn pool</text>
      </g>
    </g>
    
    <!-- Arrow ALIVE → SUSPECT -->
    <path d="M155,50 H205" class="flow-arrow" marker-end="url(#arrow)"/>
    
    <!-- SUSPECT state -->
    <g class="node suspect" transform="translate(215, 0)">
      <rect x="0" y="0" width="140" height="100" rx="10" ry="10"/>
      <text x="70" y="22" text-anchor="middle" class="section-title" fill="#f59e0b">SUSPECT</text>
      <g transform="translate(10, 35)">
        <text y="0" text-anchor="start" class="code-text" style="fill:#f59e0b;">• Ping timeout (no ack)</text>
        <text y="16" text-anchor="start" class="code-text" style="fill:#f59e0b;">• Indirect ping via peers</text>
        <text y="32" text-anchor="start" class="code-text" style="fill:#f59e0b;">• Timeout: SWIM interval</text>
        <text y="48" text-anchor="start" class="code-text" style="fill:#f59e0b;">• Can recover to ALIVE</text>
      </g>
    </g>
    
    <!-- Arrow SUSPECT → OFFLINE -->
    <path d="M370,50 H420" class="flow-arrow" marker-end="url(#arrow)" style="stroke:#dc2626;"/>
    
    <!-- OFFLINE state -->
    <g class="node offline" transform="translate(430, 0)">
      <rect x="0" y="0" width="140" height="100" rx="10" ry="10"/>
      <text x="70" y="22" text-anchor="middle" class="section-title" fill="#dc2626">OFFLINE</text>
      <g transform="translate(10, 35)">
        <text y="0" text-anchor="start" class="code-fail">• Indirect ping failed</text>
        <text y="16" text-anchor="start" class="code-fail">• Removed from PeerMap</text>
        <text y="32" text-anchor="start" class="code-fail">• Connections closed</text>
        <text y="48" text-anchor="start" class="code-fail">• CRUSH weight = 0</text>
      </g>
    </g>
    
    <!-- OFFLINE → ALIVE restoration arrow (curved) -->
    <path d="M570,50 Q500,-50 70,50" class="flow-success" marker-end="url(#arrow-success)" style="stroke-width:2;"/>
    <text x="320" y="30" text-anchor="middle" class="code-success" style="font-size:10px;">OFFLINE → ALIVE restoration (#809)</text>
  </g>
  
  <!-- ============ DISCOVERY → DIAL FLOW ============ -->
  <text x="400" y="520" class="section-title">🔍 DISCOVERY → DIAL (Fixed #598)</text>
  
  <g transform="translate(100, 540)">
    <g class="node" transform="translate(0, 0)">
      <rect x="0" y="0" width="150" height="80" rx="8" fill="#FAFAFA" stroke="#F47983" stroke-width="2"/>
      <text x="75" y="18" text-anchor="middle" class="section-title" fill="#F47983">DISCOVERY</text>
      <text x="75" y="38" text-anchor="middle" class="label-small">Gossip reveals</text>
      <text x="75" y="52" text-anchor="middle" class="label-small">new peer addr</text>
      <text x="75" y="66" text-anchor="middle" class="code-text" style="font-size:8px;">peer = gossip.PeerMeta</text>
    </g>
    
    <path d="M170,40 H220" class="flow-arrow" marker-end="url(#arrow)"/>
    
    <g class="node" transform="translate(230, 0)">
      <rect x="0" y="0" width="150" height="80" rx="8" fill="#FAFAFA" stroke="#769267" stroke-width="2"/>
      <text x="75" y="18" text-anchor="middle" class="section-title" fill="#769267">DIAL</text>
      <text x="75" y="38" text-anchor="middle" class="label-small">TCP/QUIC connect</text>
      <text x="75" y="52" text-anchor="middle" class="label-small">Verify identity</text>
      <text x="75" y="66" text-anchor="middle" class="code-success" style="font-size:8px;">conn, err = dial()</text>
    </g>
    
    <path d="M380,40 H430" class="flow-success" marker-end="url(#arrow-success)"/>
    
    <g class="node" transform="translate(440, 0)">
      <rect x="0" y="0" width="150" height="80" rx="8" fill="rgba(118,146,103,0.15)" stroke="#769267" stroke-width="2"/>
      <text x="75" y="18" text-anchor="middle" class="section-title" fill="#769267">PEER MAP</text>
      <text x="75" y="38" text-anchor="middle" class="label-small">Add to PeerMap</text>
      <text x="75" y="52" text-anchor="middle" class="label-small">Update CRUSH weights</text>
      <text x="75" y="66" text-anchor="middle" class="code-success" style="font-size:8px;">PeerMap.Add(peer)</text>
    </g>
    
    <text x="230" y="110" text-anchor="middle" class="code-fail" style="font-size:9px;">BUG #598: Discovered peers never dialed — membership simply didn't work</text>
  </g>
  
  <!-- Bolt/Sentinel badges -->
  <g transform="translate(620, 15)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="rgba(244,121,131,0.15)" stroke="#F47983" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" font-family="JetBrains Mono" font-size="9px" font-weight="700" fill="#F47983">⚡ BOLT</text>
  </g>
  <g transform="translate(710, 15)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="rgba(118,146,103,0.15)" stroke="#769267" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" font-family="JetBrains Mono" font-size="9px" font-weight="700" fill="#769267">🛡 SENTINEL</text>
  </g>
</svg>