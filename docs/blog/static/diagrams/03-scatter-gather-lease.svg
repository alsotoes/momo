<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-03 desc-03">
  <title id="title-03">Scatter-Gather &amp; Lease Quorum Consensus</title>
  <desc id="desc-03">Architecture of scatter-gather metadata queries and lease-based strict quorum consensus in momo.</desc>

  <defs>
    <marker id="arrow-sg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#F47983"/>
    </marker>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .card { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1.5; rx: 8; ry: 8; }
      .head { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; text-anchor: middle; }
      .line { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow-sg); }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <text x="320" y="32" class="title">Scatter-Gather &amp; Lease Consensus</text>
  <text x="320" y="52" class="subtitle">Concurrent peer metadata polling with strict majority quorum validation</text>

  <!-- Initiator Node (Top Center) -->
  <g transform="translate(230, 75)">
    <rect x="0" y="0" width="180" height="48" class="card" stroke="#F47983" stroke-width="2"/>
    <text x="90" y="24" class="head" fill="#F47983">Initiator Daemon</text>
    <text x="90" y="40" class="code" fill="#6B6B6B">Scatter QueryGet</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M260, 123 L110, 168" class="line"/>
  <path d="M320, 123 L320, 168" class="line"/>
  <path d="M380, 123 L530, 168" class="line"/>

  <!-- Peer Nodes (Middle Row) -->
  <g transform="translate(30, 175)">
    <rect x="0" y="0" width="160" height="55" class="card" stroke="#769267"/>
    <text x="80" y="24" class="head" fill="#769267">Peer 1 (Voted)</text>
    <text x="80" y="42" class="code" fill="#2D2D2D">Active Lease: OK</text>
  </g>

  <g transform="translate(240, 175)">
    <rect x="0" y="0" width="160" height="55" class="card" stroke="#769267"/>
    <text x="80" y="24" class="head" fill="#769267">Peer 2 (Voted)</text>
    <text x="80" y="42" class="code" fill="#2D2D2D">Active Lease: OK</text>
  </g>

  <g transform="translate(450, 175)">
    <rect x="0" y="0" width="160" height="55" class="card" stroke="#dc2626"/>
    <text x="80" y="24" class="head" fill="#dc2626">Peer 3 (Timeout)</text>
    <text x="80" y="42" class="code" fill="#6B6B6B">Network Partition</text>
  </g>

  <!-- Bottom Quorum Banner -->
  <g transform="translate(30, 255)">
    <rect x="0" y="0" width="580" height="80" rx="8" ry="8" fill="#FEFEF9" stroke="#E8DFD8" stroke-width="1.5"/>
    <text x="20" y="25" style="font-family:system-ui,sans-serif;font-size:12px;font-weight:700;fill:#563A10;">🛡 Strict Quorum Invariant: votes &gt; N / 2</text>
    <text x="20" y="46" style="font-family:ui-monospace,monospace;font-size:11px;fill:#2D2D2D;">• In 3-node cluster: 2 affirmative votes strictly satisfy quorum (2 > 1.5).</text>
    <text x="20" y="64" style="font-family:ui-monospace,monospace;font-size:11px;fill:#2D2D2D;">• Partitioned minority (1 node) fails closed with timeout error — prevents stale reads.</text>
  </g>
</svg>
