<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-11 desc-11">
  <title id="title-11">S3 Multipart Upload Lifecycle</title>
  <desc id="desc-11">Three-phase S3 multipart upload protocol in momo: Initiate, parallel Part Uploads, and Complete assembly into a single CAS blob.</desc>

  <defs>
    <marker id="arrow-mp" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#F47983"/>
    </marker>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .card { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1.5; rx: 8; ry: 8; }
      .head { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; text-anchor: middle; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6B6B6B; text-anchor: middle; }
      .flow { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow-mp); }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <text x="320" y="32" class="title">S3 Multipart Upload Lifecycle</text>
  <text x="320" y="52" class="subtitle">Concurrent part streaming assembled atomically into an immutable CAS blob</text>

  <!-- Step 1: Initiate -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="165" height="175" class="card" stroke="#563A10"/>
    <text x="82" y="28" class="head" fill="#563A10">1. Initiate</text>
    <text x="82" y="52" class="code" fill="#F47983">POST ?uploads</text>
    <text x="82" y="78" class="sub">• Client starts session</text>
    <text x="82" y="98" class="sub">• Server issues UploadId</text>
    <text x="82" y="118" class="sub">• Session stored in bbolt</text>
    <rect x="15" y="135" width="135" height="26" rx="4" fill="#FEFEF9" stroke="#E0E0E0"/>
    <text x="82" y="152" class="code" fill="#563A10">Returns UploadId</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M195, 155 H235" class="flow"/>

  <!-- Step 2: Upload Parts -->
  <g transform="translate(238, 75)">
    <rect x="0" y="0" width="165" height="175" class="card" stroke="#F47983" stroke-width="2"/>
    <text x="82" y="28" class="head" fill="#F47983">2. Upload Parts</text>
    <text x="82" y="52" class="code" fill="#F47983">PUT ?partNumber=N</text>
    <text x="82" y="78" class="sub">• Parallel client chunks</text>
    <text x="82" y="98" class="sub">• Stream to temp spool</text>
    <text x="82" y="118" class="sub">• Returns part ETag</text>
    <rect x="15" y="135" width="135" height="26" rx="4" fill="rgba(244,121,131,0.12)"/>
    <text x="82" y="152" class="code" fill="#F47983">Parallel Concurrency</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M403, 155 H443" class="flow"/>

  <!-- Step 3: Complete -->
  <g transform="translate(445, 75)">
    <rect x="0" y="0" width="165" height="175" class="card" stroke="#769267" stroke-width="2"/>
    <text x="82" y="28" class="head" fill="#769267">3. Complete</text>
    <text x="82" y="52" class="code" fill="#769267">POST ?uploadId=ID</text>
    <text x="82" y="78" class="sub">• Manifest verification</text>
    <text x="82" y="98" class="sub">• Compute final SHA-256</text>
    <text x="82" y="118" class="sub">• Commit CAS blob</text>
    <rect x="15" y="135" width="135" height="26" rx="4" fill="rgba(118,146,103,0.15)"/>
    <text x="82" y="152" class="code" fill="#769267">Atomic Commit</text>
  </g>

  <!-- Bottom Invariant Banner -->
  <g transform="translate(30, 265)">
    <rect x="0" y="0" width="580" height="70" rx="8" ry="8" fill="#FEFEF9" stroke="#E8DFD8" stroke-width="1.5"/>
    <text x="20" y="24" style="font-family:system-ui,sans-serif;font-size:12px;font-weight:700;fill:#563A10;">🛡 Sentinel Abort Safety</text>
    <text x="20" y="44" style="font-family:ui-monospace,monospace;font-size:11px;fill:#2D2D2D;">AbortMultipartUpload immediately unlinks and cleans up orphaned part temp files.</text>
    <text x="20" y="58" style="font-family:ui-monospace,monospace;font-size:11px;fill:#6B6B6B;">Final object is addressed by full content hash — identical to a single-part upload.</text>
  </g>
</svg>
