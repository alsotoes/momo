<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" role="img" aria-labelledby="repl-title repl-desc">
  <title id="repl-title">Replication Strategies: Chain, Splay, Primary-Splay, None</title>
  <desc id="repl-desc">Four-panel visual showing Momo's replication strategies: None (no copies), Chain (N0→N1→N2), Splay (N0→N1 and N2), Primary-Splay (client→all concurrent). Bottom shows polymorphic controller switching based on CPU/memory.</desc>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="var(--momo)"/>
    </marker>
    <marker id="arrow-quic" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="var(--leaf)"/>
    </marker>
    <marker id="arrow-bidir" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="var(--sakura)"/>
    </marker>
    
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="var(--bark)" flood-opacity="0.15"/>
    </filter>
    
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:var(--diagram-bg)"/>
      <stop offset="100%" style="stop-color:var(--diagram-grid)"/>
    </linearGradient>
    
    <style>
      .node { filter: url(#drop-shadow); transition: transform 0.2s ease; }
      .node:hover { transform: scale(1.05); filter: url(#drop-shadow) brightness(1.15); }
      .panel-title { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700; fill: var(--diagram-text); text-anchor: middle; }
      .panel-desc { font-family: 'Outfit', sans-serif; font-size: 10px; fill: var(--diagram-text-muted); text-anchor: middle; }
      .node-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: var(--diagram-text); text-anchor: middle; }
      .node-role { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--diagram-text-muted); text-anchor: middle; }
      .flow-label { font-family: 'JetBrains Mono', monospace; font-size: 8px; fill: var(--diagram-text-muted); }
      .transport-tcp { fill: var(--bark); }
      .transport-quic { fill: var(--leaf); }
      .legend-text { font-family: 'Outfit', sans-serif; font-size: 10px; fill: var(--diagram-text); }
      .legend-code { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--momo); }
    </style>
  </defs>
  
  <rect width="800" height="550" fill="var(--diagram-bg)"/>
  
  <!-- Main Title -->
  <text x="400" y="30" class="diagram-title" style="font-size:18px;">Replication Strategies & Polymorphic Engine</text>
  <text x="400" y="50" class="diagram-subtitle">Four strategies, one runtime switch — metrics-driven controller adapts to load & network</text>
  
  <!-- PANEL 1: None -->
  <g transform="translate(20, 70)">
    <rect x="0" y="0" width="180" height="200" rx="10" ry="10" fill="var(--diagram-bg)" stroke="var(--diagram-border)" stroke-width="1"/>
    <text x="90" y="25" class="panel-title">NONE</text>
    <text x="90" y="42" class="panel-desc">ReplicationNone (ID 4)</text>
    <text x="90" y="56" class="panel-desc" fill="var(--momo)">No copies — ephemeral/test only</text>
    
    <!-- Single node -->
    <g class="node" transform="translate(90, 110)">
      <circle cx="0" cy="0" r="30" fill="url(#node-grad)" stroke="var(--diagram-border)" stroke-width="1.5"/>
      <text y="-8" class="node-label">Client</text>
      <text y="8" class="node-role">PUT → ACK</text>
    </g>
    <text x="90" y="165" class="flow-label transport-tcp">Transport: N/A (local only)</text>
  </g>
  
  <!-- PANEL 2: Chain -->
  <g transform="translate(210, 70)">
    <rect x="0" y="0" width="180" height="200" rx="10" ry="10" fill="var(--diagram-bg)" stroke="var(--momo)" stroke-width="1.5"/>
    <text x="90" y="25" class="panel-title" fill="var(--momo)">CHAIN</text>
    <text x="90" y="42" class="panel-desc">ReplicationChain (ID 1)</text>
    <text x="90" y="56" class="panel-desc" fill="var(--momo)">N0 → N1 → N2 sequential</text>
    
    <!-- Chain nodes -->
    <g class="node" transform="translate(35, 110)">
      <circle cx="0" cy="0" r="28" fill="url(#node-grad)" stroke="var(--momo)" stroke-width="2"/>
      <text y="-6" class="node-label">N0</text>
      <text y="6" class="node-role">PRIMARY</text>
    </g>
    
    <path d="M65,110 H145" class="diagram-flow" marker-end="url(#arrow)"/>
    <text x="105" y="100" class="flow-label transport-tcp">TCP</text>
    
    <g class="node" transform="translate(175, 110)">
      <circle cx="0" cy="0" r="28" fill="url(#node-grad)" stroke="var(--sakura)" stroke-width="2"/>
      <text y="-6" class="node-label">N1</text>
      <text y="6" class="node-role">REPLICA</text>
    </g>
    
    <path d="M205,110 H285" class="diagram-flow" marker-end="url(#arrow)"/>
    <text x="245" y="100" class="flow-label transport-tcp">TCP</text>
    
    <g class="node" transform="translate(315, 110)">
      <circle cx="0" cy="0" r="28" fill="url(#node-grad)" stroke="var(--peach)" stroke-width="2"/>
      <text y="-6" class="node-label">N2</text>
      <text y="6" class="node-role">REPLICA</text>
    </g>
    
    <text x="90" y="165" class="flow-label transport-tcp">Transport: momo-tcp (LAN)</text>
    <text x="90" y="180" class="panel-desc" fill="var(--momo)">Low latency, ordered writes</text>
  </g>
  
  <!-- PANEL 3: Splay -->
  <g transform="translate(400, 70)">
    <rect x="0" y="0" width="180" height="200" rx="10" ry="10" fill="var(--diagram-bg)" stroke="var(--sakura)" stroke-width="1.5"/>
    <text x="90" y="25" class="panel-title" fill="var(--sakura)">SPLAY</text>
    <text x="90" y="42" class="panel-desc">ReplicationSplay (ID 2)</text>
    <text x="90" y="56" class="panel-desc" fill="var(--sakura)">N0 → N1 AND N2 parallel</text>
    
    <!-- Splay nodes -->
    <g class="node" transform="translate(90, 95)">
      <circle cx="0" cy="0" r="28" fill="url(#node-grad)" stroke="var(--momo)" stroke-width="2"/>
      <text y="-6" class="node-label">N0</text>
      <text y="6" class="node-role">PRIMARY</text>
    </g>
    
    <path d="M90,123 V145" class="diagram-flow" marker-end="url(#arrow)"/>
    <path d="M90,123 V145" class="diagram-flow" marker-end="url(#arrow)" transform="translate(-30,0)"/>
    <path d="M90,123 V145" class="diagram-flow" marker-end="url(#arrow)" transform="translate(30,0)"/>
    
    <g class="node" transform="translate(35, 165)">
      <circle cx="0" cy="0" r="25" fill="url(#node-grad)" stroke="var(--sakura)" stroke-width="2"/>
      <text y="-4" class="node-label" font-size="10px">N1</text>
      <text y="6" class="node-role" font-size="8px">REPLICA</text>
    </g>
    
    <g class="node" transform="translate(145, 165)">
      <circle cx="0" cy="0" r="25" fill="url(#node-grad)" stroke="var(--peach)" stroke-width="2"/>
      <text y="-4" class="node-label" font-size="10px">N2</text>
      <text y="6" class="node-role" font-size="8px">REPLICA</text>
    </g>
    
    <text x="90" y="205" class="flow-label transport-tcp">Transport: momo-tcp (LAN)</text>
    <text x="90" y="220" class="panel-desc" fill="var(--sakura)">Parallel, faster than chain</text>
  </g>
  
  <!-- PANEL 4: Primary-Splay -->
  <g transform="translate(590, 70)">
    <rect x="0" y="0" width="190" height="200" rx="10" ry="10" fill="var(--diagram-bg)" stroke="var(--leaf)" stroke-width="1.5"/>
    <text x="95" y="25" class="panel-title" fill="var(--leaf)">PRIMARY-SPLAY</text>
    <text x="95" y="42" class="panel-desc">ReplicationPrimarySplay (ID 3)</text>
    <text x="95" y="56" class="panel-desc" fill="var(--leaf)">Client → all nodes concurrent</text>
    
    <!-- Primary-Splay nodes -->
    <g class="node" transform="translate(45, 100)">
      <rect x="-30" y="-25" width="60" height="50" rx="6" fill="url(#node-grad)" stroke="var(--cream)" stroke-width="2"/>
      <text y="-5" class="node-label" font-size="10px">Client</text>
      <text y="8" class="node-role" font-size="8px">ORIGINATOR</text>
    </g>
    
    <!-- Three concurrent arrows -->
    <path d="M45,105 L100,80" class="diagram-flow" marker-end="url(#arrow-quic)"/>
    <text x="130" y="85" class="flow-label transport-quic">QUIC</text>
    
    <path d="M45,105 L100,120" class="diagram-flow" marker-end="url(#arrow-quic)"/>
    <text x="130" y="128" class="flow-label transport-quic">QUIC</text>
    
    <path d="M45,105 L100,160" class="diagram-flow" marker-end="url(#arrow-quic)"/>
    <text x="130" y="170" class="flow-label transport-quic">QUIC</text>
    
    <g class="node" transform="translate(160, 60)">
      <circle cx="0" cy="0" r="25" fill="url(#node-grad)" stroke="var(--momo)" stroke-width="2"/>
      <text y="-4" class="node-label" font-size="10px">N0</text>
      <text y="6" class="node-role" font-size="8px">REPLICA</text>
    </g>
    
    <g class="node" transform="translate(160, 120)">
      <circle cx="0" cy="0" r="25" fill="url(#node-grad)" stroke="var(--sakura)" stroke-width="2"/>
      <text y="-4" class="node-label" font-size="10px">N1</text>
      <text y="6" class="node-role" font-size="8px">REPLICA</text>
    </g>
    
    <g class="node" transform="translate(160, 180)">
      <circle cx="0" cy="0" r="25" fill="url(#node-grad)" stroke="var(--peach)" stroke-width="2"/>
      <text y="-4" class="node-label" font-size="10px">N2</text>
      <text y="6" class="node-role" font-size="8px">REPLICA</text>
    </g>
    
    <text x="95" y="215" class="flow-label transport-quic">Transport: momo-quic (WAN/lossy)</text>
    <text x="95" y="230" class="panel-desc" fill="var(--leaf)">0-RTT, no HOL blocking</text>
  </g>
  
  <!-- POLYMORPHIC CONTROLLER SECTION -->
  <g transform="translate(20, 290)">
    <rect x="0" y="0" width="760" height="230" rx="12" ry="12" fill="rgba(244,121,131,0.08)" stroke="var(--momo)" stroke-width="1.5"/>
    <text x="380" y="30" class="panel-title" fill="var(--momo)">⚡ POLYMORPHIC CONTROLLER — Runtime Strategy Selection</text>
    
    <!-- Controller box -->
    <g class="node" transform="translate(380, 60)">
      <rect x="-100" y="-35" width="200" height="70" rx="8" fill="var(--momo)" stroke="var(--momo)" stroke-width="2"/>
      <text y="-12" text-anchor="middle" font-family="Outfit" font-size="13px" font-weight="700" fill="white">POLYMORPHIC CONTROLLER</text>
      <text y="6" text-anchor="middle" font-family="JetBrains Mono" font-size="9px" fill="rgba(255,255,255,0.9)">CPU + Memory → Strategy</text>
      <text y="18" text-anchor="middle" font-family="JetBrains Mono" font-size="8px" fill="rgba(255,255,255,0.7)">Broadcast via control channel</text>
    </g>
    
    <!-- Inputs -->
    <g transform="translate(100, 90)">
      <circle cx="0" cy="0" r="35" fill="var(--diagram-bg)" stroke="var(--sakura)" stroke-width="2"/>
      <text y="-8" text-anchor="middle" class="node-label">CPU</text>
      <text y="6" text-anchor="middle" class="node-role">gopsutil</text>
      <text y="18" text-anchor="middle" class="legend-code">load > 80%</text>
    </g>
    
    <path d="M135,90 H260" class="diagram-flow" marker-end="url(#arrow)"/>
    
    <g transform="translate(460, 90)">
      <circle cx="0" cy="0" r="35" fill="var(--diagram-bg)" stroke="var(--leaf)" stroke-width="2"/>
      <text y="-8" text-anchor="middle" class="node-label">MEM</text>
      <text y="6" text-anchor="middle" class="node-role">gopsutil</text>
      <text y="18" text-anchor="middle" class="legend-code">mem > 75%</text>
    </g>
    
    <!-- Decision logic -->
    <g transform="translate(380, 145)">
      <rect x="-120" y="-25" width="240" height="50" rx="6" fill="var(--diagram-bg)" stroke="var(--diagram-border)"/>
      <text y="-8" text-anchor="middle" class="panel-desc">DECISION LOGIC</text>
      <text y="8" text-anchor="middle" class="legend-code" fill="var(--momo)">if (mem > 75%) → Chain (lowest overhead)</text>
      <text y="20" text-anchor="middle" class="legend-code" fill="var(--sakura)">else if (cpu > 80% || WAN) → Primary-Splay</text>
      <text y="32" text-anchor="middle" class="legend-code" fill="var(--peach)">else → Splay (balanced)</text>
    </g>
    
    <!-- Broadcast output -->
    <path d="M380,200 V220" class="diagram-flow" marker-end="url(#arrow)"/>
    
    <g transform="translate(380, 225)">
      <rect x="-80" y="-15" width="160" height="30" rx="6" fill="var(--sakura)" stroke="var(--sakura)"/>
      <text y="5" text-anchor="middle" font-family="Outfit" font-size="11px" font-weight="600" fill="white">Control Channel Broadcast</text>
    </g>
    
    <!-- Output to all nodes -->
    <g transform="translate(220, 230)">
      <circle cx="0" cy="0" r="20" fill="var(--diagram-bg)" stroke="var(--momo)" stroke-width="1.5"/>
      <text y="3" text-anchor="middle" class="node-label" font-size="9px">N0</text>
    </g>
    <g transform="translate(380, 230)">
      <circle cx="0" cy="0" r="20" fill="var(--diagram-bg)" stroke="var(--sakura)" stroke-width="1.5"/>
      <text y="3" text-anchor="middle" class="node-label" font-size="9px">N1</text>
    </g>
    <g transform="translate(540, 230)">
      <circle cx="0" cy="0" r="20" fill="var(--diagram-bg)" stroke="var(--peach)" stroke-width="1.5"/>
      <text y="3" text-anchor="middle" class="node-label" font-size="9px">N2</text>
    </g>
    
    <path d="M200,230 H140" class="diagram-flow" marker-end="url(#arrow)"/>
    <path d="M360,230 H300" class="diagram-flow" marker-end="url(#arrow)"/>
    <path d="M420,230 H480" class="diagram-flow" marker-end="url(#arrow)"/>
    <path d="M520,230 H580" class="diagram-flow" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Transport sweet spot summary -->
  <g transform="translate(20, 500)">
    <text x="0" y="0" class="panel-title" text-anchor="start" fill="var(--diagram-text)">Transport Sweet Spots:</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="150" height="22" rx="4" fill="rgba(244,121,131,0.15)" stroke="var(--momo)"/>
      <text x="75" y="15" text-anchor="middle" class="legend-code">Chain → LAN, high BW</text>
    </g>
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="150" height="22" rx="4" fill="rgba(252,201,185,0.15)" stroke="var(--sakura)"/>
      <text x="75" y="15" text-anchor="middle" class="legend-code">Splay → LAN, parallel</text>
    </g>
    <g transform="translate(340, 0)">
      <rect x="0" y="0" width="180" height="22" rx="4" fill="rgba(118,146,103,0.15)" stroke="var(--leaf)"/>
      <text x="90" y="15" text-anchor="middle" class="legend-code">Primary-Splay → WAN/lossy, QUIC</text>
    </g>
    <g transform="translate(550, 0)">
      <rect x="0" y="0" width="150" height="22" rx="4" fill="rgba(253,237,173,0.15)" stroke="var(--cream)"/>
      <text x="75" y="15" text-anchor="middle" class="legend-code">None → test/ephemeral</text>
    </g>
  </g>
  
  <!-- Bolt/Sentinel badges -->
  <g transform="translate(620, 15)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="rgba(244,121,131,0.15)" stroke="var(--momo)" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" font-family="JetBrains Mono" font-size="9px" font-weight="700" fill="var(--momo)">⚡ BOLT</text>
  </g>
  <g transform="translate(710, 15)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="rgba(118,146,103,0.15)" stroke="var(--leaf)" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" font-family="JetBrains Mono" font-size="9px" font-weight="700" fill="var(--leaf)">🛡 SENTINEL</text>
  </g>
</svg>