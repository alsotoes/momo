<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-14b desc-14b">
  <title id="title-14b">Tradeoff Analysis: Seams vs Dynamic Plugins</title>
  <desc id="desc-14b">Structured comparison matrix evaluating latency, memory, security, and auditability between seams and plugins.</desc>

  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .table-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #2D2D2D; }
      .table-dim { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #563A10; }
      .table-bad { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #dc2626; }
      .table-good { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #769267; font-weight: 600; }
      .row-line { stroke: #E8DFD8; stroke-width: 1; }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <text x="320" y="32" class="title">Seams vs. Plugins: Tradeoff Matrix</text>
  <text x="320" y="52" class="subtitle">Why in-process compile-time seams outperform dynamic plugin frameworks</text>

  <!-- Table Box -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="580" height="250" rx="8" ry="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>

    <!-- Table Header -->
    <rect x="0" y="0" width="580" height="36" rx="8" fill="#FEFEF9"/>
    <text x="20" y="23" class="table-hdr">DIMENSION</text>
    <text x="180" y="23" class="table-hdr" fill="#dc2626">DYNAMIC RPC PLUGINS</text>
    <text x="380" y="23" class="table-hdr" fill="#769267">COMPILE-TIME SEAMS (MOMO)</text>
    <line x1="0" y1="36" x2="580" y2="36" class="row-line"/>

    <!-- Row 1: Invocation Latency -->
    <text x="20" y="65" class="table-dim">Invocation Latency</text>
    <text x="180" y="65" class="table-bad">150,000 - 500,000 ns (RPC)</text>
    <text x="380" y="65" class="table-good">&lt; 2 ns (Pointer jump)</text>
    <line x1="0" y1="78" x2="580" y2="78" class="row-line"/>

    <!-- Row 2: Memory Copying -->
    <text x="20" y="105" class="table-dim">Memory Copies</text>
    <text x="180" y="105" class="table-bad">Protobuf serialize / heap alloc</text>
    <text x="380" y="105" class="table-good">0 copies (Direct io.Reader)</text>
    <line x1="0" y1="118" x2="580" y2="118" class="row-line"/>

    <!-- Row 3: Security Surface -->
    <text x="20" y="145" class="table-dim">Security Surface</text>
    <text x="180" y="145" class="table-bad">Arbitrary unverified binaries</text>
    <text x="380" y="145" class="table-good">Statically audited &amp; signed</text>
    <line x1="0" y1="158" x2="580" y2="158" class="row-line"/>

    <!-- Row 4: Failure Mode -->
    <text x="20" y="185" class="table-dim">Failure Handling</text>
    <text x="180" y="185" class="table-bad">Socket crash / RPC timeout</text>
    <text x="380" y="185" class="table-good">Typed Go error / fail-closed</text>
    <line x1="0" y1="198" x2="580" y2="198" class="row-line"/>

    <!-- Row 5: Extensibility -->
    <text x="20" y="225" class="table-dim">Configuration</text>
    <text x="180" y="225" class="table-bad">Complex process supervisor</text>
    <text x="380" y="225" class="table-good">Declarative conf/momo.conf</text>
  </g>
</svg>
