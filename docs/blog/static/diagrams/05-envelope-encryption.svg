<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-05 desc-05">
  <title id="title-05">Client-Held E2EE: Envelope Encryption Overview</title>
  <desc id="desc-05">Architecture overview of client-held envelope encryption in momo: client holds Master KEK, server persists only ciphertext and wrapped data keys.</desc>

  <defs>
    <marker id="arrow-flow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#F47983"/>
    </marker>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .box { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1.5; rx: 8; ry: 8; }
      .box-client { fill: #FFFFFF; stroke: #769267; stroke-width: 1.5; rx: 8; ry: 8; }
      .box-server { fill: #FFFFFF; stroke: #563A10; stroke-width: 1.5; rx: 8; ry: 8; }
      .head { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .sub { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #6B6B6B; text-anchor: middle; }
      .line { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow-flow); }
      .pill { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <text x="320" y="32" class="title">Client-Held E2EE: Envelope Encryption</text>
  <text x="320" y="52" class="subtitle">CEK encrypts payload, client KEK wraps CEK — server holds zero plaintext keys</text>

  <!-- Left: Client Trusted Zone -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="250" height="170" class="box-client"/>
    <text x="125" y="26" class="head" fill="#769267">Client (Trusted Boundary)</text>
    <rect x="25" y="42" width="200" height="35" rx="6" fill="#FEFEF9" stroke="#769267"/>
    <text x="125" y="64" class="head" style="font-size:11px;">Master KEK (Client Only)</text>
    
    <rect x="25" y="90" width="200" height="35" rx="6" fill="#FEFEF9" stroke="#F47983"/>
    <text x="125" y="112" class="head" style="font-size:11px;" fill="#F47983">Random CEK (Per-Object)</text>

    <text x="125" y="150" class="sub">AES-256-GCM Streaming</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M280, 130 H355" class="line"/>
  <text x="320" y="122" style="font-family:ui-monospace,monospace;font-size:10px;fill:#F47983;text-anchor:middle;">PUT Stream</text>

  <path d="M355, 180 H280" class="line" stroke="#769267"/>
  <text x="320" y="196" style="font-family:ui-monospace,monospace;font-size:10px;fill:#769267;text-anchor:middle;">GET Stream</text>

  <!-- Right: Server Untrusted Zone -->
  <g transform="translate(360, 75)">
    <rect x="0" y="0" width="250" height="170" class="box-server"/>
    <text x="125" y="26" class="head" fill="#563A10">Server (Storage Backend)</text>
    
    <rect x="25" y="42" width="200" height="35" rx="6" fill="#FEFEF9" stroke="#563A10"/>
    <text x="125" y="64" class="head" style="font-size:11px;" fill="#563A10">Encrypted Blob (CAS)</text>

    <rect x="25" y="90" width="200" height="35" rx="6" fill="#FEFEF9" stroke="#E0E0E0"/>
    <text x="125" y="112" class="head" style="font-size:11px;">Wrapped CEK (Metadata)</text>

    <text x="125" y="150" class="sub">Zero Knowledge of Plaintext</text>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(30, 265)">
    <rect x="0" y="0" width="580" height="70" rx="8" ry="8" fill="#FEFEF9" stroke="#E8DFD8" stroke-width="1.5"/>
    <text x="20" y="24" style="font-family:system-ui,sans-serif;font-size:12px;font-weight:700;fill:#563A10;">Security Invariant</text>
    <text x="20" y="44" style="font-family:system-ui,sans-serif;font-size:11px;fill:#2D2D2D;">• If server storage or bbolt metadata is leaked, attacker obtains only AES-GCM ciphertext.</text>
    <text x="20" y="58" style="font-family:system-ui,sans-serif;font-size:11px;fill:#2D2D2D;">• Losing the client KEK renders ciphertext cryptographically dead — honest fail-closed posture.</text>
  </g>
</svg>
