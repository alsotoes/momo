<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-05b desc-05b">
  <title id="title-05b">Client-Held E2EE: Ingest PUT Flow</title>
  <desc id="desc-05b">Step-by-step cryptographic sequence of an end-to-end encrypted upload in momo.</desc>

  <defs>
    <marker id="arrow-flow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#F47983"/>
    </marker>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .zone-client { fill: #FFFFFF; stroke: #769267; stroke-width: 1.5; rx: 8; ry: 8; }
      .zone-server { fill: #FFFFFF; stroke: #563A10; stroke-width: 1.5; rx: 8; ry: 8; }
      .zone-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .step-rect { fill: #FEFEF9; stroke: #E0E0E0; stroke-width: 1; rx: 6; ry: 6; }
      .step-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #2D2D2D; }
      .step-code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px; fill: #F47983; }
      .flow-line { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow-flow); }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <text x="320" y="30" class="title">E2EE Ingest (PUT) Cryptographic Flow</text>
  <text x="320" y="48" class="subtitle">Client seals data and encrypts key before network transit — server persists only ciphertext</text>

  <!-- Client Zone (Left) -->
  <g transform="translate(30, 65)">
    <rect x="0" y="0" width="265" height="260" class="zone-client"/>
    <text x="132" y="24" class="zone-header" fill="#769267">CLIENT SIDE (Trusted Boundary)</text>

    <!-- Step 1 -->
    <rect x="15" y="40" width="235" height="50" class="step-rect"/>
    <text x="25" y="58" class="step-text">1. Generate Ephemeral CEK</text>
    <text x="25" y="76" class="step-code">CEK = crypto/rand(32 bytes)</text>

    <!-- Step 2 -->
    <rect x="15" y="105" width="235" height="50" class="step-rect"/>
    <text x="25" y="123" class="step-text">2. Stream AES-GCM Encryption</text>
    <text x="25" y="141" class="step-code">Ciphertext = Seal(CEK, Plaintext)</text>

    <!-- Step 3 -->
    <rect x="15" y="170" width="235" height="50" class="step-rect"/>
    <text x="25" y="188" class="step-text">3. Wrap CEK with Master KEK</text>
    <text x="25" y="206" class="step-code">WrappedCEK = Seal(KEK, CEK)</text>

    <text x="132" y="245" style="font-family:system-ui,sans-serif;font-size:10px;fill:#769267;text-anchor:middle;">KEK never leaves this zone</text>
  </g>

  <!-- Network Boundary (Center Arrow) -->
  <path d="M295, 195 H345" class="flow-line"/>
  <text x="320" y="172" style="font-family:ui-monospace,monospace;font-size:10px;fill:#6B6B6B;text-anchor:middle;">PUT Stream</text>
  <text x="320" y="186" style="font-family:ui-monospace,monospace;font-size:10px;fill:#F47983;text-anchor:middle;">+Envelope</text>

  <!-- Server Zone (Right) -->
  <g transform="translate(345, 65)">
    <rect x="0" y="0" width="265" height="260" class="zone-server"/>
    <text x="132" y="24" class="zone-header" fill="#563A10">SERVER SIDE (Untrusted Storage)</text>

    <!-- Step 4 -->
    <rect x="15" y="40" width="235" height="50" class="step-rect"/>
    <text x="25" y="58" class="step-text">4. Ingest Raw Ciphertext</text>
    <text x="25" y="76" class="step-code">Hash = SHA-256(Ciphertext)</text>

    <!-- Step 5 -->
    <rect x="15" y="105" width="235" height="50" class="step-rect"/>
    <text x="25" y="123" class="step-text">5. Store Blob in CAS Store</text>
    <text x="25" y="141" class="step-code">blobs.PutBlob(Hash, stream)</text>

    <!-- Step 6 -->
    <rect x="15" y="170" width="235" height="50" class="step-rect"/>
    <text x="25" y="188" class="step-text">6. Record Wrapped Key in Bbolt</text>
    <text x="25" y="206" class="step-code">bucketS3Meta.Put(name, WrappedCEK)</text>

    <text x="132" y="245" style="font-family:system-ui,sans-serif;font-size:10px;fill:#563A10;text-anchor:middle;">Server holds 0 plaintext keys</text>
  </g>
</svg>
