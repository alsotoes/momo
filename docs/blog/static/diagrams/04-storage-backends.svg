<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-04 desc-04">
  <title id="title-04">Pluggable Storage Backends: Architecture Seam</title>
  <desc id="desc-04">The BlobStore interface seam in momo abstracting local filesystem, NFS shares, remote S3 buckets, and raw block devices.</desc>

  <defs>
    <marker id="arrow-be" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#F47983"/>
    </marker>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .seam-box { fill: #FFFFFF; stroke: #F47983; stroke-width: 2; rx: 8; ry: 8; }
      .be-card { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1.5; rx: 8; ry: 8; }
      .text-head { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .text-code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; text-anchor: middle; }
      .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6B6B6B; text-anchor: middle; }
      .flow-be { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow-be); }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <text x="320" y="32" class="title">Pluggable Storage Backends</text>
  <text x="320" y="52" class="subtitle">Unified BlobStore interface decoupling CAS metadata from physical storage media</text>

  <!-- Central Seam Interface Box -->
  <g transform="translate(180, 75)">
    <rect x="0" y="0" width="280" height="60" class="seam-box"/>
    <text x="140" y="26" class="text-head" fill="#F47983">BlobStore Interface Seam</text>
    <text x="140" y="44" class="text-code" fill="#563A10">PutBlob() | GetBlob() | DeleteBlob()</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M210, 135 L90, 180" class="flow-be"/>
  <path d="M280, 135 L235, 180" class="flow-be"/>
  <path d="M360, 135 L405, 180" class="flow-be"/>
  <path d="M430, 135 L550, 180" class="flow-be"/>

  <!-- 4 Backends -->
  <g transform="translate(30, 185)">
    <rect x="0" y="0" width="130" height="75" class="be-card" stroke="#769267"/>
    <text x="65" y="24" class="text-head" fill="#769267">Local (Default)</text>
    <text x="65" y="42" class="text-sub">Tiered fan-out</text>
    <text x="65" y="60" class="text-code" fill="#563A10">blobs/ab/cd/ef/</text>
  </g>

  <g transform="translate(175, 185)">
    <rect x="0" y="0" width="130" height="75" class="be-card"/>
    <text x="65" y="24" class="text-head">NFS</text>
    <text x="65" y="42" class="text-sub">Shared mount</text>
    <text x="65" y="60" class="text-code">POSIX locks</text>
  </g>

  <g transform="translate(320, 185)">
    <rect x="0" y="0" width="130" height="75" class="be-card"/>
    <text x="65" y="24" class="text-head">Remote S3</text>
    <text x="65" y="42" class="text-sub">Cloud offload</text>
    <text x="65" y="60" class="text-code">SigV4 Client</text>
  </g>

  <g transform="translate(465, 185)">
    <rect x="0" y="0" width="145" height="75" class="be-card"/>
    <text x="72" y="24" class="text-head">Raw Block</text>
    <text x="72" y="42" class="text-sub">Direct NVMe IOPS</text>
    <text x="72" y="60" class="text-code">No page cache</text>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(30, 280)">
    <rect x="0" y="0" width="580" height="55" rx="6" ry="6" fill="#FEFEF9" stroke="#E8DFD8"/>
    <text x="20" y="24" style="font-family:system-ui,sans-serif;font-size:11px;font-weight:600;fill:#563A10;">Rule 74 Seam:</text>
    <text x="110" y="24" style="font-family:system-ui,sans-serif;font-size:11px;fill:#2D2D2D;">Backends are statically compiled in Go — zero dynamic RPC taxes in the data path.</text>
    <text x="20" y="40" style="font-family:system-ui,sans-serif;font-size:11px;fill:#6B6B6B;">Bbolt metadata (namespace, refcounts, tombstones) always stays stored on local disk.</text>
  </g>
</svg>
