<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-09 desc-09">
  <title id="title-09">momofs FUSE Transport Stack</title>
  <desc id="desc-09">Architectural layers of momofs: from user space applications and Linux kernel VFS down to the FUSE bridge and CAS storage core.</desc>

  <defs>
    <marker id="arrow-down" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#F47983"/>
    </marker>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .layer { rx: 8; ry: 8; stroke-width: 1.5; }
      .layer-vfs { fill: #FFFFFF; stroke: #563A10; }
      .layer-fuse { fill: #FFFFFF; stroke: #FFA6A6; }
      .layer-momo { fill: #FFFFFF; stroke: #F47983; stroke-width: 2; }
      .layer-cas { fill: #FFFFFF; stroke: #769267; stroke-width: 2; }
      .layer-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .layer-sub { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #6B6B6B; }
      .flow-arrow { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow-down); }
      .tag { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <!-- Title Header -->
  <text x="320" y="28" class="title">momofs FUSE Transport Stack</text>
  <text x="320" y="46" class="subtitle">Bridging standard Linux POSIX filesystem calls to the immutable CAS store</text>

  <!-- LAYER 1: User Space Apps -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="560" height="46" class="layer layer-vfs"/>
    <text x="20" y="28" class="layer-title" fill="#563A10">1. User Applications</text>
    <text x="260" y="28" class="layer-sub">POSIX Syscalls: open(), read(), write(), stat(), readdir()</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M320, 106 V118" class="flow-arrow"/>

  <!-- LAYER 2: Linux Kernel VFS -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="560" height="46" class="layer layer-fuse"/>
    <text x="20" y="28" class="layer-title" fill="#563A10">2. Linux Kernel VFS</text>
    <text x="260" y="28" class="layer-sub">/dev/fuse character device — translates syscalls to FUSE opcodes</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M320, 166 V178" class="flow-arrow"/>

  <!-- LAYER 3: momofs FUSE Bridge -->
  <g transform="translate(40, 180)">
    <rect x="0" y="0" width="560" height="52" class="layer layer-momo"/>
    <text x="20" y="24" class="layer-title" fill="#F47983">3. momofs FUSE Bridge</text>
    <text x="20" y="42" class="tag" fill="#F47983">src/momofs/fuse.go</text>
    <text x="260" y="24" class="layer-sub">fuseDir: Inode lookup &amp; directory iteration</text>
    <text x="260" y="42" class="layer-sub">fuseFile: Bounded per-handle write buffer → Flush()</text>
  </g>

  <!-- Flow 3 -> 4 -->
  <path d="M320, 232 V244" class="flow-arrow"/>

  <!-- LAYER 4: CAS Storage Core -->
  <g transform="translate(40, 246)">
    <rect x="0" y="0" width="560" height="48" class="layer layer-cas"/>
    <text x="20" y="24" class="layer-title" fill="#769267">4. CAS Storage Core</text>
    <text x="20" y="40" class="tag" fill="#769267">src/storage/</text>
    <text x="260" y="24" class="layer-sub">PutBlob(SHA-256) | Write-whole-file immutability</text>
    <text x="260" y="40" class="layer-sub">Verify-on-read &amp; Bbolt metadata namespaces</text>
  </g>

  <!-- Bottom Invariant Banner -->
  <g transform="translate(40, 304)">
    <rect x="0" y="0" width="560" height="38" rx="6" ry="6" fill="#FEFEF9" stroke="#E8DFD8"/>
    <text x="20" y="24" style="font-family:system-ui,sans-serif;font-size:11px;font-weight:600;fill:#563A10;">Design Invariant:</text>
    <text x="125" y="24" style="font-family:system-ui,sans-serif;font-size:11px;fill:#2D2D2D;">POSIX byte-range writes buffer in memory until Flush() commits the whole CAS blob.</text>
  </g>
</svg>
