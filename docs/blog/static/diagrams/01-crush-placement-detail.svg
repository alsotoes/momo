<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-01d desc-01d">
  <title id="title-01d">CRUSH-lite: Scoring Pipeline Detail</title>
  <desc id="desc-01d">Detailed arithmetic pipeline of the 52-bit digest fold and capacity weight scaling in momo.</desc>

  <defs>
    <marker id="arrow-dtl" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#F47983"/>
    </marker>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .dtl-box { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1.5; rx: 8; ry: 8; }
      .dtl-head { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #563A10; }
      .dtl-code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #F47983; }
      .dtl-comm { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #6B6B6B; }
      .flow-dtl { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow-dtl); }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <text x="320" y="32" class="title">CRUSH-lite: 52-Bit Fold Arithmetic</text>
  <text x="320" y="52" class="subtitle">Extracting 52 bits of cryptographic entropy to prevent IEEE 754 float rounding collisions</text>

  <!-- Left Column: Arithmetic Flow -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="280" height="175" class="dtl-box" stroke="#F47983"/>
    <text x="20" y="26" class="dtl-head" fill="#F47983">Scoring Steps</text>
    
    <text x="20" y="55" class="dtl-code">1. h = SHA-256(key ⊗ node.id)</text>
    <text x="20" y="75" class="dtl-comm">// Combines object key and node</text>

    <text x="20" y="105" class="dtl-code">2. mant = fold52(h)</text>
    <text x="20" y="125" class="dtl-comm">// 32b high + 20b low mantissa</text>

    <text x="20" y="155" class="dtl-code">3. score = mant * node.Weight</text>
  </g>

  <!-- Flow Left -> Right -->
  <path d="M310, 162 H340" class="flow-dtl"/>

  <!-- Right Column: Verification & Stability -->
  <g transform="translate(340, 75)">
    <rect x="0" y="0" width="270" height="175" class="dtl-box" stroke="#769267"/>
    <text x="20" y="26" class="dtl-head" fill="#769267">Selection &amp; Stability</text>
    
    <text x="20" y="55" class="dtl-code">4. sort.SliceStable(scores)</text>
    <text x="20" y="75" class="dtl-comm">// Ties preserve insertion order</text>

    <text x="20" y="105" class="dtl-code">5. filterFailureDomains()</text>
    <text x="20" y="125" class="dtl-comm">// Maximize unique rack/zone</text>

    <text x="20" y="155" class="dtl-code">6. return candidates[:R]</text>
  </g>

  <!-- Bottom Quote Banner -->
  <g transform="translate(30, 265)">
    <rect x="0" y="0" width="580" height="70" rx="8" ry="8" fill="#FEFEF9" stroke="#E8DFD8" stroke-width="1.5"/>
    <text x="20" y="25" style="font-family:system-ui,sans-serif;font-size:12px;font-weight:700;fill:#563A10;">⚡ Bolt Invariant: Stack Allocated Hash Buffers</text>
    <text x="20" y="46" style="font-family:ui-monospace,monospace;font-size:11px;fill:#2D2D2D;">Scoring uses stack idBuf [8]byte and sumBuf [32]byte — 0 heap escapes in hot placement.</text>
    <text x="20" y="62" style="font-family:ui-monospace,monospace;font-size:11px;fill:#6B6B6B;">Guarantees deterministic peer replica consensus in &lt;1.8 microseconds per 100 nodes.</text>
  </g>
</svg>
