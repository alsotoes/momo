<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="crush-score-title crush-score-desc">
  <title id="crush-score-title">CRUSH-lite: Weighted Rendezvous Hashing — Scoring Detail</title>
  <desc id="crush-score-desc">Step 2 Detail: How each candidate node is scored using hash(key ⊗ node.id) × weight, with 52-bit mantissa folding to avoid float64 precision loss</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#F47983"/>
    </marker>
    <marker id="arrow-success" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#769267"/>
    </marker>

    <linearGradient id="grad-hash" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F47983"/>
      <stop offset="100%" stop-color="#FCC9B9"/>
    </linearGradient>
    <linearGradient id="grad-weight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCC9B9"/>
      <stop offset="100%" stop-color="#FFA6A6"/>
    </linearGradient>
    <linearGradient id="grad-result" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#769267"/>
      <stop offset="100%" stop-color="#8AB87A"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#563A10" flood-opacity="0.12"/>
    </filter>

    <style>
      .step-box { filter: url(#shadow); }
      .code-block { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #F47983; }
      .code-comment { font-family: 'JetBrains Mono', monospace; font-size: 8px; fill: #6B6B6B; }
      .label { font-family: 'Outfit', sans-serif; font-size: 10px; font-weight: 600; fill: #2D2D2D; }
      .desc { font-family: 'Outfit', sans-serif; font-size: 9px; fill: #6B6B6B; }
      .title-text { font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: 'Outfit', sans-serif; font-size: 9px; fill: #6B6B6B; text-anchor: middle; }
      .flow-arrow { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
      .step-box { filter: url(#shadow); }
      .label { font-family: 'Outfit', sans-serif; font-size: 10px; font-weight: 600; fill: #2D2D2D; }
    </style>
  </defs>

  <rect width="720" height="380" fill="#FAFAFA"/>

  <text x="360" y="22" class="title-text">Step 2: Weighted Rendezvous Hashing — Scoring</text>
  <text x="360" y="36" class="subtitle">Each candidate scored: hash(key ⊗ node.id) × weight → fold52 → stable sort</text>

  <!-- Input: Object Hash -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="180" height="60" rx="8" ry="8" fill="#FFF0F1" stroke="#F47983" stroke-width="1.5"/>
    <text x="90" y="18" text-anchor="middle" style="font-family:'Outfit',sans-serif;font-size:10px;font-weight:600;fill:#F47983;">INPUT: Object Hash</text>
    <text x="90" y="34" text-anchor="middle" style="font-family:'JetBrains Mono',monospace;font-size:8px;fill:#F47983;">placementKey = SHA-256(blob)</text>
    <text x="90" y="46" text-anchor="middle" style="font-family:'JetBrains Mono',monospace;font-size:7px;fill:#6B6B6B;">32 bytes, already computed</text>
  </g>

  <!-- Arrow down -->
  <path d="M360,115 V140" style="fill:none;stroke:#F47983;stroke-width:2;stroke-linecap:round;marker-end:url(#arrow);"/>

  <!-- Core Algorithm: Hash + Weight -->
  <g transform="translate(50, 150)">
    <!-- Hash Computation -->
    <g class="step-box" transform="translate(0, 0)">
      <rect x="0" y="0" width="210" height="130" rx="8" ry="8" fill="url(#grad-hash)" stroke="#F47983" stroke-width="2"/>
      <text x="105" y="18" text-anchor="middle" style="font-family:'Outfit',sans-serif;font-size:10px;font-weight:600;fill:#F47983;">HASH COMPUTATION</text>
      
      <g transform="translate(15, 30)">
        <text x="0" y="0" style="font-family:'JetBrains Mono',monospace;font-size:8px;fill:#F47983;">hash_input = key ⊗ node.id</text>
        <text x="0" y="16" style="font-family:'JetBrains Mono',monospace;font-size:7px;fill:#6B6B6B;">// XOR: combines content hash with node ID</text>
        <text x="0" y="30" style="font-family:'JetBrains Mono',monospace;font-size:8px;fill:#F47983;">raw = hash(hash_input)</text>
        <text x="0" y="44" style="font-family:'JetBrains Mono',monospace;font-size:7px;fill:#6B6B6B;">// Uniform distribution over [0, 2^64)</text>
        <text x="0" y="58" style="font-family:'JetBrains Mono',monospace;font-size:8px;fill:#F47983;">raw = fold52(raw)</text>
        <text x="0" y="72" style="font-family:'JetBrains Mono',monospace;font-size:7px;fill:#6B6B6B;">// 52-bit mantissa — avoids float64 precision loss (#873)</text>
        <text x="0" y="86" style="font-family:'JetBrains Mono',monospace;font-size:8px;fill:#F47983;">score = raw</text>
      </g>
    </g>

    <!-- Arrow -->
    <path d="M210,80 H230" style="fill:none;stroke:#FCC9B9;stroke-width:2;stroke-linecap:round;marker-end:url(#arrow);"/>

    <!-- Weight Application -->
    <g class="step-box" transform="translate(240, 0)">
      <rect x="0" y="0" width="210" height="130" rx="8" ry="8" fill="url(#grad-weight)" stroke="#FCC9B9" stroke-width="2"/>
      <text x="105" y="18" text-anchor="middle" style="font-family:'Outfit',sans-serif;font-size:10px;font-weight:600;fill:#FCC9B9;">WEIGHT APPLICATION</text>
      
      <g transform="translate(15, 30)">
        <text x="0" y="0" style="font-family:'JetBrains Mono',monospace;font-size:8px;fill:#FCC9B9;">score = raw * node.weight</text>
        <text x="0" y="16" style="font-family:'JetBrains Mono',monospace;font-size:7px;fill:#6B6B6B;">// Weight scales score by node capacity</text>
        <text x="0" y="30" style="font-family:'JetBrains Mono',monospace;font-size:7px;fill:#6B6B6B;">// weight > 1 → more replicas</text>
        <text x="0" y="44" style="font-family:'JetBrains Mono',monospace;font-size:7px;fill:#6B6B6B;">// weight = 0 → excluded</text>
        <text x="0" y="58" style="font-family:'JetBrains Mono',monospace;font-size:8px;fill:#FCC9B9;">final = fold52(score)</text>
        <text x="0" y="72" style="font-family:'JetBrains Mono',monospace;font-size:7px;fill:#6B6B6B;">// 2nd fold52 for consistency</text>
      </g>
    </g>

    <!-- Arrow -->
    <path d="M450,80 H470" style="fill:none;stroke:#FFA6A6;stroke-width:2;stroke-linecap:round;marker-end:url(#arrow);"/>

    <!-- Sort &amp; Output -->
    <g class="step-box" transform="translate(480, 0)">
      <rect x="0" y="0" width="220" height="130" rx="8" ry="8" fill="url(#grad-result)" stroke="#769267" stroke-width="2"/>
      <text x="110" y="18" text-anchor="middle" style="font-family:'Outfit',sans-serif;font-size:10px;font-weight:600;fill:#769267;">SORT &amp; OUTPUT</text>
      
      <g transform="translate(15, 30)">
        <text x="0" y="0" style="font-family:'JetBrains Mono',monospace;font-size:8px;fill:#FFA6A6;">candidates.sort(key=score)</text>
        <text x="0" y="16" style="font-family:'JetBrains Mono',monospace;font-size:7px;fill:#6B6B6B;">// Stable sort — ties never flip (#872)</text>
        <text x="0" y="30" style="font-family:'JetBrains Mono',monospace;font-size:8px;fill:#FFA6A6;">replicas = sorted[:N]</text>
        <text x="0" y="44" style="font-family:'JetBrains Mono',monospace;font-size:7px;fill:#6B6B6B;">// Top-N replicas selected</text>
        <text x="0" y="58" style="font-family:'JetBrains Mono',monospace;font-size:8px;fill:#769267;">filter_failure_domains()</text>
        <text x="0" y="72" style="font-family:'JetBrains Mono',monospace;font-size:7px;fill:#6B6B6B;">// R1: ensure rack/zone/DC diversity</text>
      </g>
    </g>
  </g>

  <!-- Key Insight Box -->
  <g transform="translate(30, 300)">
    <rect x="0" y="0" width="660" height="50" rx="8" ry="8" fill="#FFF0F1" stroke="#F47983" stroke-width="1.5"/>
    <text x="20" y="16" style="font-family:'Outfit',sans-serif;font-size:10px;font-weight:600;fill:#F47983;">⚡ Bolt Insight</text>
    <text x="20" y="32" style="font-family:'Outfit',sans-serif;font-size:8px;fill:#6B6B6B;">Zero-allocation stack buffers; fold52 eliminates float64 drift; stable sort prevents silent replica reordering</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 360)">
    <rect x="0" y="0" width="660" height="28" rx="6" ry="6" fill="#FAFAFA" stroke="#E8DFD8"/>
    <g transform="translate(15, 6)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#F47983"/><text x="16" y="9" style="font-family:'Outfit',sans-serif;font-size:8px;fill:#6B6B6B;">Hash (SHA-256)</text>
    </g>
    <g transform="translate(200, 6)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#FCC9B9"/><text x="16" y="9" class="legend-text">Weight × Score</text>
    </g>
    <g transform="translate(330, 6)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#FFA6A6"/><text x="16" y="9" class="legend-text">Stable Sort</text>
    </g>
    <g transform="translate(470, 6)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#769267"/><text x="16" y="9" class="legend-text">Failure Domain Filter (R1)</text>
    </g>
  </g>

  <!-- Bolt/Sentinel badges -->
  <g transform="translate(580, 8)">
    <rect x="0" y="0" width="65" height="18" rx="9" fill="rgba(244,121,131,0.12)" stroke="#F47983" stroke-width="1"/>
    <text x="32.5" y="12" text-anchor="middle" style="font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:700;fill:#F47983;">⚡ BOLT</text>
  </g>
  <g transform="translate(650, 8)">
    <rect x="0" y="0" width="65" height="18" rx="9" fill="rgba(118,146,103,0.12)" stroke="#769267" stroke-width="1"/>
    <text x="32.5" y="12" text-anchor="middle" style="font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:700;fill:#769267;">🛡 SENTINEL</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#F47983"/>
    </marker>
    <marker id="arrow-success" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#769267"/>
    </marker>

    <linearGradient id="grad-hash" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F47983"/>
      <stop offset="100%" stop-color="#FCC9B9"/>
    </linearGradient>
    <linearGradient id="grad-weight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCC9B9"/>
      <stop offset="100%" stop-color="#FFA6A6"/>
    </linearGradient>
    <linearGradient id="grad-result" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#769267"/>
      <stop offset="100%" stop-color="#8AB87A"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#563A10" flood-opacity="0.12"/>
    </filter>

    <style>
      .step-box { filter: url(#shadow); }
      .code-block { font-family: 'JetBrains Mono', monospace; font-size: 8px; fill: #F47983; }
      .code-comment { font-family: 'JetBrains Mono', monospace; font-size: 7px; fill: #6B6B6B; }
      .label { font-family: 'Outfit', sans-serif; font-size: 10px; font-weight: 600; fill: #2D2D2D; }
      .desc { font-family: 'Outfit', sans-serif; font-size: 9px; fill: #6B6B6B; }
      .title-text { font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: 'Outfit', sans-serif; font-size: 9px; fill: #6B6B6B; text-anchor: middle; }
      .flow-arrow { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
      .step-box { filter: url(#shadow); }
      .label { font-family: 'Outfit', sans-serif; font-size: 10px; font-weight: 600; fill: #2D2D2D; }
    </style>
  </defs>
</svg>