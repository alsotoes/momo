<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-02c desc-02c">
  <title id="title-02c">Polymorphic Engine: Runtime Strategy Controller</title>
  <desc id="desc-02c">How cluster telemetry (CPU, memory, and network quality) drives atomic runtime shifts between replication modes without restarting daemons.</desc>

  <defs>
    <marker id="arrow-ctrl" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#F47983"/>
    </marker>
    <style>
      .bg { fill: #FAFAFA; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6B6B6B; text-anchor: middle; }
      .card { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1.5; rx: 8; ry: 8; }
      .card-active { fill: #FFFFFF; stroke: #F47983; stroke-width: 2; rx: 8; ry: 8; }
      .text-head { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #2D2D2D; text-anchor: middle; }
      .text-code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #F47983; text-anchor: middle; }
      .text-rule { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #2D2D2D; }
      .flow-ctrl { fill: none; stroke: #F47983; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow-ctrl); }
    </style>
  </defs>

  <rect width="640" height="360" class="bg"/>

  <!-- Title -->
  <text x="320" y="30" class="title">Polymorphic Controller: Dynamic Mode Switching</text>
  <text x="320" y="48" class="subtitle">Real-time system telemetry drives atomic cluster-wide replication topology changes</text>

  <!-- Step 1: Telemetry Inputs (Left Column) -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="160" height="150" class="card"/>
    <text x="80" y="24" class="text-head">1. Telemetry Feeds</text>
    
    <rect x="15" y="40" width="130" height="28" rx="4" fill="#FEFEF9" stroke="#E0E0E0"/>
    <text x="80" y="58" class="text-code">CPU Load (%)</text>

    <rect x="15" y="76" width="130" height="28" rx="4" fill="#FEFEF9" stroke="#E0E0E0"/>
    <text x="80" y="94" class="text-code">Memory Pressure</text>

    <rect x="15" y="112" width="130" height="28" rx="4" fill="#FEFEF9" stroke="#E0E0E0"/>
    <text x="80" y="130" class="text-code">Network Drop Rate</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M190, 145 H220" class="flow-ctrl"/>

  <!-- Step 2: Decision Engine (Center Box) -->
  <g transform="translate(225, 70)">
    <rect x="0" y="0" width="220" height="150" class="card-active"/>
    <text x="110" y="24" class="text-head" fill="#F47983">2. Node 0 Decision Engine</text>
    
    <text x="15" y="55" class="text-rule">• if Memory > 75%:</text>
    <text x="30" y="72" class="text-code">Mode 2 (Chain - lowest RAM)</text>

    <text x="15" y="95" class="text-rule">• else if CPU > 80% || WAN:</text>
    <text x="30" y="112" class="text-code">Mode 3 (Primary-Splay)</text>

    <text x="15" y="135" class="text-rule">• default:</text>
    <text x="30" y="148" class="text-code">Mode 1 (Splay - lowest lat)</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M445, 145 H475" class="flow-ctrl"/>

  <!-- Step 3: Cluster Broadcast (Right Column) -->
  <g transform="translate(480, 70)">
    <rect x="0" y="0" width="130" height="150" class="card"/>
    <text x="65" y="24" class="text-head">3. Broadcast</text>
    
    <rect x="15" y="42" width="100" height="26" rx="4" fill="#FFFFFF" stroke="#F47983"/>
    <text x="65" y="59" class="text-head" style="font-size:11px;">Node 0 (Auth)</text>

    <rect x="15" y="78" width="100" height="26" rx="4" fill="#FFFFFF" stroke="#769267"/>
    <text x="65" y="95" class="text-head" style="font-size:11px;">Node 1 (Update)</text>

    <rect x="15" y="114" width="100" height="26" rx="4" fill="#FFFFFF" stroke="#769267"/>
    <text x="65" y="131" class="text-head" style="font-size:11px;">Node 2 (Update)</text>
  </g>

  <!-- Bottom Info Banner -->
  <g transform="translate(30, 240)">
    <rect x="0" y="0" width="580" height="95" rx="8" ry="8" fill="#FEFEF9" stroke="#E8DFD8" stroke-width="1.5"/>
    <text x="20" y="24" class="text-head" style="text-anchor:start; fill:#563A10;">🛡 Safe Transition Invariants (Zero Downtime)</text>
    <text x="20" y="46" class="text-rule">1. Single Source of Truth: Only Node 0 initiates and coordinates mode transitions.</text>
    <text x="20" y="66" class="text-rule">2. Non-Disruptive Handoff: Active streams conclude with their started topology.</text>
    <text x="20" y="86" class="text-rule">3. Atomic Swap: New connections immediately pick up the atomic mode pointer.</text>
  </g>
</svg>
