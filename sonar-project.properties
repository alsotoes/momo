# SonarQube / SonarCloud configuration for Momo (Distributed Object Storage)
sonar.projectKey=alsotoes_momo
sonar.organization=headup
sonar.projectName=momo
sonar.projectVersion=0.0.1
sonar.sources=.

# Exclusions: exclude tests, vendored dependencies, docs, benchmarks, pentest scripts, agent artifacts, and non-code assets
sonar.exclusions=\
  **/vendor/**,\
  **/bin/**,\
  bin/**,\
  **/build/**,\
  **/.cache/**,\
  **/dist/**,\
  **/target/**,\
  **/.idea/**,\
  **/.vscode/**,\
  **/.agents/**,\
  **/.gemini/**,\
  **/.jules/**,\
  **/.kiro/**,\
  **/.cortexkit/**,\
  **/skills-lock.json,\
  **/plan.md,\
  **/body*.txt,\
  docs/**,\
  **/docs/**,\
  openspec/**,\
  **/openspec/**,\
  tools/**,\
  **/tools/**,\
  hooks/**,\
  **/hooks/**,\
  scripts/**,\
  **/scripts/**,\
  .github/**,\
  **/.github/**,\
  tests/**,\
  **/tests/**,\
  pentest/**,\
  **/pentest/**,\
  test_data/**,\
  received_files/**,\
  **/*_test.go,\
  pad_test.go,\
  **/testing.go,\
  **/*.sh,\
  **/*.bash,\
  **/*.py,\
  **/*.js,\
  **/*.png,\
  **/*.jpg,\
  **/*.svg,\
  **/*.parquet,\
  **/*.csv,\
  **/*.md,\
  **/*.yaml,\
  **/*.yml,\
  **/*.json,\
  **/*.sum,\
  **/*lock.json,\
  **/*.lock,\
  Dockerfile,\
  **/Dockerfile,\
  docker-compose*.yml,\
  **/docker-compose*.yml,\
  repomix-output.*,\
  *.repomix.*,\
  LICENSE,\
  Makefile

sonar.test.exclusions=**/*
sonar.coverage.exclusions=\
  **/*_test.go,\
  pad_test.go,\
  **/testing.go,\
  tests/**,\
  pentest/**,\
  tools/**,\
  hooks/**,\
  docs/**,\
  .github/**,\
  vendor/**

# Go test coverage
sonar.go.coverage.reportPaths=coverage.out

# Encoding
sonar.sourceEncoding=UTF-8
