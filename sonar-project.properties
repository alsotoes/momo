# SonarQube / SonarCloud configuration for Momo (Distributed Object Storage)
sonar.projectKey=alsotoes_momo
sonar.organization=headup
sonar.projectName=momo
sonar.projectVersion=0.0.1

# Source files: include ONLY src files
sonar.sources=src

# Exclusions: exclude vendor, test files, and checksums
sonar.exclusions=\
  vendor/**,\
  **/vendor/**,\
  **/*_test.go,\
  **/testing.go,\
  **/*.sum

sonar.test.exclusions=**/*
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/testing.go

# Go test coverage
sonar.go.coverage.reportPaths=coverage.out

# Encoding
sonar.sourceEncoding=UTF-8
