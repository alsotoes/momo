# SonarQube / SonarCloud configuration for Momo (Distributed Object Storage)
sonar.host.url=https://sonarcloud.io
sonar.projectKey=alsotoes_momo
sonar.organization=headup
sonar.projectName=momo
sonar.projectVersion=0.0.1

# Source files: include ONLY src files
sonar.sources=src

# Exclusions: exclude vendor, test files, checksums, and git submodules
sonar.exclusions=\
  vendor/**,\
  **/vendor/**,\
  **/*_test.go,\
  **/testing.go,\
  **/*.sum,\
  docs/blog/themes/**,\
  **/themes/**,\
  **/.gitmodules,\
  **/.git/**,\
  **/submodules/**

sonar.test.exclusions=**/*
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/testing.go

# SCM and submodules
sonar.scm.exclusions.disabled=false

# Go test coverage
sonar.go.coverage.reportPaths=coverage.out

# Encoding
sonar.sourceEncoding=UTF-8
