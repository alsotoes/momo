schema: spec-driven
context: |
  # Project Context

  ## Purpose
  Momo is a high-performance, distributed **Object Storage system** written in Go. It demonstrates several replication strategies (None, Chain, Splay, Primary-Splay) and a simple, metrics‑driven controller that can dynamically switch strategies at runtime (a "polymorphic" system).

  ## Tech Stack
  - Go (1.20+)
  - Configuration: `gopkg.in/ini.v1`
  - System Metrics: `github.com/shirou/gopsutil/v3`
  - Testing: Go standard `testing` package, `go.uber.org/goleak` for concurrency safety.
  - E2E & Containerization: Docker, Docker Compose
  - CI/CD: GitHub Actions (build, test, benchmark, smoke test, auto reviewer)

  ## Project Conventions

  ### Code Style
  - Idiomatic Go conventions.
  - Use `context.Context` for managing graceful shutdown and timeouts across network sockets and goroutines.
  - Use `go fmt`, `go vet`, and standard linters. All code must pass `make test` before pushing.
  - Avoid global state mutations outside of initialization unless strictly synchronized.

  ### Architecture Patterns
  - **TCP & QUIC Daemons:** Nodes act as independent Daemons assigned an ID (0, 1, 2). Node 0 is typically the primary and metrics authority. Daemons listen on both standard TCP and UDP (QUIC) ports simultaneously.
  - **Polymorphic System:** The system monitors CPU/Memory and dynamically adjusts the replication tier across the cluster by broadcasting JSON payloads via a dedicated TCP port.
  - **Replication Strategies:**
    - `ReplicationNone` (4): No replication. (TCP)
    - `ReplicationChain` (1): Node 0 -> Node 1 -> Node 2. (TCP for high-bandwidth LAN)
    - `ReplicationSplay` (2): Node 0 -> Node 1 and Node 2. (TCP for high-bandwidth LAN)
    - `ReplicationPrimarySplay` (3): Client -> Node 0, Node 1, Node 2 concurrently. (QUIC for lossy/WAN networks to prevent Head-of-Line blocking and provide 0-RTT/Connection Migration).

  ### Testing Strategy
  - **Unit Testing:** Table-driven tests heavily preferred. Functions must be isolated, using mocks (like `net.Pipe` or dummy TCP listeners) for network boundaries.
  - **Concurrency Safety:** ALL tests spawning network handlers or goroutines must use `defer goleak.VerifyNone(t)` and `go test -race`.
  - **Load Testing:** `Benchmark*` functions are required to stress-test primary daemon endpoints under high concurrent file uploads.
  - **End-to-End (E2E):** Docker Compose scripts (`.github/scripts/test-e2e.sh`) boot up isolated networks to physically verify byte chunks successfully transfer to sibling volumes.

  ### Git Workflow
  - **Branch-Based Development:** Each new specification implementation MUST be developed in a dedicated feature branch.
  - **Pull Requests:** Upon completion of a feature or fix, a Pull Request (PR) to the `master` branch must be created for review and validation. Direct commits to `master` are only permitted for trivial documentation fixes or small configuration adjustments.
  - `auto_reviewer.yml` auto-assigns the lead maintainer (`alsotoes`).
  - CI/CD verifies Unit, Race, Benchmark, E2E, and Code Coverage before merging.

  ## Domain Context
  - **Protocol:** Handshakes start with a fixed 19-byte timestamp, followed by a replication mode code, and then file metadata (MD5, padded filename, padded filesize). The payload streams in 1024-byte chunks.
  - **Timestamps:** To prevent race conditions in replication shifts, nodes use Unix Nanoseconds to evaluate if a client request's timestamp supersedes an old replication setting.

  ## Important Constraints
  - **Security:** There is no authentication or TLS currently built into Momo. It operates entirely over plain TCP.
  - **Error Handling:** Daemons invoke `os.Exit(1)` on fatal boot issues (e.g. port taken), but client connection handling failures must simply terminate the local goroutine, closing the `net.Conn`.
  - **Metadata Limits:** File metadata relies on strictly padded string limits (e.g., 64 bytes for names).

  ## External Dependencies
  - `gopsutil` requires native host OS file structures (like `/proc`) for memory/CPU reading, heavily factoring into how the `metrics` package is tested (which avoids pure mocking for system reads when possible).

  ## Project Steering Rules
  When analyzing or suggesting code generation, agents must adhere to the following steering rules:
  1. **Preserve Simplicity:** Momo is a minimalistic playground. Avoid over-engineering or introducing heavy external frameworks (like gRPC or complex ORMs) unless explicitly requested.
  2. **Decentralized Primary:** Momo utilizes a **Balanced Primary** model enabled by the CRUSH-lite algorithm. Any node in the cluster can act as the primary for a specific object based on its content hash. Do not build logic that assumes a single fixed coordinator or entry point.
  3. **Branching Mandate:** All significant features or spec-driven changes MUST originate from a feature branch and be merged via a validated PR to the `master` branch.
  4. **Zero-Crash Pattern:** (Mandatory) All code must follow defensive stability standards. Never assume external data is well-formed. Every goroutine MUST implement panic recovery. Use bounded readers and fixed-size buffers to prevent resource exhaustion.
  5. **Rigorous Validation:** ALL functional additions MUST include corresponding unit/integration tests. You must assert concurrency safety (`goleak.VerifyNone(t)`) and context cancellations when modifying network layers.
  6. **Dynamic Hot-Swapping:** A core feature of Momo is the ability to change replication schemes *on the fly* by communicating with the daemons. The daemons must never require a restart to adopt a new replication mode. This is achieved by timestamping configuration changes: existing goroutines/connections finish their work using the "Old" configuration, while new client connections or internal threads adopt the "New" configuration based on the latest global timestamp. Always preserve and test this dynamic behavioral shifting.
  7. **Protocol Stability:** The TCP handshaking metadata relies entirely on strict byte boundaries (`19`, `32`, `64` bytes padding). Do not alter or break these payload sizes without extensive refactoring and migration planning.
  8. **Go Version Consistency:** All configuration files defining the Go language version (e.g., `go.mod`, GitHub Actions `setup-go` steps, `Dockerfile`, `dev.nix`, etc.) MUST be strictly synchronized. Any spec or code change that bumps the Go version must validate and update every occurrence across the entire repository to prevent build fragmentation or drift.
  9. **No Silent Failures:** Return explicit errors for network failures. Do not swallow errors in goroutines; use `log.Printf` to emit failures for traceability.
  10. **POSIX Error Mapping:** All application-level errors (e.g., authentication failures, hash mismatches) MUST be mapped to standard `syscall` POSIX constants (e.g., `syscall.EACCES`, `syscall.EBADMSG`) to ensure consistent, standard error propagation across the cluster. This follows the standardized pattern established in [PR #97](https://github.com/alsotoes/momo/pull/97).
  11. **Issue-Spec Traceability:** (Mandatory) ALL project specifications (`openspec/`) MUST be mirrored as GitHub Issues, and every spec file MUST explicitly link to its corresponding GitHub Issue URL at the very top of the file. To ensure formal GitHub linkage and automated issue closure, the Pull Request description MUST include the **`Resolves #ISSUE_ID`** keyword. This ensures synchronization parity and end-to-end traceability for all feature designs and architectural shifts.
  12. **Object Storage Paradigm:** Momo is a distributed Object Storage system. All storage operations MUST be content-addressable and use algorithmic placement (specifically a Go implementation of **Sage Weil's CRUSH algorithm**) to ensure perfect load balancing and infinite scalability without central registry bottlenecks.
  13. **PR Success Criteria (All-Green Rule):** A Pull Request is only considered "Merge Ready" when:
      - The Gemini AI Reviewer provides a `✅` approval.
      - ALL GitHub Action status checks (Build, Test, Race, Goleak, Lint) are green.
      - Once satisfied, the AI Reviewer is authorized to perform an automated merge.
  14. **AI-to-AI Collaboration & Loop Prevention:** Automated maintenance agents (e.g., Jules) can automatically fix issues identified by the AI Reviewer. To prevent infinite loops, a **3-push circuit breaker** is enforced. If an agent fails to resolve all issues within 3 attempts, manual intervention by @alsotoes is mandatory.
  15. **Token Efficiency & Filtering:** ALL AI-driven audits (Reviewer, Jules, etc.) MUST filter out non-essential files (`vendor/`, `go.sum`, binary blobs) from their context. Diffs larger than **1,000 lines** MUST be truncated with a warning to prevent token exhaustion.
  16. **Human-in-the-Loop Trigger:** Destructive operations (e.g., `git push --force`, `rm -rf` in production directories, or `gh pr close`) MUST NEVER be initiated by the AI loop without an explicit instruction from **@alsotoes** or a 3-attempt failure signal.
  17. **Atomic AI Tasks:** Automated agents (Jules) MUST work on **one specific issue at a time**. Multi-issue "batch fixes" are prohibited to prevent large, unmanageable diffs and overlapping logical conflicts.
  18. **Circuit Breaker Persistence:** The **3-push circuit breaker** (Rule 14) applies across all AI entities. If a collective AI effort (Reviewer + Jules) cannot reach an "All-Green" state in 3 iterations, the automated pipeline MUST lock the PR and tag the maintainer.
  19. **Resource-Aware Hashing:** When validating data integrity, AI agents MUST prioritize **TeeReader** and stack-allocated buffers (Bolt Pattern) to ensure that automated security checks do not become performance bottlenecks.
  20. **Autonomous Traceability:** The Gemini AI Reviewer is authorized to autonomously resolve Rule 11 (Traceability) violations. If a Pull Request lacks a corresponding GitHub Issue, the Reviewer MUST first check GitHub (e.g., using `gh issue list --state open --search "PR_TITLE"`) or parse the PR description to verify if a tracking issue has already been opened. Creating duplicate tracking issues is strictly prohibited; the agent MUST reuse the existing tracking issue or link if one already exists.
  21. **PR Synchronization Update**: After completing development or refactoring on a PR branch, the AI agent MUST update the pull request description on GitHub with a detailed summary of the changes made, resolved audits, and optimizations *before* pushing the code to the remote repository. This ensures that the automated AI Reviewer bot, once triggered by the push, evaluates the work with full, updated context.
  22. **Detailed Resolution Comments**: Upon completing work or making corrections on a PR or an Issue, the AI agent MUST post a detailed summary comment on the Pull Request and/or the associated Issue explaining the findings, the specific architectural fixes applied, and the verification status (including test and benchmark results). This ensures full visibility, traceability, and asynchronous context alignment for all human reviewers and collaborators working on the project.
  23. **Stale Branch Re-Alignment**: Prior to resolving audits or applying modifications on a PR branch, the AI agent MUST verify alignment with the latest `master`. If the branch contains stale directory structures or package moves, the agent MUST reset the branch to the head of `master` and cleanly port/re-apply only the functional PR optimizations. Direct merges of structural re-organizations are prohibited to prevent codebase layout regressions.
  24. **Bounded Network Loops**: All loops parsing network stream sockets character-by-character or reading chunked data MUST have a hard-coded maximum iteration limit (e.g., at most 10 iterations for a node ID) alongside standard deadlines. Infinite read loops are strictly prohibited to prevent malicious peers from triggering CPU exhaustion and thread starvation.
  25. **Workspace Vendoring Parity**: Whenever dependencies are added, updated, or removed in any sub-module of a multi-module workspace, the AI agent MUST immediately run workspace synchronization and vendoring commands (e.g., `go work sync` and `go work vendor`) to guarantee local vendoring parity and prevent pipeline toolchain collisions.
  26. **Code Formatting**: The AI agent MUST format all Go files using `go fmt ./...` and ensure no unused imports remain before pushing code to avoid CI pipeline failures.
  27. **Documentation-to-Code Parity**: To prevent documentation drift and critical inconsistencies, any Pull Request or commit that modifies system-wide constants, protocol enums, or configuration schemas MUST simultaneously update all corresponding reference manuals, architecture guides, and diagrams in the `docs/` directory and the root `README.md`.
  28. **AI Collaborative Alignment**: To prevent destructive AI-to-AI modification loops or accidental reverts of functional code, whenever an AI agent collaborates on a PR branch that has divergent remote history, the agent MUST first pull the latest remote ref and surgically resolve conflicts, preserving functional optimizations unless explicitly instructed to revert.
  29. **Scanner-Safe Test Secrets**: To prevent third-party security scanners (e.g., Gitleaks, GitGuardian, TruffleHog) from triggering false-positive alerts on test credentials, all dummy API keys, auth tokens, or private keys committed to configuration files or test suites MUST be explicitly annotated with a trailing comment indicating they are fake (e.g., `// notsecret` or `# notsecret`).
  30. **Repository Branch Hygiene**: To maintain a clean and lightweight repository structure, any local or remote-tracking branch associated with an already merged or closed Pull Request MUST be promptly deleted from the local workspace and the remote origin. Active development branches must strictly correspond to an open tracking issue or Pull Request.
  31. **Superseded PR Issue Resolution**: When a Pull Request is closed as superseded or obsolete (e.g., because its functional optimizations have already been merged through a different branch or commit), the AI agent MUST locate all connected tracking issues on GitHub and manually close them with a descriptive closing comment referencing the actual merging PR/commit. Leaving connected issues open on closed/superseded PRs is prohibited to prevent project tracking contamination.
  32. **Defensive Allocation Bounds**: To maintain the Zero-Crash Pattern, any code path allocating memory slices or maps dynamically using input parameters (e.g., `make([]T, count)`) MUST explicitly validate the allocation size beforehand. Slices must never be created with negative or unvalidated lengths, and map allocations must never accept unbounded or unverified capacities from external inputs.
  33. **Protocol Feature Parity**: (Mandatory) All functional features, storage capabilities, or cluster-wide actions implemented in the project MUST work consistently and natively across all supported wire protocols (`momo-tcp`, `momo-quic`, `s3-tcp`, `s3-quic`). Implementing features that are protocol-restricted or exclusive is strictly prohibited, ensuring that Momo's client gateways remain fully functional regardless of the configured transport layer. This ensures absolute transport independence and consistent distributed semantics.
  34. **Benchmark Log Prevention**: All micro-benchmarks and benchmark configuration sets MUST explicitly provide complete, valid configuration parameters and input data schemas. Writing warnings or synchronous logs (e.g., `log.Printf`) inside hot benchmark loops is strictly prohibited, as system I/O writes trigger severe artificial performance degradations and skew CI benchmark regressions.
  35. **Safe Manual Serialization**: When manually building structured XML, JSON, or CSV serialization payloads using string builders or pre-allocated byte buffers, all dynamic metadata fields MUST be validated against their maximum size limits (e.g., 64 bytes for Names/Hashes) prior to buffer insertion. This defends against memory exhaustion (Large Buffer Attacks) and ensures that corrupted database entries are gracefully filtered and logged without bloating the memory footprint.
  36. **Strict Git Tracking & Binary Prohibition**: To maintain repository hygiene and prevent tracking bloat, committed compiled binary executables (such as the `momo` executable), transient execution logs, or private developer text notes (such as `body*.txt`) are strictly prohibited from being tracked or staged in Git. All binary outputs, temp logs, and local text artifacts MUST be explicitly excluded in the `.gitignore` file.
  37. **Unified Observable Panic Recovery**: To prevent silent failures and ensure consistent distributed observability, all crash-safety `defer recover()` blocks across all transport and library methods MUST employ a strict two-line recovery pattern. They must both: 1) explicitly log the panic warning via `log.Printf` to Stderr, and 2) format and assign the error wrapping a standard POSIX `syscall` constant (such as `syscall.EIO` or `syscall.EBADMSG`) to the named return parameter to cleanly notify the caller.
  38. **Decoupled Wire Handshake Namespaces**: In wire protocols and network handshakes, transaction strategy modes (such as replication levels) and query-based actions (such as List, Delete, or Get) MUST be kept in completely disjoint, decoupled character namespaces. Concurrently or sequentially parsed action codes MUST use alphabetical ASCII bytes (such as `'L'`, `'D'`, `'G'`) instead of contiguous numeric integers to prevent mathematical state-change overflows, avoid collision bugs, and guarantee safe future protocol extensions.
  39. **Single Source of Truth for Steering Rules**: To prevent documentation drift and critical architectural inconsistencies, all project steering rules and engineering standards MUST be defined in exactly **one** primary file: `openspec/config.yaml`. Sibling documentation files (such as `.gemini/GEMINI.md`) MUST NOT replicate or copy the list of rules verbatim. Instead, they MUST explicitly reference `openspec/config.yaml` under the `context` block as the sole, absolute source of truth for steering rules, ensuring that any new rules are codified in exactly one place.
  40. **Ephemeral Port Binding in Tests**: To prevent socket resource conflicts, port collisions, and intermittent pipeline failures during concurrent integration test runs, all transport-layer or server-layer unit and integration tests MUST dynamically bind to random, ephemeral ports (using `127.0.0.1:0`) rather than hardcoded port numbers. Tests must retrieve and use the resolved address (`l.Addr().String()`) programmatically to establish client-server communication.
  41. **Region-Aware WAN Topologies**: All distributed background communications (such as Gossip liveness) and query mechanisms (such as Scatter-Gather listing) MUST be region-aware. Cross-datacenter WAN traffic MUST be throttled, batched, or channeled through designated regional gateway representatives. Query scattering MUST be scoped to the target CRUSH placement group rather than broadcast globally, guaranteeing low tail-latencies and minimal WAN bandwidth consumption.
  42. **Dynamic Network Error Mapping**: To prevent error masking and maintain POSIX compliance, all low-level network dial or connection failures must be dynamically mapped to their corresponding `syscall` POSIX constants (e.g., `syscall.ETIMEDOUT` for connection/handshake timeouts, `syscall.ECONNREFUSED` for socket connection refusals, and `syscall.EHOSTUNREACH` for routing failures) rather than defaulting to generic placeholders.
  43. **Panic-Safe Resource Releasing**: To prevent connection and socket resource leaks, any crash-safety `defer recover()` block inside a connection-wrapping helper or method must explicitly release and close the underlying socket/channel resource (e.g., `c.Conn.Close()`) upon recovering a panic, ensuring that panicking connections do not remain open in a zombie state.
  44. **Append-Only Knowledge Files**: The learning files `.jules/bolt.md` and `.jules/sentinel.md` are cumulative knowledge bases that record the project's performance and security learnings over time. AI agents MUST only append new entries to the end of these files. Overwriting, replacing, truncating, or deleting existing entries is strictly prohibited. When a merge conflict occurs in these files, the agent MUST combine all entries from both versions, preserving the full historical record.
  45. **Planning Artifact Exclusion**: Transient planning artifacts (`plan.md`, `skills-lock.json`, `skills/`, `body*.txt`) are temporary working files generated by AI agents during task execution. These files MUST NOT be committed to the repository, included in Pull Requests, or tracked in Git. They MUST be removed from the working tree before creating a PR or excluded via `.gitignore`. If a merge introduces these files, the agent MUST delete them before pushing.
  46. **Pipeline File Immunity**: Automated maintenance agents (e.g., Jules) MUST NOT modify CI/CD pipeline files (`.github/workflows/*.yml`), reviewer scripts (`.github/scripts/*.py`), or other infrastructure configuration files unless the PR is explicitly tasked with fixing the pipeline. These files are infrastructure, not application code. Automated "fixes" to infrastructure files are destructive and have repeatedly caused regressions (e.g., bot identity loss, issue assignment failure). Only manual intervention by @alsotoes or a dedicated pipeline-fix PR may modify these files.
  47. **No Master File Deletion**: AI agents MUST NOT delete files that exist on the target branch (`master`) unless explicitly tasked with removing them. Before pushing, the agent MUST verify that no files from master have been deleted in the working tree. If a merge or automated action results in file deletions from master (e.g., modify/delete conflicts resolved as delete), the agent MUST restore those files from master before pushing. This prevents catastrophic loss of test files, source files, and configuration.
  48. **Bot Review Identity Integrity**: The Gemini AI Reviewer MUST post reviews using `secrets.GITHUB_TOKEN` (the bot token) to maintain the `github-actions[bot]` identity. Personal Access Tokens (PAT) may only be used for issue and PR management operations (creating issues, assigning labels, editing PR bodies). The review posting command MUST use a separate `BOT_TOKEN` environment variable distinct from the `GITHUB_TOKEN` used by the reviewer script. Using a PAT for review posting causes the review to appear under the personal account, breaking the bot-reviewer contract and the automated merge protocol (Rule 13).
  49. **Autonomous Issue Assignment**: All autonomously created tracking issues (via Rule 20) MUST be assigned to the project maintainer (`alsotoes`) and labeled with both the appropriate category label (`enhancement` or `bug`) and the `automation` label at creation time. Issues created without an assignee or without the `automation` label are considered orphaned and require manual remediation. The `gh issue create` command MUST include `--assignee alsotoes --label automation` alongside any other labels.
  50. **Pre-Push Master Sync**: Before pushing to any PR branch, AI agents MUST merge the latest `origin/master` into the branch and resolve all conflicts. Auto-generated files (`.github/data/benchmark_history.csv`, `docs/PERFORMANCE.md`) MUST be resolved by taking the master version (`--theirs`) since they are regenerated by pre-commit hooks. After merging, the agent MUST verify the final `git diff origin/master` contains only intended changes and no re-introduction of code already on master. Pushing without syncing to master causes avoidable merge conflicts and CI failures.
  51. **Bug-Fix PR Assignment**: After creating a PR for a bug fix, the AI agent MUST immediately assign it to the project maintainer (`alsotoes`) using `gh pr edit <PR_NUMBER> --add-assignee alsotoes`. This is mandatory for all bug-fix PRs without exception.
  52. **Bug-Fix PR Labeling**: After creating a PR for a bug fix, the AI agent MUST immediately add the `bug` label using `gh pr edit <PR_NUMBER> --add-label bug`. This is mandatory for all bug-fix PRs without exception.
  53. **Post-Push PR Comment**: After every `git push` to a PR branch, the AI agent MUST post a visible comment on the PR using `gh pr comment <PR_NUMBER> --body "..."` explaining what changed in that commit, why the changes were made, and what reviewer findings were addressed (if any). This is IN ADDITION to updating the PR body. The comment ensures the reviewer and collaborators have full visibility of changes in the PR conversation timeline. Silent pushes without a corresponding PR comment are prohibited.
  54. **Post-Push PR Body Update**: After every `git push` to a PR branch, the AI agent MUST update the PR body with a new changelog entry (commit hash, description, what changed and why). The PR body must always contain: (1) `Fixes #<issue_number>` link, (2) bug description, (3) fix explanation, (4) **Changelog** section with one entry per commit, (5) reviewer status section, (6) testing section.
  55. **All-Green Merge Gate**: Do NOT merge a PR until ALL GitHub Action checks pass (including `benchstat`) AND the Gemini reviewer's latest review contains `✅`. Use `gh pr checks <PR_NUMBER>` to confirm every check shows `pass` (none `pending`, none `fail`). Use `gh pr view <PR_NUMBER> --json reviews` to read the reviewer's latest review. Before merging, the agent MUST verify `git diff master...HEAD --name-only` (three-dot diff) contains ONLY the PR's intended files; any unexpected deletion or alteration of a master file (e.g., a rogue parallel-agent commit, per Rule 66) MUST be investigated and reverted before the merge proceeds. Note that `gh pr checks` may report a check (e.g., `benchstat`) as `pending` with a frozen `updatedAt` while the underlying job is actually `completed`; cross-check via `gh api repos/<owner>/<repo>/actions/runs/<run-id>/jobs` before extended waiting.
  56. **Post-Merge Issue Closure**: After merging a bug-fix PR, the AI agent MUST immediately close the linked GitHub issue using `gh issue close <ISSUE_NUMBER>`.
  57. **Post-Merge Master Return**: After merging a PR, the AI agent MUST checkout master and pull the latest changes using `git checkout master && git pull` before starting the next bug fix.
  58. **Pre-Push Branch Validation**: Before any `git push`, the AI agent MUST verify it is on the correct branch using `git branch --show-current`. The branch name MUST match the expected feature/fix branch. Never assume the current branch is correct — the workspace may have been modified by other tools (Gemini, Jules, etc.) between operations. If the branch doesn't match, stop and re-checkout the correct branch before pushing. Pushing to the wrong branch (especially `master`) is a critical error.
  59. **No-Assumption Doubt Protocol (AIFS)**: When working autonomously ("Flying Solo"), if the AI agent encounters something it does not know or does not understand, it MUST stop work immediately, create a GitHub issue with the title prefix `[AIFS]` (AI Flying Solo), link it to the PR to block further work on the PR until the issue is resolved by a human, and wait for input. Never make assumptions about codebase state, configuration, or intent when unclear. The project works with many other tools and things can change between operations. The `[AIFS]` issue MUST be labeled with `bug` and `automation` and assigned to `alsotoes`.
  60. **Flying Solo Documentation**: All AI agents working autonomously MUST follow the workflow documented in `docs/AI_FLYING_SOLO.md`. This file is the comprehensive guide for autonomous bug-fix cycles, including pre-flight checks, branch validation, PR workflow, reviewer interaction, the AIFS doubt protocol, and post-merge cleanup.
  61. **Clean Rebase via Cherry-Pick**: When rebasing an external PR branch onto `master`, the agent MUST NOT rebase in-place and force-push directly. The pre-commit hook (which regenerates `docs/PERFORMANCE.md` and `.github/data/benchmark_history.csv`) can create a spurious second commit that reverts unrelated files from master, causing massive diff inflation and false reviewer violations. Instead, the agent MUST: (1) create a fresh branch from `master`, (2) `git cherry-pick --no-commit <original_commit>`, (3) verify `git diff --cached --stat` contains only intended files, (4) commit and force-push the fresh branch. After force-pushing, the agent MUST verify `gh pr diff <PR_NUMBER> --name-only` contains only expected files before waiting for CI.
  62. **Stale Reviewer Re-trigger**: After force-pushing a corrected branch, the agent MUST check the Gemini reviewer's latest review. If the review references files NOT present in `git diff master...HEAD --name-only` (three-dot diff — the PR's own commits relative to the shared merge-base), the review is stale (from a previous bad commit). Do NOT use two-dot `gh pr diff --name-only` here: after Rule 50 merges `master` into an external PR branch, two-dot diff inflates to include all merged master files as if PR-authored, causing both false staleness verdicts and spurious Rule 47/73 findings. The agent MUST push an empty commit (`git commit --allow-empty -m "Trigger re-review after clean rebase"`) to force a fresh review run. The agent MUST NOT attempt to merge based on a stale review, even if it contains `✅`.
  63. **Post-Merge Branch Cleanup**: After merging a PR, the agent MUST delete the remote branch using `gh pr merge --delete-branch` or `git push origin --delete <branch>`. The agent MUST also delete the local branch with `git branch -D <branch>`. Periodically (at least once per autonomous session), the agent MUST audit remote branches with `git branch -r`, cross-reference against `gh pr list --state open`, and delete any branch that: (a) has no open PR, (b) is behind `master` (`git rev-list --count origin/<branch>..origin/master` > 0), and (c) is not `master` or a deliberately preserved feature branch.
  64. **Pre-Existing CI Failure Diagnosis**: When a CI check fails on a PR, the agent MUST first determine whether the same failure exists on `master` (pre-existing) by checking out master and reproducing the failure. If pre-existing and unrelated to the PR's changes, the agent MUST fix the root cause as part of the PR (or a separate dedicated PR) rather than blocking the PR indefinitely. The agent MUST document the diagnosis in a PR comment with evidence (e.g., the master commit SHA where the failure also occurs). Blocking a PR on unrelated pre-existing failures is prohibited.
  65. **Skill Asset Build Isolation**: All Go files under `agent/skills/*/assets/examples/` (or similar skill reference directories) MUST include a `//go:build ignore` build tag at the top of the file. These files are reference examples for AI skill documentation, not project code, and frequently import external packages not in the project `go.mod`. Without the build tag, they break `go work vendor` (Rule 25) and CI builds. Any new Go file added to a skill assets directory MUST include this tag.
  66. **No Parallel Agent Work**: When manual intervention is in progress on a PR (per Rule 14/18 circuit breaker), no automated agent may push to that PR branch. The intervening agent MUST post a STOP comment on the PR explicitly instructing all automated agents to cease work BEFORE beginning any manual changes. Two agents (human-directed or autonomous) MUST NOT push to the same PR branch simultaneously, as this causes conflicting commits, force-push wars, and CI race conditions.
  67. **Agent Instructions in PR Comments**: Instructions directed at other AI agents (e.g., @google-labs-jules) MUST be posted as PR comments using `gh pr comment`, NOT embedded in the PR description body. PR comments appear in the conversation timeline and trigger notifications; PR body edits are silent and may be missed by automated agents watching for new comments. The PR body is reserved for: `Resolves #ISSUE_ID`, high-level description, changelog, and reviewer status sections.
  68. **Jules PR Detection and Labeling**: When a PR's first comment or PR body contains either of the phrases "PR created automatically by Jules" or "Jules, reporting for duty", the agent MUST add the `jules` label to the PR using `gh pr edit <PR_NUMBER> --add-label jules`. This label identifies PRs created by the Jules automated agent and selects the Jules-specific reviewer protocol (Rule 69). The detection MUST be performed before any reviewer interaction or feedback addressing begins.
  69. **Jules PR Reviewer Protocol**: When a PR has the `jules` label, all reviewer feedback, status updates, and actionable instructions directed at the Jules agent MUST be posted as PR comments by `alsotoes` (using a PAT), NOT by `github-actions[bot]`. The Jules agent only recognizes and acts upon comments from `alsotoes`; comments from the bot account are silently ignored. This overrides the default bot-reviewer comment identity (Rule 48) for Jules-created PRs. This is enforced at TWO levels: (1) the AI reviewer script (`.github/scripts/ai_reviewer.py`) posts actionable reviews directly via `gh pr comment` using the PAT when the PR is detected as Jules-created, and (2) the workflow (`.github/workflows/gemini_reviewer.yml`) checks for the `jules` label before posting and uses the PAT (`GITHUB_TOKEN`) instead of `BOT_TOKEN` when the label is present. The Gemini reviewer's review is still read by the human/agent to determine if issues exist, but any follow-up instructions to Jules (including STOP comments per Rule 66, feedback addressing per Rule 53, and merge status updates) MUST be re-posted by `alsotoes` using `gh pr comment <PR_NUMBER> --body "..."` from an authenticated `alsotoes` session.
  70. **Steering Rule → Reviewer Script Sync**: When any steering rule in `openspec/config.yaml` that governs PR review, labeling, commenting, merge, or automated agent behavior is added or modified, the AI reviewer script (`.github/scripts/ai_reviewer.py`) and its workflow (`.github/workflows/gemini_reviewer.yml`) MUST be reviewed and updated in the same PR to implement or enforce the new/changed behavior. The PR MUST NOT be merged until the script is verified to implement the new rule. This includes but is not limited to: PR detection logic (e.g., Rule 68 Jules detection), labeling (Rules 49, 52, 68), comment posting identity — bot vs PAT (Rules 48, 69), circuit breaker enforcement (Rules 14, 18), traceability checks (Rules 11, 20), merge gate conditions (Rule 55), and any rule defining how automated agents interact with PRs. A PR that adds or modifies such a rule MUST include changes to `.github/scripts/ai_reviewer.py` or a comment explaining why no script change is needed.
  71. **Master CI Gate Before New Work**: Before creating a new branch or starting any new task, the AI agent MUST verify that all CI workflows on the `master` branch are complete and passing. After merging a PR, GitHub Actions re-runs all workflows on `master`. The agent MUST NOT branch from `master` until every workflow run on the latest `master` commit shows `completed` status with `success` conclusion. Check using `gh run list --branch master --limit 5` and verify no runs show `in_progress`, `queued`, or `failure` status. If runs are still `in_progress` or `queued`, the agent MUST wait and poll until all complete. If any run fails, the agent MUST diagnose and fix the failure on `master` (per Rule 64) before starting new work. This guarantees every new branch originates from a fully validated, stable `master` and prevents branching from code that may be reverted or require fixes.
  72. **Issue Ownership Gate Before Work**: Before starting work on ANY GitHub issue (whether newly created, pre-existing, or picked up from a batch), the AI agent MUST first establish ownership and validate the issue's metadata. The agent MUST: (1) assign the issue to the project maintainer (`alsotoes`) using `gh issue edit <ISSUE_NUMBER> --add-assignee alsotoes`; (2) validate that the issue carries both the appropriate category label (`bug` for bug fixes, `enhancement` for features) and the `automation` label, adding any missing labels via `gh issue edit <ISSUE_NUMBER> --add-label <labels>`; and (3) only after ownership and labels are confirmed, begin implementation (create the branch per Rule 71). Issues lacking an assignee or the `automation` label are considered orphaned and MUST be remediated before any work begins. This rule complements Rule 49 (autonomously created tracking issues) and Rule 51/52 (PR assignment/labeling) by covering pre-existing and batch issues, preventing work on unowned or improperly-labeled issues.
  73. **Spec-First Implementation Mandate**: (Mandatory) ALL new features, spec-driven changes, and architectural shifts MUST first have an OpenSpec change proposal authored under `openspec/changes/<change-id>/` (containing `proposal.md`, `specs/<change-id>/spec.md`, and `tasks.md`) AND a corresponding GitHub issue to which the spec file links at the very top (Rule 11). The implementing Pull Request MUST include the OpenSpec change (spec documentation lands with, not after, the code) OR demonstrate that the change references an already-ratified spec, and MUST link the GitHub issue via the `Resolves #ISSUE_ID` keyword (Rule 11). This gate applies to features and architecture changes regardless of size; ONLY trivial internal bug fixes or refactors with no behavioral surface may proceed without a formal spec, and even those MUST still have a tracking issue. Performance optimizations that add or change a benchmark surface do NOT qualify for the trivial-refactor exemption: they are treated as feature enhancements and require the full OpenSpec change set plus a linked tracking issue. The AI Reviewer (per Rule 70) MUST verify spec + issue linkage for feature/enhancement PRs and flag any that merge a feature without an OpenSpec change or a linked GitHub issue. Spec-scope determination MUST use three-dot diff (`git diff origin/master...HEAD --name-only`) so a Rule 50 master merge does not inflate the PR's perceived spec-relevant file set.
  74. **Seam-Over-Plugins (Perf + Security)**: (Mandatory) All adaptive and mutating behaviors (e.g., degraded-read, self-heal/rebuild, R4 momofs FS semantics) MUST be implemented as compile-time Go interface seams — a Go interface, constructor/functional-option injection, and a compiled-in registry — selected by a declarative policy. External dynamic plugins (hashicorp/go-plugin, `buildmode=plugin` `.so`, or cross-process RPC) are FORBIDDEN in the data/compute path; they are allowed ONLY as read-only policy or control-plane feeds whose outputs are validated locally, and unknown/absent strategy names MUST fail closed. Fast (happy) paths MUST remain concrete and zero-indirect, with seams dispatching only at decision points, never inside the byte stream. Core trust invariants (CAS, content hashing, CRUSH/placement, verify-on-read, and the validate→write chokepoint) MUST remain compiled into the auditable core, and a seam MUST NOT bypass any of them. Adding or changing behavior = writing a new seam implementation, registering it, and flipping the declarative policy, all passing `make test`. See `docs/momofs/PLUGIN_ARCHITECTURE.md` (ratifies this rule; design precedent in `ADAPTIVE_SYSTEMS.md` §12).
  75. **No Networked pprof on Unauthenticated Listeners (Security)**: (Mandatory) Profiling MUST be captured via Go's built-in file-based test/test-binary flags (`go test -cpuprofile X -memprofile X -blockprofile X` plus `-bench`/`-benchmem`), producing `.pprof` files on disk. A `net/http/pprof` listener (or any HTTP debug endpoint exposing profiler/runtime internals) MUST NOT be bound on the unauthenticated data-path listener. Because momo has no auth/TLS, a networked pprof endpoint is a remote-code-execution-class surface (goroutine dumps, memory steering, crash paths). Any future runtime admin-profiling endpoint MUST be a dedicated listener bound to loopback or a Unix socket ONLY, explicitly enabled at boot (never default-on), and TLS/mTLS-protected if it ever leaves loopback. Extends the Rule 74 security contract. See `openspec/changes/perf-profiling-baseline/` (Phase-0 harness).
  76. **Blog Post Per Ratified Change**: (Mandatory) Every ratified feature/enhancement OpenSpec change MUST ship a matching Hugo-format blog post under `docs/blog/posts/` (markdown + YAML front matter per the schema in `docs/blog/README.md`) in the same PR as the spec or in an immediately-following PR. The post MUST: (1) describe the change's journey, research, and architecture decision; (2) carry a `date` front-matter field equal to the anchor GitHub issue/PR `createdAt` (`gh issue/pr view <N> --json createdAt`), or the earliest code-implementation/plan commit date when no issue anchor exists; (3) reflect IMPLEMENTED state only — grounded in verified `src/` code and docs OUTSIDE `docs/momofs/`, never presenting `docs/momofs/` design as shipped unless the matching code exists; (4) embed the ⚡ Bolt (performance) and/or 🛡 Sentinel (security) mindsets via `bolt`/`sentinel` tags and narrative, linking `docs/STANDARDS.md`; and (5) carry `artifacts` (openspec paths, PR/issue IDs) and `related` (sibling post cross-links). Internal-only changes with no narrative value MUST carry an explicit `no-blog` justification in the PR to be exempt. The AI Reviewer (per Rule 70) MUST flag enhancement PRs that ship a ratifiable spec surface with no post and no `no-blog` justification, withholding approval/merge. Posts are a narrative/link layer; they do not replace the OpenSpec change as source of truth (Rule 39). See `openspec/changes/blog-posts-hugo/`.

  77. **Architecture Decision Records (ADRs)**: (Mandatory) Every ratified feature/enhancement OpenSpec change MUST have a corresponding Architecture Decision Record (ADR) in `docs/adr/` following the template in `docs/adr/template.md`. The ADR MUST link the OpenSpec change, GitHub issue, PR, and blog post. The ADR status starts as `Proposed` during implementation and transitions to `Accepted` on merge. If a decision is superseded, a new ADR with a `Supersedes` link is created and the old ADR is marked `Deprecated`. The AI Reviewer (per Rule 70) MUST verify ADR presence for feature/enhancement PRs and flag any that merge without an ADR. See `docs/adr/README.md` for the index and process.

  79. **No Direct Push to Master (Branch Protection)**: (Mandatory) All changes to the `master` branch MUST go through the standard PR workflow: create issue → create branch from master → implement → open PR with `Resolves #ISSUE_ID` → CI green → reviewer approval → merge with `--merge --delete-branch`. Direct pushes to `master` are FORBIDDEN regardless of change size or type (documentation, bugfix, feature, refactor), **except** for the following explicit exceptions that MAY bypass the full issue/PR workflow:

     - **Pre-commit hook regenerations**: Auto-generated files (`.github/data/benchmark_history.csv`, `docs/PERFORMANCE.md`) regenerated by the pre-commit hook during normal commit workflow.
     - **Documentation-only changes**: Typos, clarifications, formatting, cross-reference updates, and documentation restructuring with ZERO code/behavioral changes.
     - **Trivial refactors**: Internal refactors with ZERO behavioral surface (e.g., variable renames, whitespace, dead code removal, import reordering) that do not alter any public API, wire protocol, configuration schema, or observable behavior.
     - **CI/pipeline fixes**: Infrastructure-only fixes to `.github/workflows/*.yml`, reviewer scripts, or build configuration that do not touch application code.
     - **Emergency hotfixes**: Critical production fixes authorized by the maintainer with a post-hoc issue created within 24 hours.

     For all exceptions above, the commit message MUST clearly state the exception category (e.g., `docs: fix typo in CONFIGURATION.md (doc-only)`), and the AI Reviewer (per Rule 70) MUST verify the exception claim is valid before allowing merge. Direct pushes to `master` for ANY other change (including documentation that alters behavior, config schema changes, or refactors touching logic) are FORBIDDEN. The AI Reviewer (per Rule 70) MUST reject any PR that appears to have been created after an invalid direct push to master. This rule complements Rule 1, Rule 71, and Rule 73.
