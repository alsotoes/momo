name: S3 Client Compatibility

on:
  push:
    branches: [master]
    paths:
      - 'src/transport/**'
      - 'src/server/**'
      - '.github/scripts/test-s3-client-compat.sh'
      - '.github/workflows/s3_client_compat.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/transport/**'
      - 'src/server/**'
      - '.github/scripts/test-s3-client-compat.sh'
      - '.github/workflows/s3_client_compat.yml'
  workflow_dispatch:

concurrency:
  group: s3-client-compat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aws-cli:
    name: aws-cli round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      # aws-cli is preinstalled on the runner image; the script skips cleanly if not.
      - name: S3 client compatibility
        run: ./.github/scripts/test-s3-client-compat.sh 7500
