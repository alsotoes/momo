name: Go

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'sonar-project.properties'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'sonar-project.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'

    - name: Build
      run: make build

    - name: Check Formatting (Rule 26)
      run: |
        make fmt
        if [ -n "$(git status --porcelain)" ]; then
          echo "Code is not formatted. Please run 'make fmt' locally."
          git diff
          exit 1
        fi

    - name: Check Vendoring Parity (Rule 25)
      run: |
        make vendor
        if [ -n "$(git status --porcelain vendor/)" ]; then
          echo "Vendor directory is out of sync. Please run 'go work vendor' locally."
          git status --porcelain vendor/
          exit 1
        fi

    - name: Check Scanner-Safe Secrets (Rule 29)
      run: .github/scripts/check-notsecret.sh

    - name: Test
      run: make test

    - name: Benchmark
      run: make benchmark

    - name: E2E Integration Tests
      run: make test-e2e

    - name: Coverage
      run: make coverage

    - name: Upload Coverage
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage.out

    - name: Cache SonarQube packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: SonarQube Cloud Scan
      if: ${{ secrets.SONAR_TOKEN != '' }}
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.host.url=https://sonarcloud.io
