name: Performance Comparison

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
  push:
    branches: [ "master" ]
    paths:
      - 'src/**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'

jobs:
  benchstat:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25.x'

    - name: Install benchstat
      # Pin benchstat: the current golang.org/x/perf tip bumped its go directive to
      # >= 1.26.0 (commit ebcb4798) and breaks the project's go 1.25.x CI. This
      # pseudo-version (2026-08-12) is the last one requiring go 1.25.
      run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260813145340-fd4a688df892

    - name: Run Benchmark on Base Branch (PR)
      if: github.event_name == 'pull_request'
      run: |
        git checkout -f ${{ github.event.pull_request.base.sha }}
        make benchmark COUNT=15 > /tmp/base_bench.txt
        git checkout -f -

    - name: Run Benchmark on Previous Commit (Push)
      if: github.event_name == 'push'
      run: |
        git checkout -f HEAD^1
        make benchmark COUNT=15 > /tmp/base_bench.txt
        git checkout -f -

    - name: Run Benchmark on Current Commit
      run: |
        make benchmark COUNT=15 > /tmp/current_bench.txt

    - name: Compare Benchmarks and Enforce Threshold
      run: |
        echo "## Performance Comparison (Benchstat)" >> $GITHUB_STEP_SUMMARY
        echo '```text' >> $GITHUB_STEP_SUMMARY
        benchstat /tmp/base_bench.txt /tmp/current_bench.txt | tee /tmp/bench_comparison.txt
        cat /tmp/bench_comparison.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Ignore sub-10ns micro-benchmarks known to be extremely noisy on virtualization.
        # Also ignore geomean as it's skewed by micro-benchmarks.
        # Skip the B/s throughput section: +X% there means faster (improvement, not degradation).
        if grep -v -E 'IndexSearch|CheckMetricsAndSwap|IndexDirectTracking|PadString|LoadGlobalConfig|SanitizeLog|geomean|RPC_Encode|HeartbeatPayload_Encode|PeerMap_|CrushOriginal|OPRFCombineThreshold3|DecryptStream|EncryptStream' /tmp/bench_comparison.txt | awk '
        # SanitizeLog is a sub-microsecond log-sanitization micro-benchmark with
        # runner-dependent variance well above 5% (base swings 20-35% between
        # identical reruns); ignored alongside the other noisy micro-benchmarks.
        /B\/s.*vs base/ { in_bps=1; next }
        /sec\/op.*vs base/ || /B\/op.*vs base/ || /allocs\/op.*vs base/ { in_bps=0 }
        in_bps { next }
        /\+[0-9]+\.[0-9]+%/ {
            match($0, /\+([0-9]+\.[0-9]+)%/, arr)
            if (arr[1] + 0 > 5.0) {
                print "❌ Performance degradation > 5% detected: +" arr[1] "%"
                exit 1
            }
        }'; then
          echo "✅ No significant performance degradation (> 5%) detected." >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Performance degradation > 5% detected! Failing the pipeline." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
