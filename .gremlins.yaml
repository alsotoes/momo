# Gremlins mutation testing configuration for Momo (Go)
# Run on changed packages: make mutation-check
unleash:
  tags: ""
  integration: false
  dry-run: false
  exclude-files:
    - "_test\\.go$"
    - "src/momo\\.go$"
  # Report-only thresholds (0) so equivalent mutants on log/timeout lines
  # surface in output without tripping the 3-push Jules circuit breaker (Rule 14/18).
  threshold:
    efficacy: 0
    mutant-coverage: 0

mutants:
  arithmetic-base:
    enabled: true
  conditionals-boundary:
    enabled: true
  conditionals-negation:
    enabled: true
  increment-decrement:
    enabled: true
  invert-assignments:
    enabled: false
  invert-bitwise:
    enabled: false
  invert-bwassign:
    enabled: false
  invert-logical:
    enabled: false
  invert-loopctrl:
    enabled: false
  invert-negatives:
    enabled: true
