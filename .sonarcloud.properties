# SonarCloud Automatic Analysis configuration
# Scopes analysis strictly to application source files, excluding vendor, tests, and submodules
sonar.sources=src
sonar.exclusions=vendor/**,**/vendor/**,**/*_test.go,**/testing.go,**/*.sum,docs/blog/themes/**,**/themes/**,**/.gitmodules,**/.git/**,**/submodules/**
sonar.scm.exclusions.disabled=false
