groups:
  - name: momo_alerts
    rules:
      - alert: MomoHighErrorRate
        expr: rate(momo_errors_total[1m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Momo error rate is high"
          description: "Error rate is {{ $value }} per second on {{ $labels.instance }}"

      - alert: MomoNodeDown
        expr: up{job="momo"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Momo node is down"
          description: "{{ $labels.instance }} has been down for more than 30 seconds"

      - alert: MomoHighGoroutines
        expr: momo_goroutines > 1000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High goroutine count"
          description: "{{ $labels.instance }} has {{ $value }} goroutines"

      - alert: MomoHighMemory
        expr: momo_memory_alloc_bytes > 1073741824
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "{{ $labels.instance }} is using {{ $value }} bytes of memory"

      - alert: MomoDiskPressure
        expr: momo_disk_free_bytes / (momo_disk_used_bytes + momo_disk_free_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "{{ $labels.instance }} has less than 10% free disk in the data directory"

      - alert: MomoSwimAlivePeersDropped
        expr: momo_swim_alive_count < 2 and on(instance) momo_cluster_peers > 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Quorum peers lost"
          description: "Only {{ $value }} alive peers on {{ $labels.instance }} while the cluster has more than 2 known peers"

      - alert: MomoLeaseStarvation
        expr: momo_leases_active > momo_cluster_peers * 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Lease count unusually high"
          description: "{{ $labels.instance }} holds {{ $value }} leases — possible lease leak"

      - alert: MomoScatterTimeouts
        expr: rate(momo_scatter_timeout_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scatter-gather timeouts"
          description: "{{ $labels.instance }} is experiencing {{ $value }}/s scatter-gather timeouts"

      - alert: MomoReplicationFailures
        expr: rate(momo_replication_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Replication failures"
          description: "{{ $labels.instance }} is failing {{ $value }}/s replication forwards — durability risk"

      - alert: MomoBlobCountSpike
        expr: rate(momo_blob_count[5m]) * 60 > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rapid blob growth"
          description: "{{ $labels.instance }} is adding {{ $value }}/min blobs — possible dedup regression or ingest burst"

      - alert: MomoCoordinationQuorumLost
        expr: increase(momo_coordination_quorum_loss_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Coordination quorum lost"
          description: "{{ $labels.instance }} suspended coordination {{ $value }} time(s) in 10m — the node lost its lease quorum and stands by"

      - alert: MomoCoordinationHandoffChurn
        expr: increase(momo_coordination_handoffs_total[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Repeated coordination handoffs"
          description: "{{ $labels.instance }} resigned coordination {{ $value }} times in 15m — load or health thresholds are flapping"

      - alert: MomoPeerSaturation
        expr: max by (instance) (momo_peer_inflight_requests) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Peer reporting a long request queue"
          description: "A peer seen by {{ $labels.instance }} reports {{ $value }} in-flight requests — shedding will avoid it, but the node is overloaded"

      - alert: MomoPeerDiskHigh
        expr: max by (instance) (momo_peer_disk_used_percent) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Peer disk above the shedding high-water mark"
          description: "A peer seen by {{ $labels.instance }} is at {{ $value }}% disk — rebalance should be moving cold blobs off it"
